                            <div
                              key={g.id}
                              className="rounded-sm px-2.5 py-1.5 flex items-center justify-between gap-2"
                              style={{
                                background: given ? "rgba(212,168,118,0.14)" : "rgba(201,194,174,0.05)",
                                border: given ? "1px solid rgba(212,168,118,0.4)" : "1px solid rgba(201,194,174,0.2)",
                              }}
                            >
                              <div className="flex items-center gap-2 min-w-0">
                                <g.Icon size={14} style={{ color: given ? "#D4A876" : "#8C8272", flexShrink: 0 }} />
                                <span className="font-label text-sm truncate" style={{ color: given ? "#D4A876" : "#B8B0A0" }}>{g.name}</span>
                              </div>
                              {given ? (
                                <span className="font-label text-xs italic opacity-70 flex-shrink-0" style={{ color: "#D4A876" }}>✦ given</span>
                              ) : (
                                <button
                                  onClick={() => donateToPantheon(g)}
                                  disabled={!affordable}
                                  className="min-w-[68px] px-2 py-1 rounded-sm font-label text-xs flex items-center justify-center gap-1 flex-shrink-0"
                                  style={{
                                    background: "rgba(212,168,118,0.12)",
                                    border: "1px solid rgba(212,168,118,0.35)",
                                    color: "#D4A876",
                                    opacity: affordable ? 1 : 0.45,
                                    cursor: affordable ? "pointer" : "not-allowed",
                                  }}
                                >
                                  {formatNum(resources[g.id] || 0)}/{formatNum(cost)}
                                </button>
                              )}
                            </div>
                          );
                        })}
                        <div className="text-center pt-1">
                          <button
                            onClick={raisePantheon}
                            disabled={!GODS.every((g) => pantheonDonations[g.id])}
                            className="mt-1 px-5 py-2 rounded-sm font-display text-sm tracking-wide"
                            style={{
                              background: "rgba(212,168,118,0.14)",
                              border: "1px solid rgba(212,168,118,0.45)",
                              color: "#D4A876",
                              opacity: GODS.every((g) => pantheonDonations[g.id]) ? 1 : 0.45,
                              cursor: GODS.every((g) => pantheonDonations[g.id]) ? "pointer" : "not-allowed",
                            }}
                          >
                            Raise the Pantheon
                          </button>
                        </div>
                      </div>
                    ) : (
                      <p className="font-label text-xs opacity-60">
                        {templeCount} of {GODS.length} altars have reached Sanctuary
                      </p>
                    )}
                  </div>
                )}

                {/* Golden Age only — the age's own ending, on top of the universal Pantheon
                    above. Prometheus first (a single choice, not a decision to weigh), then
                    Pandora (deliberately vague name, gifts revealed only as each is affordable).
                    Rendered as a modal overlay, not an inline panel — this is a single
                    narrative beat that should demand attention, not just be another card to
                    scroll past. */}
                {/* Prometheus arrives only once the Pantheon feast has burned out — the
                    capstone and the theft used to land on top of each other. Two screens:
                    the story first, then the choice, so stealing is a decision rather than
                    something you click past. */}
                {ageIndex === 0 && pantheonLevel > 0 && !prometheusFireStolen && !feastRunning && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center px-8" style={{ background: "rgba(10,8,5,0.72)" }}>
                    <div
                      className="notif-corner-in text-center max-w-sm rounded-sm p-6"
                      style={{ background: "rgba(28,24,16,0.97)", border: "1px solid rgba(212,168,118,0.35)", boxShadow: "0 8px 32px rgba(0,0,0,0.5)" }}
                    >
                      {prometheusStep === 0 ? (
                        <>
                          <Typewriter
                            text={"The Pantheon stands, and every god is inside it.\n\nThe forge at Hephaestus's altar is unattended. It has been for some time now. Someone has been counting.\n\nHe is not one of yours. He was here before the mountain had a name."}
                            className="font-label text-base opacity-85 italic mb-5 text-left leading-relaxed"
                            style={{ whiteSpace: "pre-line", cursor: "pointer" }}
                            onDone={() => setPrometheusTextDone(true)}
                          />
                          {prometheusTextDone && (
                            <button
                              onClick={() => setPrometheusStep(1)}
                              className="notif-corner-in px-6 py-2.5 rounded-sm font-display text-sm tracking-wide"
                              style={{ background: "rgba(212,168,118,0.14)", border: "1px solid rgba(212,168,118,0.45)", color: "#D4A876" }}
                            >
                              Continue
                            </button>
                          )}
                        </>
                      ) : (
                        <>
                          <p className="font-label text-base opacity-80 italic mb-5">
                            He waits. Whatever happens next, it will be said that you allowed it.
                          </p>
                          {/* "Leave it" is offered and does not work. Pressing it says
                              nothing — the option simply fades out and is not there any
                              more, which is the whole point of the myth stated quietly. */}
                          <div className="flex items-center justify-center gap-3">
                            <button
                              onClick={stealFire}
                              className="px-6 py-2.5 rounded-sm font-display text-sm tracking-wide"
                              style={{ background: "rgba(212,168,118,0.14)", border: "1px solid rgba(212,168,118,0.45)", color: "#D4A876" }}
                            >
                              Steal it
                            </button>
                            <button
                              onClick={() => setRefusedOnce(true)}
                              disabled={refusedOnce}
                              className="px-6 py-2.5 rounded-sm font-display text-sm tracking-wide"
                              style={{
                                background: "rgba(201,194,174,0.06)",
                                border: "1px solid rgba(201,194,174,0.28)",
                                color: "#C9C2AE",
                                opacity: refusedOnce ? 0 : 1,
                                pointerEvents: refusedOnce ? "none" : "auto",
                                transition: "opacity 1.1s ease",
                              }}
                            >
                              Leave it
                            </button>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                )}

                {ageIndex === 0 && pantheonLevel > 0 && prometheusFireStolen && !pandoraCreated && giftDone && (
                  <div ref={(el) => { rowRefs.current.pandora = el; }} className="mt-5 pt-4" style={{ borderTop: "1px solid rgba(212,168,118,0.28)" }}>
                    <h3 className="font-display text-base tracking-wide mb-1 text-center" style={{ color: "#D4A876" }}>A Gift to Mankind</h3>
                    <p className="font-label text-xs opacity-60 italic mb-3 text-center">Each god gives what is theirs to give.</p>
                    <div className="space-y-1.5 mb-3">
                      {GODS.map((g) => {
                        const cost = pandoraCost(g);
                        const given = !!pandoraDonations[g.id];
                        const affordable = (resources[g.id] || 0) >= cost;
                        return (
                          <div
                            key={g.id}
                            className="rounded-sm px-2.5 py-1.5 flex items-center justify-between gap-2"
                            style={{
                              background: given ? "rgba(212,168,118,0.14)" : "rgba(201,194,174,0.05)",
                              border: given ? "1px solid rgba(212,168,118,0.4)" : "1px solid rgba(201,194,174,0.2)",
                            }}
                          >
                            <div className="flex items-center gap-2 min-w-0">
                              <g.Icon size={14} style={{ color: given ? "#D4A876" : "#8C8272", flexShrink: 0 }} />
                              <span className="font-label text-sm truncate" style={{ color: given ? "#D4A876" : "#B8B0A0" }}>
                                {given ? PANDORA_GIFTS[g.id] : g.name}
                              </span>
                            </div>
                            {given ? (
                              <span className="font-label text-xs italic opacity-70 flex-shrink-0" style={{ color: "#D4A876" }}>✦ given</span>
                            ) : (
                              <button
                                onClick={() => donateToPandora(g)}
                                disabled={!affordable}
                                className="min-w-[68px] px-2 py-1 rounded-sm font-label text-xs flex items-center justify-center gap-1 flex-shrink-0"
                                style={{
                                  background: "rgba(212,168,118,0.12)",
                                  border: "1px solid rgba(212,168,118,0.35)",
                                  color: "#D4A876",
                                  opacity: affordable ? 1 : 0.45,
                                  cursor: affordable ? "pointer" : "not-allowed",
                                }}
                              >
                                {formatNum(resources[g.id] || 0)}/{formatNum(cost)}
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    <div className="text-center">
                      <button
                        onClick={createPandora}
                        disabled={!GODS.every((g) => pandoraDonations[g.id])}
                        className="px-5 py-2 rounded-sm font-display text-sm tracking-wide"
                        style={{
                          background: "rgba(212,168,118,0.14)",
                          border: "1px solid rgba(212,168,118,0.45)",
                          color: "#D4A876",
                          opacity: GODS.every((g) => pandoraDonations[g.id]) ? 1 : 0.45,
                          cursor: GODS.every((g) => pandoraDonations[g.id]) ? "pointer" : "not-allowed",
                        }}
                      >
                        Create
                      </button>
                    </div>
                  </div>
                )}

                {allBuilt && pantheonLevel > 0 && (ageIndex !== 0 || pandoraCreated) && (
                  <button
                    onClick={ascend}
                    className="w-full mt-4 py-3 rounded-sm font-display text-base tracking-wide flex items-center justify-center gap-2"
                    style={{ background: "linear-gradient(135deg, #687965, #4a5548)", border: "1px solid #979e88", color: "#E4E7DC" }}
                  >
                    <Star size={16} /> Ascend to the Next Age
                  </button>
                )}
              </div>

              <div className={`${activeTab === "chronicle" ? "block" : "hidden"} md:block`}>
                <div className="flex items-center justify-between mb-3">
                  <h2 className="font-display text-lg" style={{ color: "#D4A876" }}>
                    {chronicleView === "chronicle" ? "The Chronicle" : "The Rites"}
                  </h2>
                  <div className="flex rounded-sm overflow-hidden flex-shrink-0" style={{ border: "1px solid rgba(212,168,118,0.35)" }}>
                    <button
                      onClick={() => setChronicleView("chronicle")}
                      className="px-2.5 py-1 font-label text-xs"
                      style={{
                        background: chronicleView === "chronicle" ? "rgba(212,168,118,0.2)" : "transparent",
                        color: chronicleView === "chronicle" ? "#D4A876" : "#D9D2BE",
                      }}
                    >
                      Chronicle
                    </button>
                    <button
                      onClick={() => setChronicleView("rites")}
                      className="px-2.5 py-1 font-label text-xs"
                      style={{
                        background: chronicleView === "rites" ? "rgba(212,168,118,0.2)" : "transparent",
                        color: chronicleView === "rites" ? "#D4A876" : "#D9D2BE",
                      }}
                    >
                      The Rites
                    </button>
                  </div>
                </div>

                {chronicleView === "chronicle" ? (
                  <>
                    <div
                      className="rounded-sm p-4 md:p-5 max-h-[560px] overflow-y-auto"
                      style={{ background: "rgba(151,158,136,0.06)", border: "1px solid rgba(212,168,118,0.28)" }}
                    >
                      {[...chronicle].reverse().map((entry) => (
                        <div key={entry.id} className="entry-anim mb-5 last:mb-0">
                          {entry.chapter && (
                            <div className="flex items-center gap-3 my-4">
                              <div className="flex-1 h-px" style={{ background: "linear-gradient(to right, transparent, #D4A876)" }} />
                              <span className="font-display text-sm tracking-[0.2em] uppercase" style={{ color: "#D4A876" }}>{entry.chapter}</span>
                              <div className="flex-1 h-px" style={{ background: "linear-gradient(to left, transparent, #D4A876)" }} />
                            </div>
                          )}
                          {entry.title && (
                            <div className="font-display text-base mb-1" style={{ color: "#D4A876" }}>{entry.title}</div>
                          )}
                          <p className="text-base leading-relaxed opacity-90" style={{ fontStyle: entry.id === "prologue" ? "italic" : "normal" }}>
                            {entry.text}
                          </p>
                        </div>
                      ))}
                    </div>
                    <p className="font-label text-xs text-center opacity-60 mt-4">
                      <button onClick={resetProgress} className="underline opacity-70 hover:opacity-100" style={{ color: "#C98A7A" }}>
                        Erase History
                      </button>
                    </p>
                  </>
                ) : (
                  <div
                    className="rounded-sm p-4 md:p-5 max-h-[560px] overflow-y-auto"
                    style={{ background: "rgba(151,158,136,0.06)", border: "1px solid rgba(212,168,118,0.28)" }}
                  >
                    {RITES_SECTIONS.map((section, si) => (
                      <div key={section.title} className="mb-5 last:mb-0">
                        <div className="flex items-center gap-3 my-4" style={{ marginTop: si === 0 ? 0 : undefined }}>
                          <div className="flex-1 h-px" style={{ background: "linear-gradient(to right, transparent, #D4A876)" }} />
                          <span className="font-display text-sm tracking-[0.15em] uppercase" style={{ color: "#D4A876" }}>{section.title}</span>
                          <div className="flex-1 h-px" style={{ background: "linear-gradient(to left, transparent, #D4A876)" }} />
                        </div>
                        {section.body.map((para, pi) => (
                          <p key={pi} className="text-base leading-relaxed opacity-90 mb-2 last:mb-0">
                            {renderRitesText(para)}
                          </p>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            </div>
          </div>

      </div>

      <div className="fixed bottom-0 inset-x-0 z-40 px-4 pt-2" style={{ background: "linear-gradient(to top, #15120A 60%, transparent)", paddingBottom: "calc(0.75rem + env(safe-area-inset-bottom))" }}>
        <div className="max-w-5xl mx-auto relative">
          {offerPops.map((pop) => (
            <span
              key={pop.id}
              className="float-pop absolute left-1/2 -top-3 font-display text-sm pointer-events-none flex items-center gap-1"
              style={{ color: "#8fcfef", transform: `translateX(${pop.x}px)` }}
            >
              +{(1 + offeringBonus).toFixed(1).replace(/\.0$/, "")} <KleosBadge size={13} color="#8fcfef" />
            </span>
          ))}
          {(!hasOffered || (hasOffered && built.length === 0) || showFlowHint) && (
            <p className="font-label text-sm opacity-90 text-center mb-1.5">
              {!hasOffered
                ? "The mountain is silent. One offering lights the first spark."
                : built.length === 0
                ? kleos >= GODS_BY_ID["hestia"].kleosCost
                  ? "The spark is lit. Hestia's altar awaits."
                  : kleos > 0
                  ? "The spark is lit. Maybe a few more offerings."
                  : "The spark is lit. Raise Hestia's altar to let Kleos flow."
                : "Kleos flows on its own now — offerings just nudge it along."}
            </p>
          )}
          <button
            onClick={offer}
            className="w-full py-3 rounded-sm font-label text-sm tracking-wide transition-all active:scale-95 shadow-lg"
            style={{
              background: offerFlash ? "transparent" : "rgba(50,129,179,0.25)",
              border: offerFlash ? "1px solid rgba(50,129,179,0.35)" : "1px solid rgba(50,129,179,0.7)",
              color: "#8fcfef",
              opacity: offerFlash ? 0.6 : 1,
              transitionDuration: offerFlash ? "0ms" : "300ms",
              backdropFilter: "blur(4px)",
            }}
          >
            Make an Offering (+{(1 + offeringBonus).toFixed(1).replace(/\.0$/, "")} Kleos)
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OlympusChronicle />);

</script>
</body>
</html>
