  function recruitHiereus(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level < HIEREUS_MIN_LEVEL) return;
    if ((stats.hiereus || 0) >= hiereusSlots(stats.level)) return;
    const cost = hiereusCost(stats.hiereus || 0);
    if (kleos < cost) return;
    logTestEvent("hiereus_hired", { god: god.id, count: (stats.hiereus || 0) + 1 });
    setKleos((k) => k - cost);
    const nextStats = { ...stats, hiereus: (stats.hiereus || 0) + 1 };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    if ((stats.hiereus || 0) === 0) {
      // this Hiereus is the altar's first — same quiet-otherwise, notify-once pattern as
      // the first Zakoros above.
      setHorme((h) => h + TUNING.hormeSources.firstHiereus);
      fireNotification(`${god.name}'s first Hiereus.\n+${TUNING.hormeSources.firstHiereus} Hormē`, "#D4A876", null, null, false, true, null, true);
    }
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification, setOfferingBonus, triggerRite);
    appeaseGod(god.id);
    maybeShowSilenceFlavor(god.id);
    triggerRite("hiereus");
    if ((stats.hiereus || 0) === 0) triggerRite("festival"); // this Hiereus is the altar's first — Festival just opened up
  }

  function recruitOracleAltar(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level < 9 || (stats.hiereus || 0) < 3 || (stats.oracle || 0) >= 1) return;
    const cost = oracleAltarCost(god);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    setHorme((h) => h + TUNING.hormeSources.oracle);
    const nextStats = { ...stats, oracle: 1 };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification, setOfferingBonus, triggerRite);
    appeaseGod(god.id);
  }

  function upgradeAgora() {
    const cost = agoraUpgradeCost(agoraLevel);
    if (kleos < cost) return;
    setKleos((k) => k - cost);
    setAgoraLevel((l) => l + 1);
  }

  function buildThesauros() {
    if (thesaurosBuilt) return;
    if (kleos < TUNING.thesauros.cost) return;
    logTestEvent("thesauros_built", {});
    triggerRite("thesauros");
    setKleos((k) => k - TUNING.thesauros.cost);
    setThesaurosBuilt(true);
  }

  function upgradeFarm() {
    const cost = farmUpgradeCost(farmLevel);
    const totalWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
    if (kleos < cost || totalWorshippers < farmFollowerReq(farmLevel)) return;
    setKleos((k) => k - cost);
    setFarmLevel((l) => l + 1);
  }

  function harvestNow() {
    const now = Date.now();
    if (harvestWindowUntil.current === 0 || now > harvestWindowUntil.current) return; // window not open
    harvestBoostUntil.current = now + TUNING.farm.harvestBoostMs;
    harvestWindowUntil.current = 0;
    harvestWindowStart.current = now;
    harvestWindowNext.current = now + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
    fireNotification(`The harvest is good. The Agros doubles its bounty for ${Math.round(TUNING.farm.harvestBoostMs / 60000)} minutes.`, "#C2BA6E");
  }

  function exchangeSilver(amount) {
    const amt = Math.min(amount, Math.floor(silverCoins));
    if (amt <= 0) return;
    setSilverCoins((sc) => sc - amt);
    setKleos((k) => k + amt * SILVER_TO_KLEOS_RATE);
  }

  function exchangeSilverForResource(amount, godId) {
    const god = GODS_BY_ID[godId];
    if (!god) return;
    const amt = Math.min(amount, Math.floor(silverCoins));
    const units = Math.floor(amt * TUNING.silverToResource);
    if (units <= 0) return;
    setSilverCoins((sc) => sc - amt);
    setResources((r) => ({ ...r, [godId]: capResource((r[godId] || 0) + units) }));
  }

  // Grants every worshipper milestone crossed between oldCount (exclusive) and newCount
  // (inclusive) — not just an exact match. Needed because Festival's worshipper variant
  // grants several at once and can jump straight past a threshold without ever landing on
  // it exactly, unlike direct recruitment which always increments by 1. Without this, a
  // milestone crossed via Festival silently granted nothing.
  //
  // REBALANCED: worshipper milestones used to also grant a permanent altar production bonus
  // and a permanent Offering bonus, on top of Hormē and a one-time resource gift — decided
  // this was too many different reward types stacked on one milestone family. The production
  // bonus moved to altar STAGE crossings (Temple/Grand Temple/Sanctuary) instead, and the
  // Offering bonus moved to the Full Clergy achievement — see upgradeAltar's stage-crossing
  // block and checkAltarAchievements respectively. Worshipper milestones now grant only
  // Hormē and the one-time resource gift.
  function grantWorshipperMilestones(god, stats, oldCount, newCount) {
    const crossed = MILESTONES.filter((m) => m.count > oldCount && m.count <= newCount);
    if (crossed.length === 0) return;
    const g = TUNING.milestoneGift;
    const hs = TUNING.hormeSources;
    let totalReward = 0, totalHorme = 0;
    const newMilestonesReached = [...(stats.milestonesReached || [])];
    const chronicleEntries = [];
    const noteLines = [];
    crossed.forEach((milestone) => {
      const reward = Math.ceil(g.base + horme * g.perHorme);
      const hormeGrant = milestone.count === 10 ? hs.worshipper10 : milestone.count === 25 ? hs.worshipper25 : hs.worshipper50;
      totalReward += reward;
      totalHorme += hormeGrant;
      newMilestonesReached.push(milestone.count);
      const title = milestone.title || god.cultTitle;
      const text = milestone.text ? milestone.text(god.name) : god.cultText(god.name);
      const chronicleTitle =
        milestone.count === 10 ? `${god.name}'s altar drew its first followers.`
        : milestone.count === 25 ? `${god.name}'s cult began to form.`
        : `${god.name}'s followers became ${god.cultTitle}.`;
      chronicleEntries.push({ id: `${god.id}-milestone-${milestone.count}`, chapter: null, text, title: chronicleTitle });
      noteLines.push(`${title}: ${god.name}\n+${formatNum(reward)} ${god.resourceName}, +${hormeGrant} Hormē`);
    });
    setResources((r) => ({ ...r, [god.id]: capResource((r[god.id] || 0) + totalReward) }));
    setHorme((h) => h + totalHorme);
    setGodStats((s) => ({
      ...s,
      [god.id]: {
        ...s[god.id],
        milestonesReached: newMilestonesReached,
      },
    }));
    // Chronicle entries fire only the first time each milestone is ever reached for this
    // god, across every age — same reasoning as the altar-raised entry above. The actual
    // rewards (Hormē, resource) above this still apply every single age regardless; only
    // the repeated Chronicle text is being skipped here.
    setChronicle((c) => {
      const existingIds = new Set(c.map((e) => e.id));
      const freshEntries = chronicleEntries.filter((e) => !existingIds.has(e.id));
      return freshEntries.length ? [...c, ...freshEntries] : c;
    });
    noteLines.forEach((line) => fireNotification(line, "#6FA8C9", null, null, false, true, null, true));
    triggerRite("worshipperMilestones");
  }

  function recruitWorshipper(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if ((stats.worshippers || 0) >= TUNING.worshipperCap) return;
    const cost = worshipperCostFor(stats);
    if (kleos < cost) return;
    const needsGrain = ageIndex >= 1 && built.includes("demeter"); // Silver Age onward, and only once Demeter exists (avoids a bootstrap deadlock)
    const gCost = needsGrain ? grainCostFor(stats) : 0;
    if (needsGrain && (resources.demeter || 0) < gCost) return;
    if (needsGrain) triggerRite("grainCost");
    setKleos((k) => k - cost);
    if (needsGrain) {
      setResources((r) => ({ ...r, demeter: (r.demeter || 0) - gCost }));
    }
    const newCount = stats.worshippers + 1;
    setGodStats((s) => ({ ...s, [god.id]: { ...stats, worshippers: newCount } }));
    grantWorshipperMilestones(god, stats, stats.worshippers, newCount);
    appeaseGod(god.id);
    maybeShowSilenceFlavor(god.id);
    triggerRite("worshipper");
  }

  // Checked every tick, not just on build — a flat per-altar clock needs no trigger event.
  // Matured altars (full staff, full clergy, Oracle, level 10) are exempt: that achievement
  // exists to say an altar sustains itself from here, and continuing to threaten it with
  // neglect would say the opposite.
  function checkForNeglect() {
    const N = TUNING.neglect;
    const now = Date.now();
    // Grace period from the moment the app is opened — a settle-in window before Neglect
    // starts announcing anything, so the very first tick after opening doesn't immediately
    // interrupt with a banner before the screen has even rendered. Doesn't change *whether*
    // an altar is neglected — the countdown below is already paused while closed, so there's
    // nothing to "catch up" on here — just a short delay on *announcing* it.
    if (now - sessionStartAt.current < TUNING.neglect.graceOnOpenMs) return;
    // Collect everything crossing the line in this same pass, rather than firing a banner
    // per altar as each is found — several altars can still legitimately reach zero on the
    // same tick (e.g. all built and left untouched around the same moment), and a wall of
    // separate "X grows resentful" popups for the same moment reads as more punishing than
    // the mechanic actually is. One combined line covers all of them; a single altar keeps
    // its own name.
    const newlyNeglected = [];
    const nextMsLeft = { ...neglectMsLeft.current };
    built.forEach((id) => {
      if (neglectedGods[id]) return; // already resentful, nothing new to detect
      const stats = godStats[id];
      if (stats && (stats.achievementsReached || []).includes("complete")) return;
      const current = nextMsLeft[id] ?? N.timeoutMs;
      const updated = current - 1000; // one tick = 1000ms, matches the interval below
      nextMsLeft[id] = updated;
      if (updated <= 0) newlyNeglected.push(id);
    });
    neglectMsLeft.current = nextMsLeft;
    if (newlyNeglected.length === 0) return;

    setNeglectedGods((n) => {
      const next = { ...n };
      newlyNeglected.forEach((id) => { next[id] = true; });
      return next;
    });

    // Said once per fall, never repeated — the red altar row carries the state from here,
    // so you're interrupted once and can see where you stand for as long as it lasts.
    let anyFirstTime = false;
    newlyNeglected.forEach((id) => {
      logTestEvent("altar_neglected", { god: id });
      const g = GODS_BY_ID[id];
      const firstTime = !wrathChronicled[id];
      if (firstTime) {
        anyFirstTime = true;
        setWrathChronicled((w) => ({ ...w, [id]: true }));
        setChronicle((c) => [...c, {
          id: `${id}-neglected-${Date.now()}`, chapter: null,
          title: `${g.name} grew resentful, neglected while others rose.`,
          text: `${g.name}'s altar falls further behind the rest each day — barely tended, while other altars rise around it. The god notices. Every offering made elsewhere is, in some small way, an offering not made here.`,
        }]);
      }
    });

    triggerRite("neglect");

    if (newlyNeglected.length === 1) {
      const g = GODS_BY_ID[newlyNeglected[0]];
      fireNotification(`${g.name} grows resentful — neglected.`, "#C98A7A", null, null, false, anyFirstTime);
    } else {
      fireNotification(`${newlyNeglected.length} gods feel overlooked.`, "#C98A7A", null, null, false, anyFirstTime);
    }
  }

  // Any attention paid to the altar settles the god, and resets its clock — it doesn't have
  // to be an upgrade specifically; upgrades are paid in the god's own resource, which
  // resentment has already reduced, so requiring one would make the punishment prolong its
  // own cure. A worshipper costs Kleos and is always available.
  function appeaseGod(godId) {
    touchAltar(godId);
    if (!neglectedGods[godId]) return;
    setNeglectedGods((n) => { const next = { ...n }; delete next[godId]; return next; });
    logTestEvent("altar_appeased", { god: godId });
    fireNotification(`${GODS_BY_ID[godId].name} is appeased.`, "#A8C99A", null, null, false, false);
  }

  // Queues a Rites entry the first time its trigger fires. Safe to call repeatedly — it's a
  // no-op once the entry has been seen, or already sits in the queue, or the player has
  // switched tutorials off entirely.
  function triggerRite(id) {
    if (!tutorialEnabled) return;
    if (ritesUnlocked.includes(id)) return;
    // BUG FIX: a proactive rite (Resources, First Altar) is watched by an effect that
    // re-runs on every change to some frequently-changing value (resources/kleos, both tick
    // every second) — while the popup for that SAME rite is currently open, `ritesUnlocked`
    // doesn't include it yet (only added on close) and `riteQueue` is already empty (already
    // pulled into activeRite), so without this check the watching effect would silently
    // re-queue the same rite while it's still showing. The moment the player closed it, the
    // pull effect immediately found the re-queued copy and reopened it — confirmed directly:
    // "tapped Understood, it reopened immediately." This check closes that window for every
    // rite, not just the two currently affected.
    if (activeRite === id) return;
    setRiteQueue((q) => (q.includes(id) ? q : [...q, id]));
  }

  // Pulls the next queued entry into view once the current one (if any) has been closed.
  // A plain effect rather than doing this inline at trigger time — triggerRite can fire
  // from deep inside several different action functions, and centralizing "what shows next"
  // here means none of those call sites need to know whether something is already showing.
  useEffect(() => {
    if (activeRite || riteQueue.length === 0) return;
    const [next, ...rest] = riteQueue;
    setActiveRite(next);
    setRiteQueue(rest);
  }, [activeRite, riteQueue]);

  // Fires the moment the Pantheon becomes available to donate to at all — all thirteen
  // altars built, regardless of their level.
  useEffect(() => {
    if (pantheonReady) triggerRite("pantheon");
  }, [pantheonReady]);

  // Fires as soon as the Pantheon is raised — not gated on Pandora/Judgement being done, so
  // the player learns the mechanic while nothing else is competing for attention, rather than
  // right after Pandora's own reveal sequence ("The world as we knew it is no more"). By the
  // time Ascend actually becomes available, nothing new pops up — it's already explained.
  useEffect(() => {
    if (allBuilt && pantheonLevel >= 1) {
      triggerRite("ascension");
    }
  }, [allBuilt, pantheonLevel]);

  function closeActiveRite() {
    if (!activeRite) return;
    setRitesUnlocked((u) => (u.includes(activeRite) ? u : [...u, activeRite]));
    setActiveRite(null);
  }

  // Only rites with ONE fixed, physical place to point to get a "Show me" jump link — the
  // per-altar mechanics (Zakoros, Hiereus, Oracle, Festival, etc.) live inside all 13 altar
  // panels individually, not one location, so they're deliberately excluded here.
  function jumpToRiteLocation(riteKey) {
    closeActiveRite();
    if (riteKey === "pantheon") {
      setActiveTab("pantheon");
      return;
    }
    // Agora/Agros/Thesauros all live in the Mortals view of the main Olympus tab —
    // expandedBuilding's own key differs slightly from the rite key for Agros ("farm",
    // matching how the building's state has always been named internally).
    const buildingKey = riteKey === "agros" ? "farm" : riteKey;
    setActiveTab("build");
    setBuildView("mortals");
    setExpandedBuilding(buildingKey);
  }

  function upgradeAltar(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level >= 10) return; // Level 10 is the final stage — no further building
    // See zakorosNeededForLevel's own comment for the current 1/1/2/2/2/5/5/5/8/8 curve —
    // every level requires at least 1 Zakoros now, held flat through each stage.
    if ((stats.zakoros || 0) < zakorosNeededForLevel(stats.level)) return;
    const cost = upgradeCost(god, stats.level);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    triggerRite("upgrade");
    const newLevel = stats.level + 1;
    logTestEvent("level_up", { god: god.id, newLevel });
    const nextStats = { ...stats, level: newLevel };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    const stage = STAGES.find((s) => s.level === newLevel);
    if (stage) {
      const tier = STAGES.indexOf(stage);
      const hs = TUNING.hormeSources;
      // Rebalanced per-stage Hormē (was a flat 1/2/3 by tier) — see hormeSources above.
      const hormeGrant = tier === 1 ? hs.stageTemple : tier === 2 ? hs.stageGrandTemple : hs.stageSanctuary;
      // Permanent altar production bonus — moved here from worshipper milestones (see
      // TUNING.stageBonus's own comment). Same godStats.milestoneBonus field, so it stacks
      // additively with Full Staff's own bonus below and applies via the same godRate() path.
      const bonusGrant = tier === 1 ? TUNING.stageBonus.temple : tier === 2 ? TUNING.stageBonus.grandTemple : TUNING.stageBonus.sanctuary;
      setHorme((h) => h + hormeGrant);
      setGodStats((s) => ({
        ...s,
        [god.id]: { ...s[god.id], milestoneBonus: (s[god.id].milestoneBonus || 0) + bonusGrant },
      }));
      const prevStageName = STAGES[tier - 1].name;
      const crossingTitle = tier === 1
        ? `${god.name}'s altar became a ${stage.name}.`
        : `${god.name}'s ${prevStageName} became a ${stage.name}.`;
      // Same fix as altar-raised/milestones/achievements — first time ever, not once per age.
      setChronicle((c) => c.some((e) => e.id === `${god.id}-stage-${stage.level}`) ? c : [...c, { id: `${god.id}-stage-${stage.level}`, chapter: null, text: stage.text(god.name), title: crossingTitle }]);
      const bannerText = tier === 1 ? `${god.name}'s altar becomes a ${stage.name}` : `${god.name}'s ${prevStageName} becomes a ${stage.name}`;
      fireNotification(`${bannerText}\n+${hormeGrant} Hormē, +${Math.round(bonusGrant * 100)}% ${god.resourceName}`, PALETTE.stage.hex, null, null, false, true, null, true);
    }
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification, setOfferingBonus, triggerRite);
    appeaseGod(god.id);
    maybeShowSilenceFlavor(god.id);
  }

  // Price of the Worshippers festival variant: 50% of what recruiting `worshipperFollowers`
  // would cost directly, at this altar's current worshipper count. Derived from the same
  // worshipperCost() curve direct recruitment uses — no separate held-based curve.
  function festivalWorshipperCost(stats) {
    const f = TUNING.festival;
    const w = stats.worshippers || 0;
    let total = 0;
    for (let i = 0; i < f.worshipperFollowers; i++) total += worshipperCost(w + i);
    return Math.ceil(total * f.worshipperDiscountPct);
  }

  // Price of the Resources festival variant: `resourcePriceSeconds` worth of the altar's
  // BASE Kleos rate (altarKleosRate — level/worshippers/Hiereus only, no temporary
  // modifiers), so the price only shifts when something permanent about the altar changes.
  function festivalResourcePrice(stats) {
    return Math.ceil(altarKleosRate(stats) * TUNING.festival.resourcePriceSeconds);
  }

  function holdFestival(god, kind) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if ((stats.hiereus || 0) < 1) return;
    const now = Date.now();
    if (festivalCooldownUntil.current[god.id] && now < festivalCooldownUntil.current[god.id]) return;
    const held = stats.festivalsHeld || 0;
    const stageName = currentStage(stats.level).name;
    // The Judgement: a silent altar still holds the festival — the price is paid, the
    // cooldown still starts — but nothing comes of it. Distinct from Offering/the other
    // buttons: here the cost is real, not free, because a festival is something you *throw*,
    // not something offered and left unclaimed.
    const isSilent = !!silentGods[god.id];

    if (kind === "worshippers") {
      if ((stats.worshippers || 0) >= TUNING.worshipperCap) return; // no dead button — this branch simply shouldn't be reachable once the card hides it
      const cost = festivalWorshipperCost(stats);
      if (kleos < cost) return;
      const followers = Math.min(TUNING.festival.worshipperFollowers, TUNING.worshipperCap - (stats.worshippers || 0));
      const oldCount = stats.worshippers || 0;
      const newCount = isSilent ? oldCount : Math.min(TUNING.worshipperCap, oldCount + followers);
      logTestEvent("festival_held", { god: god.id, kind: "worshippers", followers: isSilent ? 0 : followers, cost, silent: isSilent });
      setKleos((k) => k - cost);
      setGodStats((s) => ({
        ...s,
        [god.id]: { ...s[god.id], festivalsHeld: held + 1, worshippers: newCount },
      }));
      if (!isSilent) grantWorshipperMilestones(god, stats, oldCount, newCount);
      festivalCooldownUntil.current[god.id] = now + TUNING.festival.cooldownMs;
      if (isSilent) {
        showFestivalSilencePop();
      } else {
        fireNotification(`A festival at ${god.name}'s ${stageName}.\n+${followers} worshippers`, PALETTE.festival.hex);
      }
    } else {
      const cost = festivalResourcePrice(stats);
      if (kleos < cost) return;
      // Live effective rate (includes Harvest boost etc.) — the reward reflects what the
      // altar is actually producing right now; only the PRICE excludes temporary modifiers.
      const rate = effectiveGodRate(god, stats, multiplier, ageIndex, farmLevel, built, godStats, harvestBoostUntil.current);
      const yielded = isSilent ? 0 : rate * TUNING.festival.resourceRewardSeconds;
      logTestEvent("festival_held", { god: god.id, kind: "resources", yielded: Math.round(yielded), cost, silent: isSilent });
      setKleos((k) => k - cost);
      setGodStats((s) => ({ ...s, [god.id]: { ...s[god.id], festivalsHeld: held + 1 } }));
      if (!isSilent) setResources((r) => ({ ...r, [god.id]: capResource((r[god.id] || 0) + yielded) }));
      festivalCooldownUntil.current[god.id] = now + TUNING.festival.cooldownMs;
      if (isSilent) {
        showFestivalSilencePop();
      } else {
        fireNotification(`A festival at ${god.name}'s ${stageName}.\n+${yielded < 10 ? yielded.toFixed(1) : formatNum(yielded)} ${god.resourceName}`, PALETTE.festival.hex);
      }
    }
    appeaseGod(god.id);
  }

  function stealFire() {
    if (ageIndex !== 0 || pantheonLevel < 1 || prometheusFireStolen) return;
    setPrometheusFireStolen(true);
    setChronicle((c) => [
      ...c,
      {
        id: "prometheus-theft",
        chapter: null,
        title: "Prometheus stole fire.",
        text: "The forge at Hephaestus's altar burns a little lower tonight, though no one can say why. Prometheus carries the coal down the mountain inside a fennel stalk, past every god who might have stopped him and didn't quite look up in time. Mortals will call it a gift. Zeus will call it a theft, because it is one.",
      },
      {
        id: "prometheus-punished",
        chapter: null,
        title: "Prometheus was bound to the mountain.",
        text: "Zeus's fury falls twofold — on the mortals who received the fire, and on the one who gave it. Prometheus is bound to a mountain far from this one. The eagle comes at dawn, every dawn, and what it takes is always back by morning. No altar is raised for this. No altar could hold it.",
      },
    ]);
    fireNotification(`Fire is... acquired.\n+${Math.round(TUNING.prometheus.fireBoostPct * 100)}% production, permanently`, "#D4A876", null, null, false, true, null, false, true);
    // The second beat lands on top of the first in the banner stack — the reward, then the
    // price, in that order.
    if (boundTimer.current) clearTimeout(boundTimer.current);
    boundTimer.current = setTimeout(() => {
      fireNotification("Prometheus is bound.", "#C98A7A", null, null, false, true, null, false, true);
    }, 5000);
    // Long enough for both banners to be read before the screen takes over.
    if (giftIntroTimer.current) clearTimeout(giftIntroTimer.current);
    giftIntroTimer.current = setTimeout(() => setGiftStep(1), 8500);
  }

  // Step 3 — pleading at Hestia's hearth. A direction-matching swipe game — see
  // TUNING.hearth's own comment for the full redesign history and the current numbers.
  // A rotating target direction (HEARTH_DIRECTIONS) is active for a few seconds at a time;
  // any swipe within angleToleranceDeg of it scores a correct swipe — every correct swipe
  // counts, not just one per window, so the player is rewarded for each successful match
  // rather than capped at one per rotation.
  //
  // startHearthDirectionLoop is called once when the Hearth page mounts (see its own
  // useEffect below) and recursively re-schedules itself via setTimeout — a variable-length
  // rotation (directionMinMs to directionMaxMs) reads more organically than a fixed-interval
  // setInterval would.
  function startHearthDirectionLoop() {
    function rotate() {
      setJudgementHearthActiveDir((d) => {
        if (HEARTH_DIRECTIONS.length <= 1) return d;
        let next;
        do { next = Math.floor(Math.random() * HEARTH_DIRECTIONS.length); } while (next === d);
        return next;
      });
      const wait = TUNING.hearth.directionMinMs + Math.random() * (TUNING.hearth.directionMaxMs - TUNING.hearth.directionMinMs);
      judgementHearthDirTimer.current = setTimeout(rotate, wait);
    }
    rotate();
  }

  function stopHearthDirectionLoop() {
    if (judgementHearthDirTimer.current) {
      clearTimeout(judgementHearthDirTimer.current);
      judgementHearthDirTimer.current = null;
    }
  }

  // Runs the direction-rotation loop only while the Hearth page is actually open and the
  // sequence isn't already complete — nothing rotates while the player is elsewhere, and
  // the loop cleans itself up on unmount/tab-change via the effect's own cleanup.
  useEffect(() => {
    const hearthPageActive = activeTab === "hearth" && ageIndex === 1 && !judgementDone && !hearthComplete;
    if (hearthPageActive) {
      startHearthDirectionLoop();
    }
    return () => stopHearthDirectionLoop();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeTab, ageIndex, judgementDone, hearthComplete]);

  function hearthSwipeStart(e) {
    judgementHearthSwipeStart.current = { x: e.clientX, y: e.clientY };
  }

  function hearthSwipeEnd(e) {
    const start = judgementHearthSwipeStart.current;
    judgementHearthSwipeStart.current = null;
    if (!start) return;
    if (ageIndex !== 1 || pantheonLevel < 1 || judgementDone || judgementStep < 1) return;
    if (judgementHearthSwipes >= TUNING.hearth.targetSwipes) return;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < TUNING.hearth.minSwipeDist) return; // too short to be an intentional swipe
    // Standard math convention (0°=right, 90°=up, counterclockwise) — screen y grows
    // downward, hence negating dy before atan2.
    const angle = ((Math.atan2(-dy, dx) * 180) / Math.PI + 360) % 360;
    const target = HEARTH_DIRECTIONS[judgementHearthActiveDir];
    let diff = Math.abs(angle - target.angle);
    if (diff > 180) diff = 360 - diff;
    const ok = diff <= TUNING.hearth.angleToleranceDeg;
    // The wind trail always shows, following the ACTUAL swipe's own direction and length —
    // an earlier version of this idea (before the whole mechanic got redesigned around
    // holding) considered always animating it toward the ideal direction instead, and
    // dropped that specifically because the visual should never "correct" what the player
    // actually did.
    const gustId = ++judgementHearthGustSeq.current;
    setJudgementHearthGust({ id: gustId, dx, dy, ok });
    setTimeout(() => setJudgementHearthGust((g) => (g && g.id === gustId ? null : g)), 450);
    if (ok) {
      setJudgementHearthSwipes((s) => Math.min(TUNING.hearth.targetSwipes, s + 1));
    }
  }

  // Step 5 (close). judgementDone locks the sequence and lets Ascend appear; silentGods
  // itself is deliberately NOT cleared here — it persists for the rest of Silver Age and
  // only clears in ascend()'s own reset, per the design ("clears on Ascend into Bronze Age
  // — not before"). No mechanical consequence of any kind — this is purely narrative.
  function closeJudgement() {
    if (judgementDone) return;
    setJudgementDone(true);
    setChronicle((c) => [
      ...c,
      {
        id: "judgement-zeus", chapter: null,
        title: "The Silver race was buried.",
        text: "It was never going to be enough. Zeus looked once, and did not look again. He closed his hand around the Silver race and pressed them into the earth — not as punishment remembered, but as a thing simply no longer permitted to exist. The mountain did not mourn them. It had already stopped listening.",
      },
    ]);
    fireNotification("The Silver race is buried.", "#C98A7A", null, null, false, true, null, false, true);
  }

  // Toggles ONE god's redirect on/off — started and stopped individually, any number of
  // times, rather than one global switch for all 13 at once. Progress (pandoraProgress)
  // simply stops advancing while off and resumes from wherever it left off when toggled
  // back on; nothing is lost by pausing. Already-completed gods (pandoraDonations) can't be
  // toggled at all — there's nothing left to start or stop.
  function togglePandoraGod(godId) {
    if (ageIndex !== 0 || !prometheusFireStolen || pandoraCreated || pandoraDonations[godId]) return;
    setPandoraActiveGods((a) => ({ ...a, [godId]: !a[godId] }));
  }

  function createPandora() {
    if (ageIndex !== 0 || !prometheusFireStolen || pandoraCreated) return;
    if (!GODS.every((g) => pandoraDonations[g.id])) return;
    // Order matters: the reveal state is set FIRST. An earlier version called a
    // setPandoraOpen that no longer existed, which threw a ReferenceError right after
    // setPandoraCreated(true) — so Pandora counted as made, Ascend appeared, and the
    // reveal never ran. That was the "screen locks and nothing shows" bug.
    setPandoraRevealStep(0);
    setPandoraLineDone(false);
    setPithosOpened(false);
    setPandoraCreated(true);
    setChronicle((c) => [
      ...c,
      {
        id: "pandora",
        chapter: null,
        title: "A Gift to Mankind",
        text: "Every god gave something — warmth, wisdom, cunning, grace, and things with no kind name. Hephaestus shaped her from clay; the rest is dressing. She was called a gift, and Zeus meant it exactly as unkindly as that sounds. When her pithos opened, every evil the world had been spared came out at once. Only Hope stayed inside, and no one has ever agreed on whether that was mercy.",
      },
    ]);
  }

  function donateToPantheon(god) {
    if (!pantheonReady || pantheonLevel > 0) return;
    if (pantheonDonations[god.id]) return;
    // Must be paid strictly in build order — this god has to be the first not-yet-donated
    // one in `built` (append-order, i.e. the actual order altars were raised in).
    const nextGodId = built.find((id) => !pantheonDonations[id]);
    if (god.id !== nextGodId) return;
    const now = Date.now();
    if (now < pantheonWaitUntil.current) return; // still gathering — see TUNING.pantheon
    const donationsMade = Object.keys(pantheonDonations).length;
    const cost = pantheonCost(donationsMade);
    if ((resources[god.id] || 0) < cost) return;
    logTestEvent("pantheon_tribute", { god: god.id, position: donationsMade, cost: Math.round(cost) });
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    setPantheonDonations((d) => ({ ...d, [god.id]: true }));
    const remaining = built.length - (donationsMade + 1);
    if (remaining > 0) {
      pantheonWaitStart.current = now;
      const duration = pantheonWaitFor(donationsMade + 1);
      pantheonWaitUntil.current = now + duration;
      pantheonWaitOriginalMs.current = duration;
    } else {
      pantheonWaitUntil.current = 0; // last tribute paid — nothing left to wait on
    }
  }

  function raisePantheon() {
    if (!pantheonReady || pantheonLevel > 0) return;
    if (!GODS.every((g) => pantheonDonations[g.id])) return;
    logTestEvent("pantheon_raised", {});
    setPantheonLevel(1);
    setChronicle((c) => [
      ...c,
      {
        id: `pantheon-${ageIndex}`,
        chapter: null,
        title: "The Pantheon was raised.",
        text: "Thirteen temples stood already, each insisting on its own importance. What rises now is the first building that belongs to none of them — a hall for all the gods at once, paid for out of every treasury on the mountain. The accounts were settled in a single afternoon and disputed for considerably longer.",
      },
    ]);
    fireNotification("The Pantheon is raised", "#E8C88F", null, null, false, true);
    // Every altar celebrates at once. Nothing pauses and nothing is granted — the mountain
    // has simply finished building.
    setPantheonFeastUntil(Date.now() + TUNING.pantheonFeast.durationMs);
    fireNotification("Every altar keeps festival.", PALETTE.festival.hex);
  }

  function ascend() {
    if (!allBuilt || pantheonLevel < 1) return;
    if (ageIndex === 0 && !pandoraCreated) return; // Golden Age has its own ending, on top of Pantheon
    if (ageIndex === 1 && !judgementDone) return; // Silver Age has its own ending too — The Judgement
    const nextAge = ageIndex + 1;
    const ageLabel = nextAge < AGE_NAMES.length ? AGE_NAMES[nextAge] : `Iron Age, Cycle ${nextAge - AGE_NAMES.length + 2}`;
    logTestEvent("ascend", { fromAge: ageIndex, toAge: nextAge, kleosAtAscend: Math.round(kleosRef.current) });
    setStarlight((s) => s + 1);
    setKleos(0);
    setResources({});
    setBuilt([]);
    setGodStats({});
    setHorme(0);
    // The age ends for everything, not just the altars — Zeus wipes the slate clean.
    // Silver Coins are age-local currency like Kleos, and the Agora and the Farm are
    // mortal works: they fall with everything else. They stay *available* to rebuild
    // from the Silver Age onward (that gating is on ageIndex, not on level).
    setSilverCoins(0);
    setAgoraLevel(0);
    setFarmLevel(0);
    setThesaurosBuilt(false);
    setWorkerAssignments({ agora: 0, agros: 0, thesauros: 0 });
    setPantheonLevel(0);
    setPantheonDonations({});
    pantheonWaitUntil.current = 0;
    pantheonWaitStart.current = 0;
    pantheonWaitOriginalMs.current = 0;
    setNeglectedGods({});
    neglectMsLeft.current = {};
    // silentGods clears here — The Judgement's own design: "persists for the rest of Silver
    // Age... clears on Ascend into Bronze Age." judgementDone deliberately does NOT reset
    // here (same permanence tier as prometheusFireStolen) — Silver Age is only ever visited
    // once, so it never needs to fire again.
    setSilentGods({});
    setJudgementStep(0);
    setJudgementTextDone(false);
    // Safety stop — shouldn't normally be running at Ascend (the Hearth page is only
    // reachable during Silver Age), but avoids a dangling timer if it somehow is.
    stopHearthDirectionLoop();
    // wrathChronicled deliberately survives Ascension — the Chronicle carries across ages,
    // so a god's first resentment shouldn't be written a second time in the next one.
    // ritesUnlocked and tutorialEnabled deliberately survive Ascension too, for the same
    // reason — a player who's already seen "what is Hormē" shouldn't see it explained again
    // in age 2, and someone who turned tutorials off shouldn't have them silently return.
    setOfferingBonus(0);
    setAgeIndex(nextAge);
    setSelectedGodId(null);
    // Per-transition Chronicle text — each turning of the age gets its own reason, drawn
    // from what actually happens in the myth at that specific point, rather than one
    // generic "ages turn" paragraph reused for all of them. Only Golden→Silver is written
    // so far; the rest fall back to the general text until they get the same treatment.
    const ASCEND_TEXT = {
      1: "The mountain falls quiet. What was built is unbuilt, not by ruin but by the turning of the age itself. Pandora's gift has done its work — the world that rises now is not the one that fell. Men are born fickle, tall, and slow to give what once came freely. What the gods are owed, they must be asked for again.",
      2: "The mountain falls quiet. What was built is unbuilt, not by ruin but by the turning of the age itself. Zeus looked at what Silver had become and made something harder — men of ash, forged for the spear, who knew no trade but war. They will not ask what the gods are owed. They will take it, or die reaching.",
    };
    const fallbackText = "The mountain falls quiet. What was built is unbuilt, not by ruin but by the turning of the age itself — the way Hesiod once wrote that mankind passed from gold to silver to bronze, each age dimmer than the last, yet each one still remembered. Olympus will rise again, a little brighter than before.";
    setChronicle((c) => [
      ...c,
      {
        id: `ascend-${nextAge}`,
        chapter: ageLabel,
        title: `The ${ageLabel} began.`,
        text: ASCEND_TEXT[nextAge] || fallbackText,
      },
    ]);
    fireNotification(`A new age dawns: ${ageLabel}`, "#F0D9A8", null, null, false, true, null, false, true);
    // The Agora is introduced once, the first time the Silver Age begins — not every time
    // Ascension resets it back to level 0, and not bundled with the age's own Chronicle
    // entry, so the two read as separate beats rather than one long paragraph.
    if (nextAge === 1 && !agoraIntroduced) {
      setAgoraIntroduced(true);
      setTimeout(() => triggerRite("agora"), 2000);
      setChronicle((c) => [
        ...c,
        {
          id: "agora-introduced", chapter: null,
          title: "A marketplace has taken root at the mountain's foot.",
          text: "Where the mountain's foot meets the plain, traders have begun to gather — first a handful, then a market, then something that looks very much like a fixture. Worshippers bring goods as readily as prayers, and Olympus, ever practical, has found a way to take its share of both.",
        },
      ]);
      fireNotification("A marketplace has taken root below the mountain.", "#C9C2AE", null, null, false, true);
    }
    setActiveTab("chronicle");
    setLastSeenChronicleCount((c) => chronicle.length + 1);
    window.scrollTo({ top: 0, behavior: "smooth" });
    // Chronicle now renders oldest-first, newest at the bottom — scroll the panel's own
    // scrollHeight into view (not top: 0) so the new age's own entry, always the newest,
    // is what's actually visible, the same way a chat view lands on the latest message.
    requestAnimationFrame(() => {
      if (chronicleScrollRef.current) chronicleScrollRef.current.scrollTop = chronicleScrollRef.current.scrollHeight;
    });
  }

  const currentAgeName = ageIndex < AGE_NAMES.length ? AGE_NAMES[ageIndex] : `Iron Age, Cycle ${ageIndex - AGE_NAMES.length + 2}`;
  const unlockedResources = GODS.filter((g) => built.includes(g.id));
  const selectedGod = selectedGodId ? GODS_BY_ID[selectedGodId] : null;
  const selectedStats = selectedGod ? (godStats[selectedGod.id] || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 }) : null;
  const isSelectedBuilt = selectedGod ? built.includes(selectedGod.id) : false;

  if (showIntro) {
    // A save can exist in localStorage (autosaved seconds after Erase History or a fresh
    // start) with nothing built in it yet — !initialSave alone can't tell "brand new" apart
    // from "just reset." Checking built.length alone isn't enough either: it's also empty
    // for a split second right after Ascending, which is real history, not a beginning.
    // ageIndex/starlight/built together cover all three cases correctly.
    const isNew = ageIndex === 0 && starlight === 0 && built.length === 0;
    const recentEntries = chronicle.slice(-1);
    return (
      <div
        className="w-full flex flex-col items-center justify-start px-6 pt-12 pb-6 overflow-hidden"
        style={{
          height: "100dvh",
          background: "radial-gradient(ellipse at top, #332C18 0%, #221D10 55%, #15120A 100%)",
          fontFamily: "'EB Garamond', serif",
          color: "#EDE6D6",
        }}
      >
        <h1 className="font-display text-4xl tracking-wide mb-1.5 flex-shrink-0" style={{ color: "#D4A876" }}>Olympus Chronicle</h1>
        <p className="font-label text-base opacity-60 mb-8 tracking-wide flex-shrink-0">An idle chronicle of the Greek gods</p>
        <div className="max-w-md w-full text-center mb-8 flex-1 min-h-0 overflow-y-auto">
          <p className="font-label text-xs uppercase tracking-widest opacity-60 mb-3">
            {isNew ? "The story begins" : "When we last left Olympus"}
          </p>
          {/* Newest entry first — same order as the Chronicle tab — then up to two
              older ones beneath it, dimmed and smaller, as quiet context. */}
          {recentEntries.map((entry, i) => (
            <div
              key={entry.id ? `${entry.id}-${i}` : i}
              className={i === 0 ? "" : "mt-4 pt-4"}
              style={i === 0 ? undefined : { borderTop: "1px solid rgba(212,168,118,0.15)", opacity: 0.5 }}
            >
              {entry.title && (
                <p
                  className={`font-display mb-2 ${i === 0 ? "text-lg" : "text-sm mb-1"}`}
                  style={{ color: "#D4A876", textWrap: "balance" }}
                >
                  {entry.title}
                </p>
              )}
              {entry.text && (
                <p
                  className={`font-label leading-relaxed ${i === 0 ? "text-base opacity-90" : "text-sm"}`}
                  style={{ fontStyle: entry.id === "prologue" ? "italic" : "normal", textWrap: "pretty" }}
                >
                  {entry.text}
                </p>
              )}
            </div>
          ))}
        </div>
        <button
          onClick={() => setShowIntro(false)}
          className="px-8 py-3 rounded-sm font-display text-base tracking-wide flex-shrink-0"
          style={{ background: "rgba(212,168,118,0.14)", border: "1px solid rgba(212,168,118,0.45)", color: "#D4A876" }}
        >
          {isNew ? "Enter Olympus" : "Return to Olympus"}
        </button>
        <PantheonIcon size={300} height={104} style={{ color: "#D4A876", opacity: 0.12, marginTop: 40, flexShrink: 0 }} />
      </div>
    );
  }

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background: "radial-gradient(ellipse at top, #332C18 0%, #221D10 55%, #15120A 100%)",
        fontFamily: "'EB Garamond', serif",
        color: "#EDE6D6",
      }}
    >
      <style>{`
        .font-display { font-family: 'Cinzel', serif; }
        .font-label { font-family: 'Antic', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
        @keyframes softIn { from { opacity: 0; transform: translate(-50%, -6px) scale(0.97); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
        .notif-anim { animation: softIn 0.45s ease-out forwards; }
        @keyframes softOut { from { opacity: 1; } to { opacity: 0; } }
        .notif-fadeout { animation: softOut 0.7s ease-in forwards; }
        @keyframes cornerIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes simpleFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .notif-fade-simple { animation: simpleFadeIn 0.5s ease-out forwards; }
        .notif-corner-in { animation: cornerIn 0.5s ease-out forwards; }
        @keyframes cornerOut { from { opacity: 1; } to { opacity: 0; } }
        .notif-corner-fadeout { animation: cornerOut 0.9s ease-in forwards; }
        /* Neglect settles in heavier and slower than a normal reward banner, with a brief
           shake — reads as unease rather than a payoff. Appeased is the opposite: quick,
           soft, with one gentle glow-pulse — relief, not celebration. */
        @keyframes resentIn {
          0% { opacity: 0; transform: scale(0.96) translateY(-2px); }
          55% { opacity: 1; transform: scale(1.01) translateY(0); }
          70% { transform: translateX(-2px); }
          85% { transform: translateX(2px); }
          100% { transform: translateX(0); }
        }
        .notif-resent-in { animation: resentIn 0.8s ease-out forwards; }
        @keyframes appeaseIn {
          0% { opacity: 0; transform: scale(0.98); }
          60% { opacity: 1; transform: scale(1); }
          100% { opacity: 1; transform: scale(1); }
        }
        .notif-appease-in { animation: appeaseIn 0.4s ease-out forwards; }
        @keyframes confettiBurst {
          0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(0) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(46px) scale(0.4); }
        }
        .confetti-pop { animation: confettiBurst 0.7s ease-out forwards; }
        @keyframes sparkleDrift {
          0%   { opacity: 0; transform: translateY(4px) scale(0.4); }
          25%  { opacity: 1; transform: translateY(0) scale(1); }
          60%  { opacity: 0.7; transform: translateY(-6px) scale(0.85); }
          100% { opacity: 0; transform: translateY(-14px) scale(0.3); }
        }
        .sparkle-drift { animation: sparkleDrift 2.2s ease-in-out infinite; }
        @keyframes harvestReady {
          0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 2px #C9E08A55); }
          50%      { opacity: 1;    filter: drop-shadow(0 0 6px #C9E08Acc); }
        }
        .harvest-ready { animation: harvestReady 1.8s ease-in-out infinite; }
        @keyframes harvestEdgePulse {
          0%, 100% { box-shadow: inset 0 0 32px 4px rgba(194,186,110,0.28); }
          50%      { box-shadow: inset 0 0 52px 10px rgba(194,186,110,0.5); }
        }
        .harvest-edge-pulse { animation: harvestEdgePulse 1.8s ease-in-out infinite; }
        @keyframes mythGlow {
          0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 10px 1px rgba(212,168,118,0.25); }
          50%      { box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 22px 4px rgba(212,168,118,0.55); }
        }
        .myth-glow { animation: mythGlow 3.4s ease-in-out infinite; }
        @keyframes insightRing {
          0% { transform: scale(1); opacity: 0.85; }
          100% { transform: scale(11); opacity: 0; }
        }
        .insight-ring { animation: insightRing 1.1s ease-out forwards; }
        @keyframes visionFloat {
          0% { transform: translate(0, 0); }
          25% { transform: translate(5px, -7px); }
          50% { transform: translate(-4px, 4px); }
          75% { transform: translate(-6px, -3px); }
          100% { transform: translate(0, 0); }
        }
        .vision-float { animation: visionFloat 8s ease-in-out infinite; }
        @keyframes visionPulse { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
        .vision-pulse { animation: visionPulse 2.4s ease-in-out infinite; transform-origin: center; }
        @keyframes visionBlink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(0.06); } }
        .vision-eye { animation: visionBlink 4.5s ease-in-out infinite; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .entry-anim { animation: fadeUp 0.4s ease-out; }
        @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }
        .float-pop { animation: floatUp 0.85s ease-out forwards; }
        /* Silence-line pops carry a full sentence, not a short "+N" — needs to stay legible
           much longer than the usual quick flash. Rises less (a slower drift, not a pop) and
           holds near-full opacity for most of its life instead of fading immediately. */
        @keyframes floatUpSlow { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.9); } 8% { opacity: 1; transform: translate(-50%, -4px) scale(1); } 85% { opacity: 1; transform: translate(-50%, -20px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -26px) scale(1); } }
        /* The Hearth's wind-gust trail — opacity-only keyframes so the inline rotate()
           transform (which encodes the swipe's own actual direction, set per-instance in
           JS) is never overridden by the animation itself. */
        @keyframes gustFade { 0% { opacity: 0.9; } 100% { opacity: 0; } }
        /* A gentle breathing pulse on the Hearth's direction arrow, so it reads as "alive"
           and worth watching rather than a static glyph. */
        @keyframes hearthArrowPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        .hearth-arrow-pulse { animation: hearthArrowPulse 1.4s ease-in-out infinite; }
        /* A gentle breathing scale on the flame itself, independent of the fill/reveal
           transform on its parent — applied to the icon element, not its positioned
           wrapper, so this scale and the parent's translateX(-50%) centering don't fight
           over the same transform property. */
        @keyframes hearthFlamePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
        .hearth-flame-pulse { animation: hearthFlamePulse 2.2s ease-in-out infinite; transform-origin: bottom center; }
        .float-pop-slow { animation: floatUpSlow 3.2s ease-out forwards; }
        @keyframes rewardFloat {
          0%   { opacity: 0; transform: translate(-50%, 4px) scale(0.85); }
          12%  { opacity: 1; transform: translate(-50%, -4px) scale(1); }
          70%  { opacity: 1; transform: translate(-50%, -40px) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -64px) scale(1); }
        }
        .reward-float { animation: rewardFloat 2.2s ease-out forwards; }
        @keyframes escapeMote {
          0%   { opacity: 0; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(0) scale(0.3); }
          12%  { opacity: 0.95; }
          70%  { opacity: 0.7; }
          100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(var(--dist)) scale(1.15); }
        }
        .escape-mote { animation: escapeMote 3.4s ease-out forwards; }

                    title="They failed the gods."
                  >
                    <HestiaIcon size={22} style={{ color: "#D4A876" }} />
                  </button>
                </div>
              );
            })()}
            <button
              onClick={offer}
              className="flex-1 py-3 rounded-sm font-label text-sm tracking-wide transition-all active:scale-95 shadow-lg"
              style={{
                background: offerFlash ? "transparent" : "rgba(50,129,179,0.25)",
                border: offerFlash ? "1px solid rgba(50,129,179,0.35)" : "1px solid rgba(50,129,179,0.7)",
                color: "#8fcfef",
                opacity: offerFlash ? 0.6 : 1,
                transitionDuration: offerFlash ? "0ms" : "300ms",
                backdropFilter: "blur(4px)",
              }}
            >
              Make an Offering (+{(offeringDisplayBase + offeringBonus).toFixed(1).replace(/\.0$/, "")} Kleos
              {Date.now() < pantheonWaitUntil.current && (
                <HourglassIcon size={12} style={{ color: "#8fcfef", marginLeft: 4, display: "inline-block", verticalAlign: "-1px" }} />
              )}
              )
            </button>
            {allBuilt && (() => {
              const nextPantheonGodId = built.find((id) => !pantheonDonations[id]);
              const tributeReady = pantheonLevel === 0 && nextPantheonGodId
                && Date.now() >= pantheonWaitUntil.current
                && (resources[nextPantheonGodId] || 0) >= pantheonCost(Object.keys(pantheonDonations).length);
              return (
                <button
                  onClick={() => setActiveTab(activeTab === "pantheon" ? "build" : "pantheon")}
                  className="relative flex-shrink-0 rounded-full flex items-center justify-center shadow-lg"
                  style={{
                    width: 48, height: 48,
                    background: activeTab === "pantheon" ? "rgba(212,168,118,0.28)" : "rgba(212,168,118,0.14)",
                    border: "1px solid rgba(212,168,118,0.55)",
                  }}
                  title="The Pantheon"
                >
                  <PantheonIcon size={30} height={10.5} style={{ color: "#D4A876" }} />
                  {tributeReady && (
                    <span
                      style={{
                        position: "absolute", top: 3, right: 3,
                        width: 8, height: 8, borderRadius: "50%",
                        background: "#8fcfef",
                        boxShadow: "0 0 5px 1px rgba(143,207,239,0.8)",
                      }}
                    />
                  )}
                </button>
              );
            })()}
          </div>
        </div>
      </div>
    </div>
  );
}

// Error boundary — catches render-time crashes and shows the actual error message and
// component stack instead of a silent black screen. React error boundaries must be class
// components; there's no hook equivalent. Purely diagnostic, no game logic here — this only
// exists so a crash is debuggable from a phone (copy the text, no DevTools/USB needed)
// instead of requiring Incognito-mode guesswork to tell a real bug apart from a stale cache.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null, copied: false };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    this.setState({ info });
  }
  render() {
    if (!this.state.error) return this.props.children;
    const details = `${this.state.error && this.state.error.stack ? this.state.error.stack : String(this.state.error)}${this.state.info && this.state.info.componentStack ? "\n\nComponent stack:" + this.state.info.componentStack : ""}`;
    return (
      <div
        style={{
          minHeight: "100dvh", width: "100%", padding: "2rem 1.25rem",
          background: "radial-gradient(ellipse at top, #332C18 0%, #221D10 55%, #15120A 100%)",
          color: "#EDE6D6", fontFamily: "'EB Garamond', serif", boxSizing: "border-box",
        }}
      >
        <h1 style={{ fontFamily: "'Cinzel', serif", fontSize: "1.4rem", color: "#D4A876", marginBottom: 8 }}>
          Something broke
        </h1>
        <p style={{ fontFamily: "'Antic', sans-serif", fontSize: "0.95rem", opacity: 0.8, marginBottom: 16, lineHeight: 1.5 }}>
          Copy the text below and send it over — this is the actual error, not a guess.
        </p>
        <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
          <button
            onClick={() => {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(details).then(
                  () => this.setState({ copied: true }),
                  () => this.setState({ copied: false })
                );
              }
            }}
            style={{
              fontFamily: "'Antic', sans-serif", fontSize: "0.9rem", padding: "0.5rem 1rem",
              borderRadius: 4, background: "rgba(212,168,118,0.14)", border: "1px solid rgba(212,168,118,0.45)",
              color: "#D4A876", cursor: "pointer",
            }}
          >
            {this.state.copied ? "Copied ✓" : "Copy error"}
          </button>
          <button
            onClick={() => window.location.reload()}
            style={{
              fontFamily: "'Antic', sans-serif", fontSize: "0.9rem", padding: "0.5rem 1rem",
              borderRadius: 4, background: "rgba(107,133,168,0.12)", border: "1px solid rgba(107,133,168,0.4)",
              color: "#6B85A8", cursor: "pointer",
            }}
          >
            Reload
          </button>
        </div>
        <pre
          style={{
            fontFamily: "monospace", fontSize: "0.78rem", lineHeight: 1.5, opacity: 0.85,
            whiteSpace: "pre-wrap", wordBreak: "break-word", background: "rgba(0,0,0,0.3)",
            border: "1px solid rgba(201,194,174,0.2)", borderRadius: 4, padding: "0.85rem",
            maxHeight: "60vh", overflowY: "auto", margin: 0,
          }}
        >
          {details}
        </pre>
      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><OlympusChronicle /></ErrorBoundary>);

</script>
</body>
</html>
