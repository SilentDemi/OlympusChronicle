  // layout even held upright. 1030px covers every iPad's portrait width, so touch tablets

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

function MaskIcon(dataUri) {
  // `height` is optional and defaults to `size` — every god/building icon is square, but the
  // Pantheon silhouette is roughly 3:1 and would otherwise sit in a tall box of dead space.
  // Extra style (opacity, margin) is spread last so callers can override.
  return function Icon({ size = 20, height, style = {}, className, onClick }) {
    const color = (style && style.color) || "currentColor";
    return (
      <span
        className={className}
        onClick={onClick}
        style={{
          display: "inline-block",
          width: size,
          height: height != null ? height : size,
          flexShrink: 0,
          backgroundColor: color,
          WebkitMaskImage: `url(${dataUri})`,
          maskImage: `url(${dataUri})`,
          WebkitMaskSize: "contain",
          maskSize: "contain",
          WebkitMaskRepeat: "no-repeat",
          maskRepeat: "no-repeat",
          WebkitMaskPosition: "center",
          maskPosition: "center",
          ...style,
        }}
      />
    );

function EmojiIcon(char) {
  return function Icon({ size = 16, style = {} }) {
    return <span style={{ fontSize: size, lineHeight: 1, display: "inline-block", ...style }}>{char}</span>;
  };
}

// Full-screen celebration when the Pantheon is raised. Spread across the viewport rather
// than a single element, and slower than the banner sparkles — this one lasts 40 seconds.
const FEAST_SPARKS = Array.from({ length: 34 }, (_, i) => {
  const golden = 0.6180339887;
  return {
    x: ((i * golden * 100) % 100),
    y: ((i * golden * 173) % 100),
    d: (i * 0.37) % 4.2,
    s: 3 + (i % 3),
    c: ["#8CB369", "#D4A876", "#6FA8C9", "#C97B4A", "#E8C88F"][i % 5],
  };
});

const PALETTE = {
  worshipper: { hex: "#7C8FA8", rgb: "124,143,168" }, // slate — the congregation itself; duller than Kleos blue so a count never reads as a price
  zakoros: { hex: "#C97B4A", rgb: "201,123,74" },   // terracotta — labor, not clergy
  stage:   { hex: "#B8A888", rgb: "184,168,136" },  // stone — the building itself
  oracle:  { hex: "#B79FD6", rgb: "183,159,214" },  // violet — the mystical panel
  horme:   { hex: "#7BAE9E", rgb: "123,174,158" },  // teal — a different divine force than Oracle's violet
  festival:{ hex: "#8CB369", rgb: "140,179,105" },  // green — distinct from Zakoros' terracotta; the one mechanic shared by all 13, not tied to any single role's color
  capped:  { hex: "#C17817", rgb: "193,120,23" },   // rust-amber — a resource at the Thesauros cap; deliberately distinct from both Neglect's soft red (#DFA192) and Zakoros' terracotta so none of the three read as the same signal
};

const TUNING = {
  // Kleos: the altar itself is the only base source (perAltar, scaled by that altar's own
  // level via altarLevelFactor — the same 0.3/level curve resourceRate uses, so leveling an
  // altar helps both economies by the same proportion). Worshippers and Hiereus both add a
  // % on top of their own altar's Kleos contribution — Hiereus used to be a flat global add
  // ("felt across all of Olympus"), which meant it never mattered *where* you put them.
  // Making it local, like Zakoros already was for resource, means a highly-leveled altar
  // becomes worth more to staff with Hiereus than a fresh one — an actual reason to
  // specialize altars instead of treating all 13 as identical.
  // baseline and perAltar both raised to 0.5 (from 0.3/0.4) — Kleos income felt slow
  // relative to how fast prices (upgrades, worshippers, Pantheon tribute) climb. perAltar
  // is the base term in every altar's own Kleos formula, multiplied by level/worshipper/
  // Hiereus bonuses, so this is a real +25% to Kleos income across the whole game, not just
  // an early-game nudge — baseline (the flat pantheon-wide add) matters more early, before
  // many altars are built.
  kleos: { baseline: 0.5, perAltar: 0.5, altarLevelFactor: 0.3, perWorshipperPct: 0.01, perHiereusPct: 0.333 },

  // The resource gift when an altar hits a worshipper milestone. It used to scale off the
  // god's weight, which spread it over a range of 3 to 5 — a difference nobody could see,
  // and one that stopped meaning anything once every god produced the same. It now scales
  // with Hormē instead: never spent, only earned, and earned from stages, full staff,
  // clergy and Oracles across the whole pantheon. So the gift grows as the mountain does,
  // and rewards breadth rather than grinding one altar.
  // base raised 2 → 10 (2 read as barely worth noticing at the very first milestone) and
  // perHorme retuned to 0.14 to compensate — the Hormē rebalance elsewhere raised what a
  // fully-matured pantheon totals (13 altars × 30 Hormē each = 390, up from the old ~377),
  // so keeping the old slope would have pushed the late-game ceiling past its intended
  // range. 0.14 lands back near the same ~65 ceiling the old formula effectively gave once
  // recalculated against the new total, while the higher base makes the earliest gifts
  // actually feel like something.
  milestoneGift: { base: 10, perHorme: 0.14 }, // ~65 at a fully matured pantheon (390 Hormē)

  // Offering had no source of growth at all — offeringBonus existed (raises what a manual
  // Offering gives) but nothing fed it since Festival's own +0.5-per-hold contribution was
  // removed. REBALANCED: originally fed by worshipper milestones (10/25/50, small/small/
  // large) — moved to a single source instead, Full Clergy (see ALTAR_ACHIEVEMENTS), since
  // stacking bonus%/Offering%/Hormē/resource all on worshipper milestones was too many
  // different reward types on one family. Full Clergy is Hiereus' own top-tier achievement
  // (Hiereus already boosts Kleos directly, so Offering — also Kleos — fits it thematically),
  // matching how Full Staff (Zakoros, which boosts resource) now grants a resource
  // production bonus instead — see fullStaffBonus below.
  fullClergyOfferingBonus: 0.80,

  // Altar upgrades. This curve is the single biggest pacing dial.
  // Every altar now costs the same to raise, and every altar yields the same. What still
  // separates the gods is what it costs to BUILD them (kleosCost, 5 -> 4200) and the Hormē
  // gate — so the order still matters, but a late god is no longer slower to develop than
  // an early one once it stands.
  // flatBase raised 3.0 → 8: found from a real Test Session log that resource was almost
  // never the actual gate on anything — Kleos was, every time. Level 0→3 cost only 19
  // total at 3.0, and a single early 10-worshipper milestone reward (10-13 resource) alone
  // covered over half of that, letting a fresh altar snowball to level 3 and its first
  // Hiereus almost instantly off one milestone. At 8, level 0→3 costs 47 — the same
  // milestone now covers roughly a quarter of it, not the majority. Paired with the
  // req.amount increases on each god's own entry (see below), so resource becomes a real
  // co-gate alongside Kleos at both the building and leveling stages, not a formality.
  // Eased back down 8 → 6.5 shortly after — 8 pushed the final level (9→10) to 1,232, felt
  // a bit steep; 6.5 lands it at 1,001, close to a round 1,000 as the intended ceiling.
  upgrade: { flatBase: 6.5, growth: 1.75 },

  // Resource: same altar-is-the-base shape as Kleos. Worshippers add a small % (their
  // devotion helps a little of everything); Zakoros add a bigger % but only to their own
  // altar's resource — they work the altar directly, so their labor should show up there
  // and nowhere else. Hiereus no longer touch resource at all (see kleos.perHiereus above).
  godRate: { perLevel: 0.3, perWorshipperPct: 0.01, perZakorosPct: 0.1 },

  // Followers. Worshippers are cheap and numerous; Hiereus are rare and expensive.
  // Growth lowered from 1.15 — worshippers used to give a flat +0.15/s bonus, which
  // justified a steep price. Now they give a small % boost instead, so the old curve made
  // #50 (right where the Zakoros cap sits) cost ~10.8k Kleos alone. 1.11 brings the total
  // cost of 0→50 down roughly 4x, still a real investment but not a wall right at the cap.
  // Lowered again from 1.11 → 1.08 — 50 worshippers (the Zakoros cap) was still ~16.7k
  // Kleos total, too steep a wall right where the cap sits. Now ~5.8k.
  // Base also lowered 10 → 5 — halves the whole curve proportionally, so the very first
  // worshipper (and everything after) comes noticeably faster.
  worshipper: { base: 5, growth: 1.08 },
  grain: { base: 0.8, growth: 1.15 },     // Silver Age onward, on top of Kleos — scaled with Demeter's resourceRate
  // growth lowered 1.4 → 1.3, found from a real Test Session log: Kleos income visibly
  // stalled for ~30 minutes mid-playthrough (11.93/s → 18.89/s, barely moving) exactly while
  // several altars were paying the level 6→9 Zakoros jump (5 needed → 8 needed, 3 more at
  // once under the current staircase) — at growth 1.4 that jump alone cost 822 Kleos per
  // altar. Tried flattening the curve's SHAPE first (linear, gentler exponential) while
  // holding the total near its original 2448 — didn't help: with the total fixed, 3
  // sequential purchases out of 10 always cost roughly 30-35% of it regardless of shape, a
  // structural fact, not a curve-shape problem. Lowering growth to 1.3 instead reduces the
  // total (2448 → 1495) and the jump with it (822 → 519). This does shorten the game
  // somewhat — a deliberate, acknowledged tradeoff, since getting the resource/Kleos
  // *balance* right was prioritized over overall *pacing* length, which is its own separate
  // pass to come later once the balance itself is settled.
  zakoros: { base: 35, growth: 1.3 },
  hiereus: { base: 80, growth: 1.45 },
  // Oracle's periodic blessing — fires every 3-5 real minutes per consulted altar, giving
  // either Kleos or that altar's own resource (picked at random), worth roughly this many
  // seconds of that altar's current rate. Not a Chronicle event — it repeats too often to
  // be a story beat, just a notification.
  // Oracle's altar-consultation cost is flat (see TUNING.oracle.flatCost below), same for
  // every god — it doesn't scale with position, unlike Pantheon/Pandora/upgrade costs.
  oracle: { flatCost: 400, intervalMinMs: 180000, intervalMaxMs: 300000, rewardSeconds: 90 },
  // God personality lines — ambient flavor only, no reward. Every ~10 minutes of active
  // play, one random built god (among those with a personalityLines pool) advances to its
  // own next line. A flat interval, not a min/max range like Oracle — this is meant to feel
  // like a slow, steady pulse in the background, not an unpredictable event.
  personalityLine: { intervalMs: 600000 },
  zakorosPerWorshippers: 5,                // one Zakoros slot per N worshippers
  zakorosCap: 10,                          // hard ceiling — a real temple kept a small, curated staff regardless of crowd size
  // Neglect — rewritten from an average-of-the-pantheon comparison to a flat, per-altar
  // clock. The average model only re-checked itself when a *new* altar was raised, so a
  // pantheon that stopped growing could leave an altar ignored forever without ever
  // tripping the check. A flat timer needs no such trigger: every tick, any built altar
  // whose last action is older than timeoutMs is neglected, full stop — no comparison to
  // its neighbors, no "tended once" flag, no minimum pantheon size to even apply.
  // Matured altars (level 10, full staff, full clergy, Oracle) are exempt — that
  // achievement's own text says worshippers "come now, slowly, without being asked";
  // continuing to threaten a matured altar with neglect would contradict what maturing it
  // was supposed to mean.
  // timeoutMs is a starting point, not sized against real pantheons the way the old
  // lagFactor/lagFlat pair was — flag for a proper pass once this is in players' hands.
  neglect: {
    timeoutMs: 20 * 60 * 1000,  // 20 minutes untouched, flat, same for every altar
    resourcePenalty: 0.20,       // unchanged: a neglected altar withholds a fifth of its tribute
    // A returning player who's been away long enough can have several altars cross
    // timeoutMs simultaneously — the check itself doesn't run while the app is closed, so
    // they're all discovered together in the first tick after reopening, which stacked into
    // a wall of banners before this existed. This delays the *announcement* only, by a
    // short fixed window from the moment the app opens — the altars are still genuinely
    // neglected the instant they cross timeoutMs, this just gives a beat to get oriented
    // before anything fires.
    graceOnOpenMs: 45 * 1000,   // 45 seconds
  },
  // maturedAutoWorshipperRate removed entirely (was: 0.02 free worshippers/sec once an
  // altar hit the "complete" achievement) — see olympus-ideas.md's "Worshipper cap and
  // Festival redesign." Diagnosed by simulation: this and Festival's flat per-hold payout
  // were the two sources with no brake at all, unlike direct recruitment's own exponential
  // price curve. Neglect immunity (the achievement's other reward, untouched) already
  // delivers on "this altar needs nothing further" on its own.
  worshipperCap: 50, // hard ceiling on the count itself — the one personnel role that had
  // no cap at all, unlike Zakoros (10) and Hiereus (3), which is what let it eventually
  // outgrow their relative importance on an altar left complete and idle for a while.
  // Lowered from an initial 100 to 50, matching the existing 50-worshipper "Cult" milestone
  // (the last worshipper milestone tier, and the one with its own per-god cultTitle/
  // cultText) — hitting the cap now coincides with the milestone that already treats 50 as
  // the meaningful ceiling, rather than an arbitrary round number well past it.

  // Hormē — gates how many altars may stand at once.
  // Was quadratic (0.8*i^2): Hormē income is roughly linear in altars developed, so a
  // quadratic gate was slack for the first ~28 altars and only ever a real constraint far
  // past the 13 that exist.
  //
  // Went through four tries — 18 → 8 → 6 → 10, all pure linear (threshold = perIndex * i)
  // — before finding that no single flat multiplier can actually work, for a structural
  // reason: every ALREADY-BUILT altar keeps earning Hormē in parallel while you work toward
  // the next one, so total banked Hormē grows roughly linearly in (built altars × how deep
  // each is developed) — the same shape as a linear threshold itself. That means slack
  // stays constant across the whole game *for a given playstyle*, but swings wildly
  // *between* playstyles: a player developing each altar only a little before moving on
  // (~6 Hormē/altar) sees roughly 1.0x slack at perIndex=6, while a player developing each
  // one to Grand Temple first (~15/altar) sees 1.5x at that same perIndex — and there's no
  // single perIndex that's right for both at once. (18 broke the *second* altar
  // specifically because the first altar's own early Hormē sources hadn't fired yet at
  // that point — a different problem, fixed separately by adding firstZakoros/firstHiereus
  // below, not by the curve shape.)
  //
  // Now genuinely mixed — threshold = perIndex*i + quadFactor*i² — so the early game stays
  // exactly as forgiving as the pure-linear tuning already got it (second altar still costs
  // only 7), while the quadratic term gradually tightens the *rate* of slack later in the
  // game, which a flat multiplier structurally cannot do. Sized against two playstyles
  // rather than one: ~15 Hormē/altar (reaches Grand Temple before moving on) lands at
  // 2.14x slack early, 1.04x by the last altar; ~32/altar (fully matures each altar first)
  // stays comfortably above 2x the whole way. Deliberately not tuned to protect a
  // rush/shallow playstyle (~6/altar, which would sit under 1.0x and risk a real
  // deadlock) — the two people who actually play this don't play that way, so there was no
  // reason to keep the whole curve looser just to cover a style nobody uses.
  horme: { perIndex: 5.5, quadFactor: 0.7 }, // perIndex nudged down from 6 so the second altar rounds to exactly 6, not 7

  // Sources of Hormē per altar, checked against the perIndex fix above — see olympus-ideas
  // TODO for the full reasoning. Rebalanced from a back-loaded distribution (the back half
  // of development gave more than double the front half) to a more even one, with sources
  // filling the gaps in the early game specifically, and Matured dropped entirely — that
  // achievement's own point is that the altar is *finished*, and rewarding it with Hormē
  // (whose only purpose is enabling the *next* altar) contradicted that.
  hormeSources: {
    worshipper10: 2, worshipper25: 3, worshipper50: 3,
    stageTemple: 2, stageGrandTemple: 3, stageSanctuary: 3,
    firstZakoros: 1, // the very first Zakoros recruited
    firstHiereus: 1, // the very first Hiereus appointed
    // fullStaff raised 3 → 5: absorbs the 2 Hormē the removed zakoros-halfway achievement
    // used to grant (see olympus-ideas.md's Zakoros level requirements note), rather than
    // just shrinking the pantheon's total Hormē — the milestone that used to soften the
    // 10-Zakoros grind's midpoint now makes the grind's actual finish line worth more
    // instead.
    fullStaff: 5, fullClergy: 3,
    oracle: 6, // absorbs Matured's old value; the true final Hormē milestone now
  },

  // Permanent altar production bonus at each stage crossing — moved here from worshipper
  // milestones during the same rebalance noted above fullClergyOfferingBonus. Reuses the
  // exact same 10/15/20% values worshipper milestones used to grant, just retargeted to
  // Temple/Grand Temple/Sanctuary instead of 10/25/50 followers. Applied via the same
  // godStats.milestoneBonus field worshipper milestones already used (see godRate).
  stageBonus: { temple: 0.10, grandTemple: 0.15, sanctuary: 0.20 },
  // Full Staff's own permanent resource production bonus — the Zakoros-side mirror of Full
  // Clergy's Offering bonus (Hiereus boosts Kleos directly, so Offering fit it; Zakoros
  // boosts resource directly, so a resource production bonus fits this one the same way).
  // Also applied via godStats.milestoneBonus.
  fullStaffBonus: 0.20,

  // Silver Age buildings.
  agora: { base: 50, growth: 1.6, coinRate: 0.025 }, // coins per worshipper per level per sec — halved, was accumulating too fast late-game
  // Farm — mirrors the Agora's shape now: total worshippers × sqrt(level), not just level
  // alone, so it feels tied to the whole civilization the way Agora does. unlockWorshippers
  // gates it behind total worshippers across ALL altars (not just Demeter's), since the
  // Grain demand it answers is universal from the Silver Age on. Upgrading needs a growing
  // total of worshippers as well as Kleos — Zeus introduced the seasons, and reading them
  // takes more hands each time. Harvest is a seasonal window (like the Oracle's own rhythm)
  // rather than an always-on button, and doubles the Agros bonus for a while.
  farm: {
    // The Agros grows no Grain of its own — Golden Grain is Demeter's gift, and a building
    // full of mortals shouldn't be able to conjure it. Instead it raises what her altar
    // yields: the congregation works fields that are hers. bonusPerLevel is the building
    // itself; bonusPerWorshipper is the hands working it.
    base: 40, growth: 1.5, bonusPerLevel: 0.35, bonusPerWorshipper: 0.004, unlockWorshippers: 15,
    followerReqBase: 30, followerReqGrowth: 1.25,
    harvestWindowMinMs: 300000, harvestWindowMaxMs: 480000, harvestOpenMs: 90000,
    harvestBoostMs: 180000, harvestBoostMult: 1.0,
  },
  // Thesauros — a Golden Age building, storage cap only for now (the collectibles layer
  // designed alongside it is a separate, later pass). Diagnosed by simulation: a
  // fully-matured altar keeps producing forever with nothing left to spend on, leaving
  // massive unused surplus by Ascend. A single global cap, shared by all 13 resources,
  // fixes it without needing 13 separate numbers.
  //
  // One-time build for now, no levels yet (cap doesn't scale) — cost and cap were originally
  // designed as a level-1 tier of a growing building (150 Kleos, 300 + 400/level cap), but
  // simulating actual costs against it found the level-1 cap (700) can't cover the priciest
  // Pantheon tribute (1,408 at the 13th position, paid from that god's own resource — same
  // pool the cap applies to). 1500 was chosen directly as a fixed cap that clears every
  // Pantheon tribute with real margin, rather than requiring the player to level a building
  // that doesn't have levels yet to reach a safe cap indirectly.
  //
  // defaultCap applies even before Thesauros is built — a cap always exists, Thesauros
  // RAISES it, rather than being the only thing that introduces one at all. Without this,
  // there'd be no actual reason to build Thesauros: nothing capped, nothing to raise.
  // Deliberately below the final-level upgrade cost (700) — reaching level 10 on any altar
  // now genuinely requires Thesauros first, matching the "real infrastructure, not just an
  // optimization" intent already established for Agros and Grain.
  thesauros: { cost: 150, cap: 1500, defaultCap: 500 },
  silverToKleos: 0.5, // 2 Silver Coins → 1 Kleos (reversed from the old 1 coin → 2 Kleos)
  // Silver-to-resource exchange. Every god costs the same now that every god produces the
  // same: dividing by weight used to be fair when a late god's altar earned twice as fast,
  // but with flat production it just charged double for the same thing. Flat rate instead —
  // coins buy resource at one price, whoever it's for.
  // Set to exactly 2x the Kleos rate: Kleos costs 2 coins/unit (silverToKleos above), so
  // resource costs 4 coins/unit here. Was 0.07 (~14 coins/unit, ~7x Kleos) — resource was
  // priced far more steeply than intended relative to Kleos; this brings the ratio down to
  // the deliberate 2x.
  silverToResource: 0.25, // 1 coin -> 0.25 resource, i.e. 4 coins per unit (2x Kleos's rate)

  // The Pantheon — the capstone that gates Ascension. Opens once all thirteen altars are
  // built, not once they're fully developed — see the comment above pantheonCost for why.
  // Flat 500 for every god now (see the block's own comment) — was position-based (263 to
  // 1,408 across 13 tributes) before a real Test Session log showed resource was almost
  // always already banked well past even the highest of those amounts by the time Pantheon
  // opened, so the escalation wasn't gating anything.
  pantheon: {
    // Flat 500 for every tribute, no escalation — found from a real Test Session log:
    // resource is almost always already banked well past 500 by the time Pantheon opens
    // (production has been running the whole game, not just during the tribute phase), so
    // the escalating 263→1,408 curve wasn't actually gating anything meaningfully different
    // between the 1st and 13th tribute — it was just a number that grew for its own sake.
    tributeAmount: 500,
    // Tributes are still paid strictly in build order (Hestia first, whichever god was built
    // last, paid last) — closes the same min-maxing optimization noted when this was first
    // designed (paying the cheapest position with the scarcest resource). That reasoning
    // doesn't depend on the price actually escalating, so it stands even with a flat amount.
    //
    // Wait timer is now flat too (180s per tribute, ~36 min total across all 13) — it used
    // to grow at the same rate as the price specifically so the two stayed in step; once the
    // price went flat, an escalating wait next to it stopped making sense (same amount every
    // time should mean the same wait every time).
    waitMs: 180000,
    // Offering chips away at the ACTIVE wait — 3s off per tap, giving Offering a use late in
    // the game beyond its own milestone-fed growth. waitFloorMs is a floor on TIME
    // REMAINING (not time since the wait started) — a click can never push the wait to
    // resolve in under 30s from that click's own moment, so the last stretch always plays
    // out normally no matter how many taps came before it. (An earlier version anchored the
    // floor to the wait's start instead, which let enough early taps collapse a whole
    // multi-minute wait down to a fixed 10s window right after it began — backwards from
    // the intent of "a shortcut, never a way to skip the wait outright.")
    offeringWaitReduceMs: 3000, waitFloorMs: 30000,
  },

  // The whole mountain celebrates when the Pantheon is raised. Ceremony only — no reward.
  // Anything granted here would be wiped by the Ascension that follows within minutes
  // (altars, worshippers and resources all reset), so paying out would only pretend to give
  // something. Prometheus's permanent +10% arrives right after and is the real prize.
  pantheonFeast: { durationMs: 15000 },

  // Golden Age ending, part 1: Prometheus steals fire once the Pantheon stands. One-time,
  // permanent — a flat addition to the production multiplier, same mechanism as Starlight
  // but earned narratively rather than through Ascension.
  prometheus: { fireBoostPct: 0.10 },

  // Golden Age ending, part 2: Pandora. Redesigned from a resource tribute (paid from
  // existing stockpile, one god at a time in build order — the same shape Pantheon used to
  // have) into something deliberately more symbolic and lighter: activating it redirects
  // ALL 13 gods' future production of their own resource straight to Pandora at once —
  // nothing already banked is touched — until each god's target is met. No manual per-god
  // payment; it just happens in the background once activated, each god finishing in its
  // own time depending on how developed it is. Meant to contrast with Pantheon's heavier,
  // sequential, actively-managed tribute — Pandora is a passive gesture, not a grind.
  // 250 sized to land around 10-15 minutes for the whole ritual (bounded by whichever god
  // is slowest, since all 13 run in parallel) — roughly 1.5-4 min for a well-developed
  // altar, up to ~10 min for a barely-staffed one.
  pandora: { target: 250 },

  // The Judgement (Silver→Bronze), Step 3 — pleading at Hestia's hearth. Redesigned twice:
  // first from click-spam into hold-to-fill (draining Silver, forced pauses), then AGAIN
  // after direct playtesting flagged holding as too passive/boring, and that the player's
  // own finger covered the button so the "Let it breathe" pause state was hard to notice.
  // Now: a direction-matching swipe game, swiped directly over the flame itself. A target
  // direction (one of HEARTH_DIRECTIONS, never straight down — that would put the fire out)
  // hovers over the bowl; any swipe within angleToleranceDeg of it scores a correct swipe
  // (every correct swipe counts, not just the first per window — an early version only
  // counted one per direction-window, dropped after feedback that it should reward every
  // successful match), and the target direction rotates every few seconds. No Silver Coins
  // involved anymore, no forced cutoff — swipe until targetSwipes is reached (or don't;
  // nothing forces it).
  hearth: {
    targetSwipes: 30, // correct swipes needed to fill completely
    directionMinMs: 2000, directionMaxMs: 3000, // how long each direction stays active
    angleToleranceDeg: 35, // how far off-angle a swipe can be and still count
    minSwipeDist: 30, // px — shorter than this isn't treated as an intentional swipe
  },

  // Festival — unlocked once an altar has its first Hiereus. Repeatable, but self-limiting.
  //
  // Redesigned from a Small/Big-tier system (each giving a blend of worshippers AND
  // resource) to two purpose-built variants, never both on the same hold: Worshippers or
  // Resources. The old blended payout meant a player who only wanted one half of the reward
  // still paid for both — and its Kleos price (kleosBase × kleosGrowth^held) tracked neither
  // reward's actual value, which is what let the worshipper payout become dramatically
  // underpriced late-game (see the worshipper-cap changelog entry: 6 flat worshippers could
  // be worth tens of thousands of Kleos in direct-recruitment terms, for a price that only
  // grew with how many times you'd clicked the button). Both variants now derive their price
  // AND their payout from the altar's own actual state, not from an independent click-count
  // curve — so neither one can drift away from what it's actually worth the way the old
  // shared curve did.
  festival: {
    cooldownMs: 240000, // 4 minutes — shared by both variants, same held counter too; a
    // genuine either/or choice each time the festival is available, not two independent
    // buttons on separate timers.

    // Worshippers variant — always grants a flat 5, priced at 50% of what recruiting 5
    // directly would cost at the altar's CURRENT worshipper count (worshipperCost() summed
    // over the next 5). This is a real discount on a real alternative (direct recruitment
    // exists), unlike the old flat-6-for-a-click-count-price shape. Because worshipperCost()
    // itself grows steeply, the price naturally rises in step with how expensive worshippers
    // actually are — cheap early, a real investment late — with no separate held-based curve
    // needed. Disappears from the card entirely once the altar hits worshipperCap (50): no
    // dead button, the card's own shape just narrows to one choice as the altar matures.
    worshipperFollowers: 5,
    worshipperDiscountPct: 0.5,

    // Resources variant — grants 180 seconds' worth of the altar's current effective
    // resource production, priced at 60 seconds' worth of the altar's BASE Kleos rate
    // (level + worshippers + Hiereus only — deliberately excludes temporary modifiers like
    // Harvest's boost or Neglect's penalty, so the price only moves when something
    // permanent about the altar changes, never from a passing buff or debuff at the moment
    // you happen to click). The 180:60 ratio is the "discount" here, playing the same role
    // worshipperDiscountPct does for the other variant — reward is 3× what the price alone
    // would represent in seconds.
    resourceRewardSeconds: 180,
    resourcePriceSeconds: 60,
  },

  // Ascension. Each Starlight adds this much to the global multiplier, permanently.
  starlightPerAge: 0.1,
};

// Kleos's symbol — a scroll, since kleos is literally "what is said and remembered of you."
// Drop-in replacement for the old plain "K" letter; every existing call site (buttons, cost
// lines, the top status bar) picks this up automatically without needing to change.
function KleosBadge({ size = 13, color = "#6FA8C9" }) {
  return <KleosScrollIcon size={size} style={{ color }} />;

function checkAltarAchievements(god, stats, setGodStats, setHorme, setChronicle, fireNotification, setOfferingBonus, triggerRite) {
  const reached = stats.achievementsReached || [];
  for (const ach of ALTAR_ACHIEVEMENTS) {
    if (!reached.includes(ach.id) && ach.check(stats)) {
      setGodStats((s) => ({
        ...s,
        [god.id]: {
          ...s[god.id],
          achievementsReached: [...((s[god.id] && s[god.id].achievementsReached) || []), ach.id],
          // Full Staff's resource bonus applies here via the same milestoneBonus field
          // stage crossings use (see TUNING.stageBonus/fullStaffBonus) — Full Clergy's
          // Offering bonus is handled separately below, since it's a global stat, not
          // per-altar.
          ...(ach.bonusType === "resource" ? { milestoneBonus: (s[god.id].milestoneBonus || 0) + ach.bonusAmount } : {}),
        },
      }));
      if (ach.bonusType === "offering" && setOfferingBonus) setOfferingBonus((b) => b + ach.bonusAmount);
      if (ach.hormeReward > 0) setHorme((h) => h + ach.hormeReward);
      // Same fix as altar-raised/milestones — first time ever, not once per age.
      setChronicle((c) => c.some((e) => e.id === `${god.id}-achievement-${ach.id}`) ? c : [...c, { id: `${god.id}-achievement-${ach.id}`, chapter: null, text: ach.text ? ach.text(god.name) : null, title: ach.chronicleTitle(god.name) }]);
      const bonusNote = ach.bonusType === "resource" ? `, +${Math.round(ach.bonusAmount * 100)}% ${god.resourceName}`
        : ach.bonusType === "offering" ? `, +${Math.round(ach.bonusAmount * 100)}% Offering`
        : "";
      if (ach.hormeReward > 0) {
        fireNotification(`${ach.title}: ${god.name}\n+${ach.hormeReward} Hormē${bonusNote}`, ach.color, null, null, false, true, null, true);
      } else if (bonusNote) {
        fireNotification(`${ach.title}: ${god.name}\n${bonusNote.replace(/^, /, "+")}`, ach.color, null, null, false, true, null, true);
      } else {
        fireNotification(`${ach.title}: ${god.name}`, ach.color, null, null, false, true, null, true);
      }
      // The Rite explaining Neglect immunity fires alongside the achievement itself, the
      // first time ANY altar reaches "complete" — triggerRite's own ritesUnlocked check
      // already makes this a no-op on every subsequent altar, so no extra gating needed here.
      if (ach.id === "complete" && triggerRite) triggerRite("complete");
    }
  }
}

  if (!god.req) return [];

// Hormē (ὁρμή — "impulse, driving force"): a permanent-within-cycle counter, earned only
// from real milestones (worshipper tiers, altar stage crossings, first Zakoros/Hiereus,
// full staff/clergy, Oracle), never spent, never farmed by raw production. Building altar N
// requires total Hormē >= a mixed linear+quadratic threshold — cheap for the first few
// altars (the quadratic term barely contributes yet), tightening later as it grows in.

function hormeThreshold(godIndex) {
  const h = TUNING.horme;
  return Math.round(h.perIndex * godIndex + h.quadFactor * godIndex * godIndex);
}

// Blends a category color into the popup's dark base — used for the popup BACKGROUND now,
// not the label text, which is always a plain cream so it never has to fight for contrast
// against whatever category color the background is tinted with.
function tintNotifBackground(hex, amount = 0.18) {
  if (!hex) return "rgba(28,24,18,0.92)";
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const base = [28, 24, 18];
  const mix = (baseVal, catVal) => Math.round(baseVal * (1 - amount) + catVal * amount);
  return `rgba(${mix(base[0], r)}, ${mix(base[1], g)}, ${mix(base[2], b)}, 0.94)`;
}

// Built fresh per call (not hoisted to module scope) so it always reflects GODS as loaded —
// cheap, since this only runs for banner text, not on every tick.
function notifHighlightRegex() {
  const resourceNames = GODS.map((g) => g.resourceName).join("|");
  // Two alternatives: the existing "+82 Storm Bolts"-style reward mention, OR a bare
  // resource name on its own (e.g. "Sweet Wine now flows" in the altar-rise banner, which
  // has no leading "+n" to anchor on). Bare mentions fall through to the same gold default
  // below, same as any other unrecognized resource token.
  return new RegExp(`\\+[\\d.,]+[kM]?\\s+(?:Kleos|Hormē|[A-Za-z]+(?:\\s[A-Z][a-z]+)?)|(?:${resourceNames})`, "g");
}

function renderNotifText(text, labelColor) {
  const re = notifHighlightRegex();
  const parts = [];
  let lastIndex = 0;
  let m;
  let key = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > lastIndex) parts.push(<span key={key++} style={{ color: labelColor }}>{text.slice(lastIndex, m.index)}</span>);
    const matched = m[0];
    let color = "#D4A876";
    let background = null;
    if (/Kleos/.test(matched)) color = "#EDE6D6";
    else if (/Hormē/.test(matched)) color = PALETTE.horme.hex;
    else if (/worshippers?/i.test(matched)) color = PALETTE.worshipper.hex;
    else if (/Offering/i.test(matched)) color = "#6FA8C9";
    parts.push(
      <span
        key={key++}
        style={background ? { color, background, borderRadius: "3px", padding: "0 4px" } : { color }}
      >
        {matched}
      </span>
    );
    lastIndex = re.lastIndex;
  }
  if (lastIndex < text.length) parts.push(<span key={key++} style={{ color: labelColor }}>{text.slice(lastIndex)}</span>);
  return parts;
}

// Reveals text one character at a time. `speed` is ms per character; punctuation gets a
// longer beat so the prose breathes. Tap to finish immediately.
function Typewriter({ text, speed = 28, onDone, className, style }) {
  const [shown, setShown] = React.useState(0);
  const done = shown >= text.length;
  React.useEffect(() => { setShown(0); }, [text]);
  React.useEffect(() => {
    if (done) { if (onDone) onDone(); return; }
    const ch = text[shown];
    const pause = ".!?".includes(ch) ? speed * 12 : ",;:—".includes(ch) ? speed * 6 : "\n".includes(ch) ? speed * 10 : speed;
    const t = setTimeout(() => setShown((n) => n + 1), pause);
    return () => clearTimeout(t);
  }, [shown, text, speed, done, onDone]);
  return (
    <p className={className} style={style} onClick={() => setShown(text.length)}>
      {text.slice(0, shown)}
      {!done && <span style={{ opacity: 0.35 }}>▍</span>}
    </p>
  );
}

function formatNum(n) {
  // Full grouped digits below 100k (e.g. "97,900") — precise enough to actually read at a
  // glance, since "97.9k" and "97,400" used to look identical. Only switches to "k"/"M"
  // once the full number would genuinely be too long to be useful.
  // Lowercase "k"/"M" — uppercase "K" is reserved for the Kleos badge everywhere else in
  // the UI. "1.2K K" (1,200 Kleos) was genuinely ambiguous before.
  const floored = Math.floor(n);
  if (floored < 100_000) return floored.toLocaleString("en-US");
  if (floored < 1_000_000) return (floored / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return (floored / 1_000_000).toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "M";
}

// Always-short k/M notation, switching much earlier (at 1k, not 100k) — for tight fixed-
// width spots like the sticky resource strip, where "23,417" doesn't fit but "23.4k" does.
function formatCompact(n) {
  const floored = Math.floor(n);
  if (floored < 1000) return floored.toString();
  if (floored < 1_000_000) return (floored / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return (floored / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
}

function worshipperCost(count) {
  return Math.ceil(TUNING.worshipper.base * Math.pow(TUNING.worshipper.growth, count));
}

// From the Silver Age onward: recruiting a Worshipper also costs Grain, everywhere, since
// Zeus introduced the seasons and farming now matters even for altars that aren't Demeter's.
// This does NOT lift at the next Ascension — the demand is permanent for the rest of the
// life, and only a Reborn should ever clear it. (Ages accumulate demands; they don't swap.)
function grainCost(count) {
  return Math.ceil(TUNING.grain.base * Math.pow(TUNING.grain.growth, count));
}

function agoraUpgradeCost(level) {
  return Math.ceil(TUNING.agora.base * Math.pow(TUNING.agora.growth, level));
}

function farmUpgradeCost(level) {
  return Math.ceil(TUNING.farm.base * Math.pow(TUNING.farm.growth, level));
}

const SILVER_COIN_RATE = TUNING.agora.coinRate;

// Silver Coin rate — was growing too fast because it multiplied by BOTH total worshippers
// AND Agora level, and both climb quickly once worshippers got cheaper. sqrt(level) keeps
// leveling the Agora meaningful without letting it compound linearly forever.
function silverCoinRate(totalWorshippers, agoraLevel, multiplier) {
  return totalWorshippers * Math.sqrt(agoraLevel) * SILVER_COIN_RATE * multiplier;
}

// Farm production now scales with total worshippers across ALL altars, not just its own
// level — same shape as silverCoinRate above, same sqrt-dampening on level.
// The fraction added to Demeter's own Golden Grain output. Level counts as a square root
// so a tall Agros can't outrun the population working it; the harvest window doubles the
// bonus rather than paying out Grain directly.
function farmBonus(totalWorshippers, farmLevel, boosted) {
  if (farmLevel <= 0) return 0;
  const f = TUNING.farm;
  const raw = Math.sqrt(farmLevel) * f.bonusPerLevel + totalWorshippers * f.bonusPerWorshipper;
  return raw * (boosted ? 1 + f.harvestBoostMult : 1);
}

// A god's true resource rate: godRate() plus, for Demeter once the Agros is active, her
// Agros multiplier. Every display of a god's rate should use this rather than calling
// godRate() directly, or Demeter's number silently understates what she actually earns —
// this was showing her raw rate everywhere while the tick quietly applied the real one.
function effectiveGodRate(g, stats, multiplier, ageIndex, farmLevel, built, godStatsAll, harvestBoostUntilMs) {
  const base = godRate(g, stats, multiplier);
  if (g.id !== "demeter" || ageIndex < 1 || farmLevel <= 0 || !built.includes("demeter")) return base;
  const totalWorshippers = built.reduce((sum, id) => sum + ((godStatsAll[id] && godStatsAll[id].worshippers) || 0), 0);
  const boosted = Date.now() < harvestBoostUntilMs;
  return base * (1 + farmBonus(totalWorshippers, farmLevel, boosted));
}

// Worshippers needed (total, across every altar) to take the Farm to its next level —
// grows each level, same shape as the Kleos cost curve.
//
// Building the first Agros costs no worshippers at all. The requirement exists to stop the
// Farm's level running ahead of the population it draws from, and at level 0 there's no
// such thing to prevent — it only made the building sit visible and useless until the
// threshold was met, right when Grain was starting to gate worshippers.
function farmFollowerReq(farmLevel) {
  if (farmLevel === 0) return 0;
  return Math.ceil(TUNING.farm.followerReqBase * Math.pow(TUNING.farm.followerReqGrowth, farmLevel - 1));
}
const SILVER_TO_KLEOS_RATE = TUNING.silverToKleos;

function zakorosCost(count) {
  return Math.ceil(TUNING.zakoros.base * Math.pow(TUNING.zakoros.growth, count));
}

function hiereusCost(count) {
  return Math.ceil(TUNING.hiereus.base * Math.pow(TUNING.hiereus.growth, count));
}

// Historically a Zakoros was ordinary temple labor — plenty of them made sense as a
// congregation grew. A Hiereus was rare, prestigious clergy — real temples had very few,
// scaling with the temple's own grandeur (Stage), not with crowd size.
function hiereusSlots(level) {
  if (level >= 9) return 3; // Sanctuary
  if (level >= 6) return 2; // Grand Temple
  if (level >= 3) return 1; // Temple
  return 0;
}

// The altar's own Oracle (distinct from the future Heroic Age Oracles feature) — at most
// one, only once the altar reaches Sanctuary, like the rare, singular oracles of antiquity
// (Delphi being the archetype). Costs a large one-time offering of the altar's own resource.
// Fixed price per position in the chain (like kleosCost), not derived from resourceRate —
// gives clean, deliberate control instead of resourceRate doing double duty as a "how late/
// expensive" proxy for yet another cost.
// Flat, same for every god — Oracle is "staff" like Worshippers/Zakoros/Hiereus, none of
// which scale with position in the chain either. Still paid in that altar's own resource,
// not Kleos — the one thing that keeps Oracle tied to that altar's own abundance.
function oracleAltarCost(god) {
  return TUNING.oracle.flatCost;
}

// The Pantheon — the capstone. Not an altar and not one of the age buildings: it only
// becomes possible once all thirteen altars have been raised, and it costs a tribute from
// all thirteen at once. Deliberately keyed to "built" rather than "fully developed" — a
// player still mid-upgrade on several altars has to actually choose whether a given
// resource goes toward the next level or toward tribute, instead of the choice being moot
// because everything's already maxed by the time the Pantheon opens. It gates Ascension,
// and like every other mortal work it falls when the age turns. (Later, once Reborn and
// Mnemosyne's Archive exist, Pantheon levels are what generate Memories — hence a level
// rather than a plain built/not-built flag.)
//
// donationsMade is how many of the 13 tributes have already been paid — the cost climbs
// with that count, identical for every god at a given count. Cheapest to be among the
// first to pay, regardless of which altar; costliest to be last, regardless of which altar.
function pantheonCost() {
  return TUNING.pantheon.tributeAmount; // flat 500 for every god now — see TUNING.pantheon's comment
}

function pantheonWaitFor() {
  return TUNING.pantheon.waitMs; // flat 180s for every tribute now — see TUNING.pantheon's comment
}

// pandoraCost removed — Pandora no longer has a per-god payment at all. Redesigned as a
// production-redirect ritual (see TUNING.pandora's comment): activating it sends each god's
// FUTURE production toward TUNING.pandora.target automatically, nothing is paid from an
// existing stockpile, so there's no "cost" to compute anymore.

// Each built altar's own contribution to the Kleos rate — its base, scaled by its own
// level, boosted by a small % per Worshipper it has. This is deliberately the mirror of
// godRate's resource formula below; the two are meant to read as the same shape applied to
// two different economies.
function altarKleosRate(stats) {
  const s = stats || { level: 0, worshippers: 0, hiereus: 0 };
  const k = TUNING.kleos;
  const base = k.perAltar * (1 + k.altarLevelFactor * s.level);
  return base * (1 + (s.worshippers || 0) * k.perWorshipperPct + (s.hiereus || 0) * k.perHiereusPct);
}

function kleosRate(built, godStats, multiplier, excludeIds) {
  if (built.length === 0) return 0; // baseline only starts once the first altar exists
  const k = TUNING.kleos;
  const altarSum = built.reduce((sum, id) => (excludeIds && excludeIds.has(id) ? sum : sum + altarKleosRate(godStats[id])), 0);
  return (k.baseline + altarSum) * multiplier;
}

function upgradeCost(god, level) {
  // Steeper than before: the old curve let a whole early stockpile buy 7 levels on a single
  // altar before a second or third one was even built. Higher base + steeper growth means
  // heavy investment in one altar early on costs real, sustained accumulation.
  // base is NOT rounded here — rounding a small intermediate value (post the ×0.15 rescale)
  // collapsed several adjacent gods onto the same integer base (e.g. Poseidon/Hera/Zeus/
  // Athena all landed on 3), making their upgrade costs identical. Only the final cost
  // rounds, so every god's own req.amount stays distinct all the way through.
  // No more special-case for level 9 (the last upgrade, → level 10) — it used to be fixed
  // at a flat 700, set back when flatBase was still 3.0 and the formula's own value there
  // (467) was too low to be a real capstone. Once flatBase was later raised to 8, the
  // formula's own level-9 value (1,232) already exceeds level 8's own cost (704) — the
  // hardcoded 700 had quietly become CHEAPER than the level before it, the opposite of a
  // capstone. Removed; the plain formula already does the job now.
  const u = TUNING.upgrade;
  return Math.ceil(u.flatBase * Math.pow(u.growth, level));
}

function godRate(god, stats, multiplier) {
  const s = stats || { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, milestoneBonus: 0 };
  const r = TUNING.godRate;
  const base = god.resourceRate * (1 + r.perLevel * s.level);
  const boost = 1 + (s.worshippers || 0) * r.perWorshipperPct + (s.zakoros || 0) * r.perZakorosPct;
  return base * boost * (1 + (s.milestoneBonus || 0)) * multiplier;
}

function nextMilestone(worshippers) {
  return MILESTONES.find((m) => m.count > worshippers) || null;
}

// One Zakoros slot per 5 worshippers — ordinary temple labor, plenty of it as the
// congregation grows (unlike Hiereus, whose slots come from the altar's Stage instead).
function zakorosSlots(worshippers) {
  return Math.min(Math.floor((worshippers || 0) / TUNING.zakorosPerWorshippers), TUNING.zakorosCap);
}

// How many Zakoros an altar needs on-site to take its *next* level. Every level now
// requires at least some Zakoros (no more free levels), and the requirement holds flat
// through a whole stage rather than only spiking at the crossing itself: 1 before Temple
// (levels 0→1, 1→2), 2 through Temple (2→3, 3→4, 4→5), 5 through Grand Temple (5→6, 6→7,
// 7→8), 8 through Sanctuary (8→9, 9→10). The four thresholds (2, 5, 8, 10) are each one
// less than the next stage's own level (Temple 3, Grand Temple 6, Sanctuary 9) — so a
// stage's Zakoros requirement locks in the moment you cross into it and stays there for
// every level inside it, instead of resetting to 0 right after the crossing like the
// previous version did.
function zakorosNeededForLevel(level) {
  const target = level + 1;
  if (target <= 2) return 1;
  if (target <= 5) return 2;
  if (target <= 8) return 5;
  if (target === 9) return 8; // crossing into Sanctuary
  return 10; // target 10 — the altar's very last level now demands the full Zakoros cap
}

// identity moved to the periodic blessing (see ORACLE tick below) once "complete" made
// recruitment itself less central. Kept as named wrappers rather than inlining
// worshipperCost/grainCost at every call site, in case a future discount source appears.
function worshipperCostFor(stats) {
  return worshipperCost(stats.worshippers);
}
function grainCostFor(stats) {
  return grainCost(stats.worshippers);
}

function loadSave() {
  try {

    // Migration: godStats used to store this field as "priests" (a leftover from before the
    // Zakoros naming existed, renamed to "zakoros" throughout the code). Reads an old save's
    // old field (via bracket notation with a string literal, so it's immune to any future
    // identifier-based rename accidentally clobbering this migration itself — which is
    // exactly what happened here the first time this was written) as a fallback, so existing
    // games don't silently lose their Zakoros count on the next load.
    if (save && save.godStats) {
      Object.keys(save.godStats).forEach((id) => {
        const g = save.godStats[id];
        const oldField = "priests";
        if (g && g.zakoros === undefined && g[oldField] !== undefined) {
          g.zakoros = g[oldField];
          delete g[oldField];
        }

    }
    return save;
  } catch (e) {

  }
}

      // Kept separate from pausedIds because the resource loop treats pausedIds as a full
      // stop, and resentment only withholds a fifth of the tribute.
      const noKleosIds = new Set([...pausedIds, ...Object.keys(neglectedGods)]);

      if (hasOffered) {
        setKleos((k) => k + kleosRate(built, godStats, kleosMultiplier, noKleosIds));
      }
      // The Agros multiplies Demeter's own yield rather than producing Grain itself.
      const farmWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
      const demeterFarmBonus = (ageIndex >= 1 && farmLevel > 0 && built.includes("demeter"))
        ? farmBonus(farmWorshippers, farmLevel, Date.now() < harvestBoostUntil.current)
        : 0;
      // When a god's Pandora redirect is toggled on, its production redirects to
      // pandoraProgress instead of its normal resource pool until it hits
      // TUNING.pandora.target — nothing already banked is touched, only future production.
      // Checked per-god (pandoraActiveGods) — each god can be started and stopped
      // individually, not one global switch for all 13 at once.
      //
      // BUG FIX: this used to be computed as a side effect INSIDE setResources's own
      // updater function, then read again immediately after the setResources call. React
      // doesn't guarantee that updater function runs synchronously before the next line of
      // code executes — so pandoraGains was often still empty {} by the time it was
      // checked, meaning setPandoraProgress never fired and every god sat stuck at 0%
      // forever, confirmed directly by testing (1 minute in, still 0% across the board).
      // Fixed by computing pandoraGains as an ordinary synchronous loop first, using
      // godStats/built directly from this tick's own closure — no dependency on when React
      // decides to actually run the setResources updater.
      const pandoraGains = {};
      built.forEach((id) => {
        if (pausedIds.has(id) || pandoraDonations[id] || !pandoraActiveGods[id]) return;
        const g = GODS_BY_ID[id];
        const withheld = neglectedGods[id] ? (1 - TUNING.neglect.resourcePenalty) : 1;
        const farmed = id === "demeter" ? 1 + demeterFarmBonus : 1;
        pandoraGains[id] = godRate(g, godStats[id], multiplier) * withheld * farmed;
      });
      setResources((r) => {
        const next = { ...r };
        built.forEach((id) => {
          if (pausedIds.has(id)) return; // this altar's production is paused for a festival
          if (pandoraGains[id] !== undefined) return; // redirected — this altar's own resource pool doesn't grow this tick
          const g = GODS_BY_ID[id];
          // A resentful god holds back part of its own tribute — kept mild (−20%) because
          // this is the very resource upgrades are paid in, and a harsh cut here would make
          // the punishment prolong its own cure.
          const withheld = neglectedGods[id] ? (1 - TUNING.neglect.resourcePenalty) : 1;
          const farmed = id === "demeter" ? 1 + demeterFarmBonus : 1;
          const amount = godRate(g, godStats[id], multiplier) * withheld * farmed;
          const produced = (next[id] || 0) + amount;
          // A cap always applies — defaultCap before Thesauros is built, the full (higher)
          // cap after. Thesauros raises an existing ceiling rather than introducing one
          // from nothing; production above whichever cap is active is simply not gained,
          // no overflow conversion (see TUNING.thesauros's comment).
          next[id] = Math.min(produced, thesaurosBuilt ? effectiveThesaurosCap() : TUNING.thesauros.defaultCap);
        });
        return next;
      });
      if (Object.keys(pandoraGains).length > 0) {
        const completions = Object.keys(pandoraGains).filter(
          (id) => (pandoraProgress[id] || 0) + pandoraGains[id] >= TUNING.pandora.target
        );
        setPandoraProgress((p) => {
          const next = { ...p };
          Object.keys(pandoraGains).forEach((id) => { next[id] = (next[id] || 0) + pandoraGains[id]; });
          return next;
        });
        if (completions.length > 0) {
          setPandoraDonations((d) => {
            const next = { ...d };
            completions.forEach((id) => { next[id] = true; });
            return next;
          });
        }
      }

      // Oracle's periodic blessing — each consulted altar gets its own randomized timer.
      // Fires roughly every 3-5 minutes, giving either Kleos or that altar's own resource.
      built.forEach((id) => {
        const stats = godStats[id];
        if (!stats || (stats.oracle || 0) < 1) return;
        // A resentful god withdraws its visions. Otherwise the Oracle would quietly heal
        // the neglect it was meant to be punished for, and losing that income while
        // resentful is itself part of the penalty.
        if (neglectedGods[id]) return;
        const now = Date.now();
        const o = TUNING.oracle;
        if (!oracleTimers.current[id]) {
          oracleTimers.current[id] = now + o.intervalMinMs + Math.random() * (o.intervalMaxMs - o.intervalMinMs);
          return;
        }
        if (now >= oracleTimers.current[id]) {
          oracleTimers.current[id] = now + o.intervalMinMs + Math.random() * (o.intervalMaxMs - o.intervalMinMs);
          const g = GODS_BY_ID[id];
          // Hormē was dropped from the vision table: it gates how many altars may stand,
          // and handing it out on a 3-5 minute timer per Oracle made the gate drift with
          // how long you'd left the game running rather than with what you'd built. The
          // 15% it used to occupy is split between the two remaining rewards; the "nothing"
          // outcome keeps its 15%.
          // Rebalanced 42.5/42.5/15 -> 35/50/15 (Kleos/resource/nothing): a Kleos vision is
          // 90s of one altar's contribution to a pool fed by all 13, while a resource
          // vision is 90s of the ONLY source of that specific resource — same nominal
          // reward size, different real weight, so resource now outweighs Kleos slightly.
          const roll = Math.random();
          if (roll < 0.35) {
            const reward = Math.max(1, Math.ceil(altarKleosRate(stats) * multiplier * o.rewardSeconds));
            fireNotification(
              ``, PALETTE.oracle.hex,
              `A favorable omen.\n+${formatNum(reward)} Kleos`,
              { type: "kleos", amount: reward }, true
            );
          } else if (roll < 0.85) {
            const reward = Math.ceil(godRate(g, stats, multiplier) * o.rewardSeconds);
            fireNotification(
              ``, PALETTE.oracle.hex,
              `A fortunate season.\n+${formatNum(reward)} ${g.resourceName}`,
              { type: "resource", godId: id, amount: reward }, true
            );
          } else {
            fireNotification(
              ``, PALETTE.oracle.hex,
              `The vapors rise — and settle again, saying nothing.`,
              null, true
            );
          }
        }
      });

      // God personality lines — ambient flavor, no reward. Every ~10 minutes of active
      // play, one random built god with a personalityLines pool advances to its own next
      // line (cycling back to the start once it reaches the end). Deliberately NOT
      // triggered by tapping — an earlier version let tapping draw a fresh line each time,
      // which meant a player could spam through a god's whole pool in seconds, defeating
      // the point of it being rare; tapping now only ever shows whatever is already active.
      (() => {
        const now = Date.now();
        if (personalityLineTimer.current === 0) {
          personalityLineTimer.current = now + TUNING.personalityLine.intervalMs;
          return;
        }
        if (now < personalityLineTimer.current) return;
        personalityLineTimer.current = now + TUNING.personalityLine.intervalMs;
        const eligible = built.filter((id) => (GODS_BY_ID[id].personalityLines || []).length > 0);
        if (eligible.length === 0) return;
        const pickId = eligible[Math.floor(Math.random() * eligible.length)];
        const poolLen = GODS_BY_ID[pickId].personalityLines.length;
        setGodPersonalityIndex((p) => ({ ...p, [pickId]: ((p[pickId] ?? -1) + 1) % poolLen }));
      })();

      // Silver Age buildings — available from the Silver Age onward, but rebuilt each age
      if (ageIndex >= 1) {
        if (agoraLevel > 0) {
          const totalWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
          setSilverCoins((sc) => sc + silverCoinRate(totalWorshippers, agoraLevel, multiplier));
        }
        if (farmLevel > 0 && built.includes("demeter")) {
          const now2 = Date.now();
          if (!harvestWindowNext.current) {
            harvestWindowStart.current = now2;
            harvestWindowNext.current = now2 + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
          } else if (harvestWindowUntil.current === 0 && now2 >= harvestWindowNext.current) {
            harvestWindowUntil.current = now2 + TUNING.farm.harvestOpenMs;
            // Previously nothing told the player the window had opened — only the pulsing
            // badge on the Agros card itself, easy to miss on any other tab. Fires once, the
            // moment the window opens (not when claimed — that has its own separate
            // confirmation below). "Show me" jumps straight to Agros via riteLink.
            fireNotification("The harvest window has opened.", "#C2BA6E", null, null, false, false, "agros");
          } else if (harvestWindowUntil.current > 0 && now2 > harvestWindowUntil.current) {
            harvestWindowUntil.current = 0;
            harvestWindowStart.current = now2;
            harvestWindowNext.current = now2 + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
          }
          // No production here any more — the bonus is applied to Demeter's own altar in
          // the resource loop above, so all Golden Grain still flows from her.
        }

  }, [built, multiplier, godStats, hasOffered, ageIndex, agoraLevel, farmLevel, thesaurosBuilt, workerAssignments, neglectedGods, wrathChronicled, telosAges, testSessionActive, pandoraActiveGods, pandoraProgress, pandoraDonations, pantheonLevel, judgementDone, silentGods, pantheonFeastUntil]);

  // Any banner timers still pending when the view goes away would fire against unmounted

  useEffect(() => () => {
    Object.values(bannerTimers.current).forEach((ts) => ts.forEach(clearTimeout));
    bannerTimers.current = {};
    if (giftIntroTimer.current) clearTimeout(giftIntroTimer.current);
    if (boundTimer.current) clearTimeout(boundTimer.current);
    if (giftGapTimer.current) clearTimeout(giftGapTimer.current);
  }, []);

  const scheduleNotifDismiss = useCallback((durationMs) => {
    if (notifTimeout.current) clearTimeout(notifTimeout.current);

      notifTimeout.current = setTimeout(() => setNotification(null), 700);
    }, durationMs);
  }, []);

  const BANNER_MAX = 3;
  const BANNER_LIFE_MS = 6500;
  // Myth-moment banners (age transitions, Prometheus, Judgement) stay up considerably
  // longer — they're rare, one-off narrative beats, not routine feedback, and deserve more
  // than a glance before fading.
  const BANNER_LIFE_MS_MYTH = 11000;

  // Banners no longer overwrite one another: a new one takes the top slot and pushes the
  // previous ones down, dimming as they go. Each keeps its own lifetime from the moment it
  // appeared, so they expire one at a time rather than all at once.
  const pushBannerNow = useCallback((text, color, chronicleLink, riteLink, milestone, myth) => {
    const id = ++bannerSeq.current;
    setBanners((prev) => {
      const next = [{ id, text, color: color || "#E8DCC8", chronicleLink: !!chronicleLink, riteLink: riteLink || null, milestone: !!milestone, myth: !!myth, fading: false }, ...prev];
      // Anything pushed past the third slot is dropped immediately — and its pending
      // timers with it, so they can't fire against an entry that no longer exists.
      next.slice(BANNER_MAX).forEach((b) => {
        if (bannerTimers.current[b.id]) {
          bannerTimers.current[b.id].forEach(clearTimeout);

        setBanners((prev) => prev.filter((b) => b.id !== id));
        delete bannerTimers.current[id];
      }, 700);
      bannerTimers.current[id] = [...(bannerTimers.current[id] || []), gone];

  // myth (optional, 9th param): a slow gold glow-pulse + double border, longer display time

  const fireNotification = useCallback((text, color, revealText, pendingReward, vision, chronicleLink, riteLink, milestone, myth) => {
    if (!vision) { pushBanner(text, color, chronicleLink, riteLink, milestone, myth); return; }
    setNotification((prev) => {

      // made it look like the popup was suddenly jumping to a new corner. Just skip this
      // one; the altar's own timer will try again next cycle.
      if (vision && prev && prev.corner) return prev;
      const corner = vision
        ? {
            v: Math.random() < 0.5 ? "top" : "bottom",
            h: Math.random() < 0.5 ? "left" : "right",
            jx: Math.round(Math.random() * 24),
            jy: Math.round(Math.random() * 24),
          }
        : null;
      return { text, color: color || "#E8DCC8", revealText: revealText || null, pendingReward: pendingReward || null, corner, fading: false, chronicleLink: !!chronicleLink };
    });

  }, [scheduleNotifDismiss, pushBanner]);

  const revealNotification = useCallback(() => {
    setNotification((n) => {

      let floatText = "nothing";
      if (n.pendingReward) {
        const pr = n.pendingReward;
        if (pr.type === "kleos") {
          setKleos((k) => k + pr.amount);
          ringColor = "#6FA8C9"; floatText = `+${formatNum(pr.amount)} Kleos`;
        } else {

          ringColor = "#D4A876"; floatText = `+${formatNum(pr.amount)} ${GODS_BY_ID[pr.godId].resourceName}`;
        }
      }

    });

    // takes 2.2s, and dismissing at 950ms cut it off halfway.
    scheduleNotifDismiss(2100);
  }, [scheduleNotifDismiss]);

  function hasEnoughHorme(god) {
    const idx = GODS.findIndex((x) => x.id === god.id);
    return horme >= hormeThreshold(idx);
  }

  // No consequence applies here anymore — the Judgement was redesigned to be purely
  // narrative (see judgementDone's own comment), removing the Bronze-Age +20% Kleos-cost
  // penalty an earlier version tied to it. Kept as a named function, rather than reverting
  // every call site back to a bare `.kleosCost`, so nothing else needs to change if a real
  // consequence is ever added here again later.
  function effectiveKleosCost(god) {
    return god.kleosCost;
  }

  function canAffordGod(god) {
    if (kleos < effectiveKleosCost(god)) return false;
    if (!hasEnoughHorme(god)) return false;
    const reqs = buildRequirements(god);
    for (const r of reqs) {
      if ((resources[r.id] || 0) < r.amount) return false;
    }
    return true;
  }

  function buildAltar(god) {
    if (built.includes(god.id)) return;
    if (!canAffordGod(god)) {
      // Fires only when Hormē specifically is the thing blocking this tap — not Kleos, not
      // resources — so the explanation lands exactly when a player presses the button and
      // hits that particular wall, not on every render where the button happens to be
      // disabled for some other reason.
      const reqs = buildRequirements(god);
      const resourcesOk = reqs.every((r) => (resources[r.id] || 0) >= r.amount);
      if (kleos >= effectiveKleosCost(god) && resourcesOk && !hasEnoughHorme(god)) {
        triggerRite("horme");
      }
      return;
    }
    touchAltar(god.id); // starts its neglect clock from the moment it's raised
    logTestEvent("altar_built", { god: god.id, kleosCost: effectiveKleosCost(god) });
    setKleos((k) => k - effectiveKleosCost(god));
    // Gives every built altar its first personality line immediately (index 0), rather than
    // leaving it empty until the ambient rotation happens to pick that specific god at
    // random — confirmed directly that this created a visibly inconsistent state (Hestia
    // had a line, Demeter didn't, purely by chance of which god the timer had picked so
    // far). The ambient rotation (see its own effect) still handles moving PAST this first
    // line over time — this only guarantees something is showing from the moment an altar
    // with any personalityLines exists at all.
    if (god.personalityLines && god.personalityLines.length > 0) {
      setGodPersonalityIndex((p) => (p[god.id] !== undefined ? p : { ...p, [god.id]: 0 }));
    }

      setShowFlowHint(true);
      if (hintTimeout.current) clearTimeout(hintTimeout.current);
      hintTimeout.current = setTimeout(() => setShowFlowHint(false), 10000);

        reqs.forEach((req) => {

        return next;

    setGodStats((s) => ({ ...s, [god.id]: { level: 0, worshippers: 0, zakoros: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 } }));
    // Fires only the first time this god's altar is ever built, across every age — the
    // origin story is a timeless myth, not a repeatable event, so re-raising the same altar
    // in a later age shouldn't re-tell it word-for-word. (Caught from a screenshot showing
    // "Hestia's altar was raised" duplicated several times after an Ascension.)
    setChronicle((c) => c.some((e) => e.id === god.id) ? c : [...c, { id: god.id, chapter: null, text: god.story, title: `${god.name}'s altar was raised.` }]);
    fireNotification(`${god.name}'s altar rises — ${god.resourceName} ${god.riseVerb}`, "#D4A876", null, null, false, true);
    // The Agros is introduced when Demeter's altar rises — that's the point grain-growing
    // actually means something, rather than announcing it on day one of the Silver Age
    // alongside the Agora. The Rite fires at this same moment now too — it used to fire
    // later, the first time the player actually spent Kleos on it, leaving a gap where the
    // card was already visible/buildable but nothing had explained it yet.
    if (god.id === "demeter" && ageIndex >= 1 && !agrosIntroduced) {

        {
          id: "agros-introduced", chapter: null,
          title: "The seasons begin. What was free must now be earned.",
          text: "Demeter's altar stands, and the sky above the mountain answers to seasons now, not just to gods. Persephone spends half the year below and half above, and the earth keeps her schedule exactly — barren while she's gone, green the moment she's back. The fields must be worked, same as anyone's, from here on. It isn't worship, exactly. It's closer to farming.",

      ]);
      fireNotification("The seasons begin.", "#C2BA6E", null, null, false, true);
    }
  }

    // wait — floored at waitFloorMs remaining FROM NOW, so the last stretch before it

    const now = Date.now();

    const silenceText = silenceActive ? SILENCE_LINES[Math.floor(Math.random() * SILENCE_LINES.length)] : null;

  }

  function recruitZakoros(god) {

    if (zakorosSlots(stats.worshippers) === 0) return;
    if ((stats.zakoros || 0) >= zakorosSlots(stats.worshippers)) return;
    const cost = zakorosCost(stats.zakoros || 0);
    if (kleos < cost) return;

    setKleos((k) => k - cost);
