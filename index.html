  // Raised from the default 768px — an iPad in portrait is 768-1024px wide depending on
  // model, which is *wider* than the default breakpoint, so it was getting the desktop
  // layout even held upright. 1030px covers every iPad's portrait width, so touch tablets
  // stay on the mobile layout regardless of model; only genuinely wide windows go desktop.
  tailwind.config = { theme: { extend: { screens: { md: "1030px" } } } };
</script>

function MaskIcon(dataUri) {
  // `height` is optional and defaults to `size` — every god/building icon is square, but the
  // Pantheon silhouette is roughly 3:1 and would otherwise sit in a tall box of dead space.
  // Extra style (opacity, margin) is spread last so callers can override.
  return function Icon({ size = 20, height, style = {}, className }) {
    const color = (style && style.color) || "currentColor";
    return (
      <span
        className={className}
        style={{
          display: "inline-block",
          width: size,
          height: height != null ? height : size,
          flexShrink: 0,
          backgroundColor: color,
          WebkitMaskImage: `url(${dataUri})`,
          maskImage: `url(${dataUri})`,
          WebkitMaskSize: "contain",
          maskSize: "contain",
          WebkitMaskRepeat: "no-repeat",
          maskRepeat: "no-repeat",
          WebkitMaskPosition: "center",
          maskPosition: "center",
          ...style,
        }}
      />
    );
  };
}

const TUNING = {
  // Kleos: the altar itself is the only base source (perAltar, scaled by that altar's own
  // level via altarLevelFactor — the same 0.3/level curve resourceRate uses, so leveling an
  // altar helps both economies by the same proportion). Worshippers and Hiereus both add a
  // % on top of their own altar's Kleos contribution — Hiereus used to be a flat global add
  // ("felt across all of Olympus"), which meant it never mattered *where* you put them.
  // Making it local, like Zakoros already was for resource, means a highly-leveled altar
  // becomes worth more to staff with Hiereus than a fresh one — an actual reason to
  // specialize altars instead of treating all 13 as identical.
  kleos: { baseline: 0.3, perAltar: 0.4, altarLevelFactor: 0.3, perWorshipperPct: 0.01, perHiereusPct: 0.15 },

  // Manual offering: reward scales off the god's own resourceRate so late gods give more.
  offering: { rewardPerRate: 30 },

  // Altar upgrades. `base` is derived from the god's unlock requirement (or 18 for Hestia,
  // who has none), then grows per level. This curve is the single biggest pacing dial.
  // baseFromReqFactor and hestiaBase divided by 10 alongside every god's resourceRate below
  // — keeps the ratio of income-to-upgrade-cost unchanged (so pacing doesn't get 10x
  // grindier), while the raw tribute amounts on each god (10-40) stay untouched, since
  // those were never the thing pushing numbers into the thousands.
  upgrade: { baseFromReqFactor: 0.15, hestiaBase: 1.8, growth: 1.75 },

  // Resource: same altar-is-the-base shape as Kleos. Worshippers add a small % (their
  // devotion helps a little of everything); Zakoros add a bigger % but only to their own
  // altar's resource — they work the altar directly, so their labor should show up there
  // and nowhere else. Hiereus no longer touch resource at all (see kleos.perHiereus above).
  godRate: { perLevel: 0.3, perWorshipperPct: 0.01, perZakorosPct: 0.1 },

  // Followers. Worshippers are cheap and numerous; Hiereus are rare and expensive.
  // Growth lowered from 1.15 — worshippers used to give a flat +0.15/s bonus, which
  // justified a steep price. Now they give a small % boost instead, so the old curve made
  // #50 (right where the Zakoros cap sits) cost ~10.8k Kleos alone. 1.11 brings the total
  // cost of 0→50 down roughly 4x, still a real investment but not a wall right at the cap.
  // Lowered again from 1.11 → 1.08 — 50 worshippers (the Zakoros cap) was still ~16.7k
  // Kleos total, too steep a wall right where the cap sits. Now ~5.8k.
  // Base also lowered 10 → 5 — halves the whole curve proportionally, so the very first
  // worshipper (and everything after) comes noticeably faster.
  worshipper: { base: 5, growth: 1.08 },
  grain: { base: 0.8, growth: 1.15 },     // Silver Age onward, on top of Kleos — scaled with Demeter's resourceRate
  priest: { base: 35, growth: 1.4 },
  hiereus: { base: 80, growth: 1.45 },
  // Oracle's periodic blessing — fires every 3-5 real minutes per consulted altar, giving
  // either Kleos or that altar's own resource (picked at random), worth roughly this many
  // seconds of that altar's current rate. Not a Chronicle event — it repeats too often to
  // be a story beat, just a notification.
  // Oracle's altar-consultation cost is flat (see TUNING.oracle.flatCost below), same for
  // every god — it doesn't scale with position, unlike Pantheon/Pandora/upgrade costs.
  oracle: { flatCost: 400, intervalMinMs: 180000, intervalMaxMs: 300000, rewardSeconds: 90 },
  zakorosPerWorshippers: 5,                // one Zakoros slot per N worshippers
  zakorosCap: 10,                          // hard ceiling — a real temple kept a small, curated staff regardless of crowd size
  // Neglect. A god resents being left behind — but only once it has *had* attention and
  // then lost it, so building a new altar late never instantly flags it (no timer needed).
  // The threshold is the harsher of "half the average" (mild early) and "three below the
  // average" (strict late, when everything clusters near the level 10 ceiling).
  neglect: {
    minAltars: 3,          // nothing is judged until this many altars stand
    minAvgLevel: 3,        // ...and the pantheon has some height to be measured against
    lagFactor: 0.5,        // neglected below avg × this
    lagFlat: 3,            // ...or below avg − this, whichever threshold is higher
    // A resentful god falls silent: its altar contributes no Kleos at all. Stated as a
    // whole withdrawal rather than a percentage — there's no number to read, just a line
    // gone from the rate. Measured against real pantheons this costs 5-10% of total Kleos,
    // most of it early, which is where the fewest altars make it easiest to act on.
    resourcePenalty: 0.20,  // ...and it holds back a fifth of its own tribute
  },
  maturedAutoWorshipperRate: 0.02,         // free worshippers/sec once an altar hits the "matured" achievement

  // Hormē — gates how many altars may stand at once. Quadratic, so each new god costs
  // meaningfully more divine will than the last.
  // gateFactor raised 0.4 → 0.8 — Hormē income has grown a lot since this was set (Full
  // Staff/Full Clergy/matured achievements alone add up to 12 per altar, on top of Oracle
  // blessings and stage crossings), so the altar-gate needed to grow to match.
  horme: { gateFactor: 0.8, perOffering: 5 },

  // Silver Age buildings.
  agora: { base: 50, growth: 1.6, coinRate: 0.025 }, // coins per worshipper per level per sec — halved, was accumulating too fast late-game
  // Farm — mirrors the Agora's shape now: total worshippers × sqrt(level), not just level
  // alone, so it feels tied to the whole civilization the way Agora does. unlockWorshippers
  // gates it behind total worshippers across ALL altars (not just Demeter's), since the
  // Grain demand it answers is universal from the Silver Age on. overflowCap grows with
  // level too — leveling the Farm raises how much Grain it can hold before the surplus
  // starts quietly converting to Kleos on its own. Upgrading also now needs a growing total
  // of worshippers, not just Kleos — Zeus introduced the seasons, and reading them takes
  // more hands each time. Harvest is now a seasonal window (like the Oracle's own rhythm)
  // rather than an always-on button, and boosts the Farm's own rate for a while instead of
  // paying out Kleos directly — overflow-to-Kleos remains the only Grain→Kleos path.
  farm: {
    base: 40, growth: 1.5, grainRate: 0.006, unlockWorshippers: 15,
    followerReqBase: 30, followerReqGrowth: 1.25,
    overflowCapBase: 800, overflowCapPerLevel: 0.05, overflowToKleos: 0.15,
    harvestWindowMinMs: 300000, harvestWindowMaxMs: 480000, harvestOpenMs: 90000,
    harvestBoostMs: 180000, harvestBoostMult: 1.0,
  },
  silverToKleos: 0.5, // 2 Silver Coins → 1 Kleos (reversed from the old 1 coin → 2 Kleos)
  // Silver-to-resource exchange: pricier resources (higher resourceRate — the same proxy
  // used for Pantheon/Pandora/Oracle costs) cost more coins per unit than cheap ones.
  // Lowered again so silver is consistently weak against every god, not just some — before,
  // cheap-rate gods (like Hestia) still gave more resource units than coins spent, which
  // read as inconsistent with the Kleos rate (2 coins → 1 Kleos, always <1 per coin). Now
  // even the cheapest god gives ~0.5 units/coin, the priciest ~0.25.
  silverToResourceFactor: 0.008, // 5x more expensive again — still too generous at 0.04

  // The Pantheon — the capstone that gates Ascension.
  // minStage raised Temple(3) → Sanctuary(9): a real capstone now, not something reached
  // almost by accident. costPerRate ×10 for the same reason as Oracle above.
  pantheon: { minStage: 9, costPerRate: 12000 }, // scaled back down a bit from 30000

  // Golden Age ending, part 1: Prometheus steals fire once the Pantheon stands. One-time,
  // permanent — a flat addition to the production multiplier, same mechanism as Starlight
  // but earned narratively rather than through Ascension.
  prometheus: { fireBoostPct: 0.10 },

  // Golden Age ending, part 2: Pandora. Costs a tribute from all 13, using their own
  // existing resources — pricier than the Pantheon (150 vs 100 × resourceRate) since this
  // was never meant to be a cheap gift.
  pandora: { costPerRate: 1500 }, // ×10, same rescale-compensation as Pantheon/Oracle

  // Festival — unlocked once an altar has its first Hiereus. Repeatable, but self-limiting
  // three ways at once: an escalating Kleos price, an escalating price in the altar's own
  // resource, and a real cooldown between uses. That altar's own production pauses briefly
  // each time (the festival IS the interruption). Reward is deliberately small and permanent
  // — a nudge to the base Offering, plus a modest worshipper windfall — because it's meant
  // to be worth doing again, not to be maximized.
  festival: {
    kleosBase: 200, kleosGrowth: 1.6,
    resourceBase: 150, resourceGrowth: 1.4,
    cooldownMs: 240000, // 4 minutes
    pauseMs: 12000, // 12 seconds — that altar's production pauses
    offeringBoost: 0.5, // raised 5x — was too small to feel like Festival mattered for Offering
    followerMin: 3, followerMax: 5,
  },

  // Ascension. Each Starlight adds this much to the global multiplier, permanently.
  starlightPerAge: 0.1,
};

// Kleos's symbol — a scroll, since kleos is literally "what is said and remembered of you."
// Drop-in replacement for the old plain "K" letter; every existing call site (buttons, cost
// lines, the top status bar) picks this up automatically without needing to change.
function KleosBadge({ size = 13, color = "#6FA8C9" }) {

function currentStage(level) {
  let stage = STAGES[0];
  for (const s of STAGES) if (level >= s.level) stage = s;
  return stage;
}

function nextStage(level) {
  return STAGES.find((s) => s.level > level) || null;

function buildRequirements(god) {
  if (!god.req) return [];
  return [{ id: god.req.id, amount: god.req.amount }];

// from real milestones (worshipper tiers, altar stage crossings), never spent, never farmed
// by raw production. Building altar N requires total Hormē >= a quadratic threshold —
// cheap for the first few altars, steep for the last ones.

function hormeThreshold(godIndex) {
  return Math.round(TUNING.horme.gateFactor * godIndex * godIndex);
}

function renderRitesText(text) {
  const parts = text.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i} style={{ color: "#D4A876", fontWeight: 600 }}>{part.slice(2, -2)}</strong>;
    }
    if (part.startsWith("*") && part.endsWith("*")) {
      return <em key={i}>{part.slice(1, -1)}</em>;
    }
    return <span key={i}>{part}</span>;
  });
}

// Blends a category color into the popup's dark base — used for the popup BACKGROUND now,
// not the label text, which is always a plain cream so it never has to fight for contrast
// against whatever category color the background is tinted with.
function tintNotifBackground(hex, amount = 0.18) {
  if (!hex) return "rgba(28,24,18,0.92)";
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const base = [28, 24, 18];
  const mix = (baseVal, catVal) => Math.round(baseVal * (1 - amount) + catVal * amount);
  return `rgba(${mix(base[0], r)}, ${mix(base[1], g)}, ${mix(base[2], b)}, 0.94)`;
}

function renderNotifText(text, labelColor) {
  const re = /\+[\d.,]+[kM]?\s+(?:Kleos|Hormē|[A-Za-z]+(?:\s[A-Z][a-z]+)?)/g;
  const parts = [];
  let lastIndex = 0;
  let m;
  let key = 0;
  while ((m = re.exec(text)) !== null) {
    if (m.index > lastIndex) parts.push(<span key={key++} style={{ color: labelColor }}>{text.slice(lastIndex, m.index)}</span>);
    const matched = m[0];
    let color = "#D4A876";
    let background = null;
    if (/Kleos/.test(matched)) color = "#EDE6D6";
    else if (/Hormē/.test(matched)) color = PALETTE.horme.hex;
    else if (/worshippers?/i.test(matched)) color = PALETTE.worshipper.hex;
    else if (/Offering/i.test(matched)) color = "#6FA8C9";
    parts.push(
      <span
        key={key++}
        style={background ? { color, background, borderRadius: "3px", padding: "0 4px" } : { color }}
      >
        {matched}
      </span>
    );
    lastIndex = re.lastIndex;
  }
  if (lastIndex < text.length) parts.push(<span key={key++} style={{ color: labelColor }}>{text.slice(lastIndex)}</span>);
  return parts;
}

function formatNum(n) {
  // Full grouped digits below 100k (e.g. "97,900") — precise enough to actually read at a
  // glance, since "97.9k" and "97,400" used to look identical. Only switches to "k"/"M"
  // once the full number would genuinely be too long to be useful.
  // Lowercase "k"/"M" — uppercase "K" is reserved for the Kleos badge everywhere else in
  // the UI. "1.2K K" (1,200 Kleos) was genuinely ambiguous before.
  const floored = Math.floor(n);
  if (floored < 100_000) return floored.toLocaleString("en-US");
  if (floored < 1_000_000) return (floored / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return (floored / 1_000_000).toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "M";
}

// Always-short k/M notation, switching much earlier (at 1k, not 100k) — for tight fixed-
// width spots like the sticky resource strip, where "23,417" doesn't fit but "23.4k" does.
function formatCompact(n) {
  const floored = Math.floor(n);
  if (floored < 1000) return floored.toString();
  if (floored < 1_000_000) return (floored / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return (floored / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
}

function worshipperCost(count) {
  return Math.ceil(TUNING.worshipper.base * Math.pow(TUNING.worshipper.growth, count));
}

// From the Silver Age onward: recruiting a Worshipper also costs Grain, everywhere, since
// Zeus introduced the seasons and farming now matters even for altars that aren't Demeter's.
// This does NOT lift at the next Ascension — the demand is permanent for the rest of the
// life, and only a Reborn should ever clear it. (Ages accumulate demands; they don't swap.)
function grainCost(count) {
  return Math.ceil(TUNING.grain.base * Math.pow(TUNING.grain.growth, count));
}

function agoraUpgradeCost(level) {
  return Math.ceil(TUNING.agora.base * Math.pow(TUNING.agora.growth, level));
}

function farmUpgradeCost(level) {
  return Math.ceil(TUNING.farm.base * Math.pow(TUNING.farm.growth, level));
}

const SILVER_COIN_RATE = TUNING.agora.coinRate;

// Silver Coin rate — was growing too fast because it multiplied by BOTH total worshippers
// AND Agora level, and both climb quickly once worshippers got cheaper. sqrt(level) keeps
// leveling the Agora meaningful without letting it compound linearly forever.
function silverCoinRate(totalWorshippers, agoraLevel, multiplier) {
  return totalWorshippers * Math.sqrt(agoraLevel) * SILVER_COIN_RATE * multiplier;
}
const FARM_GRAIN_RATE = TUNING.farm.grainRate;

// Farm production now scales with total worshippers across ALL altars, not just its own
// level — same shape as silverCoinRate above, same sqrt-dampening on level.
function farmRate(totalWorshippers, farmLevel, multiplier, boosted) {
  const boost = boosted ? 1 + TUNING.farm.harvestBoostMult : 1;
  return totalWorshippers * Math.sqrt(farmLevel) * FARM_GRAIN_RATE * multiplier * boost;
}

function farmOverflowCap(farmLevel) {
  return Math.ceil(TUNING.farm.overflowCapBase * (1 + farmLevel * TUNING.farm.overflowCapPerLevel));
}

// Worshippers needed (total, across every altar) to take the Farm to its next level —
// grows each level, same shape as the Kleos cost curve.
//
// Building the first Agros costs no worshippers at all. The requirement exists to stop the
// Farm's level running ahead of the population it draws from, and at level 0 there's no
// such thing to prevent — it only made the building sit visible and useless until the
// threshold was met, right when Grain was starting to gate worshippers.
function farmFollowerReq(farmLevel) {
  if (farmLevel === 0) return 0;
  return Math.ceil(TUNING.farm.followerReqBase * Math.pow(TUNING.farm.followerReqGrowth, farmLevel - 1));
}
const SILVER_TO_KLEOS_RATE = TUNING.silverToKleos;

function priestCost(count) {
  return Math.ceil(TUNING.priest.base * Math.pow(TUNING.priest.growth, count));
}

function hiereusCost(count) {
  return Math.ceil(TUNING.hiereus.base * Math.pow(TUNING.hiereus.growth, count));
}

// Historically a Zakoros was ordinary temple labor — plenty of them made sense as a
// congregation grew. A Hiereus was rare, prestigious clergy — real temples had very few,
// scaling with the temple's own grandeur (Stage), not with crowd size.
function hiereusSlots(level) {
  if (level >= 9) return 3; // Sanctuary
  if (level >= 6) return 2; // Grand Temple
  if (level >= 3) return 1; // Temple
  return 0;
}

// The altar's own Oracle (distinct from the future Heroic Age Oracles feature) — at most
// one, only once the altar reaches Sanctuary, like the rare, singular oracles of antiquity
// (Delphi being the archetype). Costs a large one-time offering of the altar's own resource.
// Fixed price per position in the chain (like kleosCost), not derived from resourceRate —
// gives clean, deliberate control instead of resourceRate doing double duty as a "how late/
// expensive" proxy for yet another cost.
// Flat, same for every god — Oracle is "staff" like Worshippers/Zakoros/Hiereus, none of
// which scale with position in the chain either. Still paid in that altar's own resource,
// not Kleos — the one thing that keeps Oracle tied to that altar's own abundance.
function oracleAltarCost(god) {
  return TUNING.oracle.flatCost;
}

// The Pantheon — the capstone. Not an altar and not one of the age buildings: it only
// becomes possible once every god already has a proper Temple, and it costs a tribute from
// all thirteen at once. It gates Ascension, and like every other mortal work it falls when
// the age turns. (Later, once Reborn and Mnemosyne's Archive exist, Pantheon levels are
// what generate Memories — hence a level rather than a plain built/not-built flag.)
const PANTHEON_MIN_STAGE = TUNING.pantheon.minStage; // every altar must reach Sanctuary

function pantheonCost(god) {
  return Math.ceil(god.resourceRate * TUNING.pantheon.costPerRate);
}

function pandoraCost(god) {
  return Math.ceil(god.resourceRate * TUNING.pandora.costPerRate);
}

// Each built altar's own contribution to the Kleos rate — its base, scaled by its own
// level, boosted by a small % per Worshipper it has. This is deliberately the mirror of
// godRate's resource formula below; the two are meant to read as the same shape applied to
// two different economies.
function altarKleosRate(stats) {
  const s = stats || { level: 0, worshippers: 0, hiereus: 0 };
  const k = TUNING.kleos;
  const base = k.perAltar * (1 + k.altarLevelFactor * s.level);
  return base * (1 + (s.worshippers || 0) * k.perWorshipperPct + (s.hiereus || 0) * k.perHiereusPct);
}

function kleosRate(built, godStats, multiplier, excludeIds) {
  if (built.length === 0) return 0; // baseline only starts once the first altar exists
  const k = TUNING.kleos;
  const altarSum = built.reduce((sum, id) => (excludeIds && excludeIds.has(id) ? sum : sum + altarKleosRate(godStats[id])), 0);
  return (k.baseline + altarSum) * multiplier;
}

function upgradeCost(god, level) {
  // Steeper than before: the old curve let a whole early stockpile buy 7 levels on a single
  // altar before a second or third one was even built. Higher base + steeper growth means
  // heavy investment in one altar early on costs real, sustained accumulation.
  // base is NOT rounded here — rounding a small intermediate value (post the ×0.15 rescale)
  // collapsed several adjacent gods onto the same integer base (e.g. Poseidon/Hera/Zeus/
  // Athena all landed on 3), making their upgrade costs identical. Only the final cost
  // rounds, so every god's own req.amount stays distinct all the way through.
  const u = TUNING.upgrade;
  const base = god.req ? god.req.amount * u.baseFromReqFactor : u.hestiaBase;
  return Math.ceil(base * Math.pow(u.growth, level));
}

function godRate(god, stats, multiplier) {
  const s = stats || { level: 0, worshippers: 0, priests: 0, hiereus: 0, milestoneBonus: 0 };
  const r = TUNING.godRate;
  const base = god.resourceRate * (1 + r.perLevel * s.level);
  const boost = 1 + (s.worshippers || 0) * r.perWorshipperPct + (s.priests || 0) * r.perZakorosPct;
  return base * boost * (1 + (s.milestoneBonus || 0)) * multiplier;
}

function nextMilestone(worshippers) {
  return MILESTONES.find((m) => m.count > worshippers) || null;
}

// One Zakoros slot per 5 worshippers — ordinary temple labor, plenty of it as the
// congregation grows (unlike Hiereus, whose slots come from the altar's Stage instead).
function zakorosSlots(worshippers) {
  return Math.min(Math.floor((worshippers || 0) / TUNING.zakorosPerWorshippers), TUNING.zakorosCap);
}

// How many Zakoros an altar needs on-site to take its *next* level. Flat 1 within a stage —
// crossing into the next stage (Temple/Grand Temple/Sanctuary) wants one more pair of hands
// than the last, mirroring hiereusSlots' own stepped-by-stage shape.
function zakorosNeededForLevel(level) {
  const crossingStage = STAGES.find((s) => s.level === level + 1);
  // STAGES[0] is "Altar" (level 0), so Temple/Grand Temple/Sanctuary already sit at
  // indices 1/2/3 — no +1 needed here, that was the off-by-one that made Sanctuary
  // demand 4 Zakoros instead of the intended 3.
  return crossingStage ? STAGES.indexOf(crossingStage) : 1;
}

// worshipperCostFor/grainCostFor used to apply an Oracle discount here. Removed — Oracle's
// identity moved to the periodic blessing (see ORACLE tick below) once "matured" made
// recruitment itself less central. Kept as named wrappers rather than inlining
// worshipperCost/grainCost at every call site, in case a future discount source appears.
function worshipperCostFor(stats) {
  return worshipperCost(stats.worshippers);
}
function grainCostFor(stats) {
  return grainCost(stats.worshippers);
}

const SAVE_KEY = "olympus-rising-save-v1";

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

const initialSave = loadSave();

function OlympusChronicle() {
  const [kleos, setKleos] = useState(initialSave?.kleos ?? 0);
  const [resources, setResources] = useState(initialSave?.resources ?? {});
  const [built, setBuilt] = useState(initialSave?.built ?? []);
  const [godStats, setGodStats] = useState(initialSave?.godStats ?? {});
  const [ageIndex, setAgeIndex] = useState(initialSave?.ageIndex ?? 0);
  const [starlight, setStarlight] = useState(initialSave?.starlight ?? 0);
  const [chronicle, setChronicle] = useState(
    initialSave?.chronicle ?? [{ id: "prologue", chapter: null, text: PROLOGUE }]
  );
  const [notification, setNotification] = useState(null); // Oracle visions only — corner-placed
  const [banners, setBanners] = useState([]);             // newest first, max 3
  const bannerSeq = useRef(0);
  const bannerTimers = useRef({});
  const [activeTab, setActiveTab] = useState("build");
  const [selectedGodId, setSelectedGodId] = useState(null);
  const [expandedBuilding, setExpandedBuilding] = useState(null);
  const [resourcesExpanded, setResourcesExpanded] = useState(false);
  const [stickyExpanded, setStickyExpanded] = useState(false);
  const [showIntro, setShowIntro] = useState(true);
  const [silverExchangeTarget, setSilverExchangeTarget] = useState(null);
  const rowRefs = useRef({});
  const oracleTimers = useRef({}); // { [godId]: nextBlessingTimestampMs }

  useEffect(() => {
    if (selectedGodId && rowRefs.current[selectedGodId]) {
      rowRefs.current[selectedGodId].scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, [selectedGodId]);

  useEffect(() => {
    if (expandedBuilding && rowRefs.current[expandedBuilding]) {
      rowRefs.current[expandedBuilding].scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, [expandedBuilding]);
  const [hasOffered, setHasOffered] = useState(initialSave?.hasOffered ?? false);
  const [horme, setHorme] = useState(initialSave?.horme ?? 0);
  const [agoraLevel, setAgoraLevel] = useState(initialSave?.agoraLevel ?? 0);
  const [farmLevel, setFarmLevel] = useState(initialSave?.farmLevel ?? 0);
  const [silverCoins, setSilverCoins] = useState(initialSave?.silverCoins ?? 0);
  const [pantheonLevel, setPantheonLevel] = useState(initialSave?.pantheonLevel ?? 0);
  const [pantheonDonations, setPantheonDonations] = useState(initialSave?.pantheonDonations ?? {});
  // Golden Age ending. Both flags are permanent — Golden Age is only ever visited once
  // (ageIndex never returns to 0), so unlike Pantheon these never need resetting.
  const [prometheusFireStolen, setPrometheusFireStolen] = useState(initialSave?.prometheusFireStolen ?? false);
  const [pandoraCreated, setPandoraCreated] = useState(initialSave?.pandoraCreated ?? false);
  const [pandoraDonations, setPandoraDonations] = useState(initialSave?.pandoraDonations ?? {});
  const [chronicleView, setChronicleView] = useState("chronicle"); // "chronicle" | "rites"
  const [neglectedGods, setNeglectedGods] = useState(initialSave?.neglectedGods ?? {});
  // A god can only be neglected after it has once stood above the threshold — you can't
  // resent never having been given anything, only having been given something and then
  // forgotten. This replaces the old timed grace period on freshly-built altars.
  const [tendedGods, setTendedGods] = useState(initialSave?.tendedGods ?? {});
  // Chronicle gets the *first* time each god turns resentful and nothing after — the state
  // flips often enough that logging every swing would drown the Chronicle (and the recap
  // screen, which shows the most recent entry).
  const [wrathChronicled, setWrathChronicled] = useState(initialSave?.wrathChronicled ?? {});
  const [lastSeenChronicleCount, setLastSeenChronicleCount] = useState(initialSave?.lastSeenChronicleCount ?? initialSave?.chronicle?.length ?? 1);
  const [pandoraRevealStep, setPandoraRevealStep] = useState(null); // null = not revealing; 0-4 = sequence index
  const pandoraTimers = useRef([]);
  // Festival — offeringBonus is mortal like everything else (resets on Ascend/Erase), unlike
  // Starlight/Prometheus. It's the current life's altars getting stronger, not the pantheon.
  const [offeringBonus, setOfferingBonus] = useState(initialSave?.offeringBonus ?? 0);
  const festivalCooldownUntil = useRef({}); // { [godId]: timestampMs }
  const festivalPauseUntil = useRef({}); // { [godId]: timestampMs } — that altar's production is paused until this time
  const harvestWindowNext = useRef(0); // timestamp the next Harvest window opens
  const harvestWindowUntil = useRef(0); // timestamp the current open window closes (0 = not open)
  const harvestBoostUntil = useRef(0); // timestamp the active Farm production boost expires
  const [offerPops, setOfferPops] = useState([]);
  const [offerFlash, setOfferFlash] = useState(false);
  const [showFlowHint, setShowFlowHint] = useState(false);
  const popIdRef = useRef(0);
  const notifTimeout = useRef(null);
  const flashTimeout = useRef(null);
  const hintTimeout = useRef(null);

  // Autosave to localStorage whenever meaningful game state changes
  useEffect(() => {
    const save = { kleos, resources, built, godStats, ageIndex, starlight, chronicle, hasOffered, agoraLevel, farmLevel, silverCoins, horme, pantheonLevel, pantheonDonations, prometheusFireStolen, pandoraCreated, pandoraDonations, offeringBonus, lastSeenChronicleCount, neglectedGods, tendedGods, wrathChronicled };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (e) {
      // storage full or unavailable — fail silently, game still works this session
    }
  }, [kleos, resources, built, godStats, ageIndex, starlight, chronicle, hasOffered, agoraLevel, farmLevel, silverCoins, horme, pantheonLevel, pantheonDonations, prometheusFireStolen, pandoraCreated, pandoraDonations, offeringBonus, lastSeenChronicleCount, neglectedGods, tendedGods, wrathChronicled]);

  function resetProgress() {
    if (!window.confirm("Start over? This clears all progress on this device.")) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    setKleos(0);
    setResources({});
    setBuilt([]);
    setGodStats({});
    setAgeIndex(0);
    setStarlight(0);
    setChronicle([{ id: "prologue", chapter: null, text: PROLOGUE }]);
    setHasOffered(false);
    setAgoraLevel(0);
    setFarmLevel(0);
    setSilverCoins(0);
    setHorme(0);
    setPantheonLevel(0);
    setPantheonDonations({});
    setNeglectedGods({});
    setTendedGods({});
    setWrathChronicled({});
    setOfferingBonus(0);
    setPrometheusFireStolen(false);
    setPandoraCreated(false);
    setPandoraDonations({});
    setPandoraRevealStep(null);
    setSelectedGodId(null);
  }

  const multiplier = 1 + starlight * TUNING.starlightPerAge + (prometheusFireStolen ? TUNING.prometheus.fireBoostPct : 0);
  // A small, global penalty while any altar sits neglected — see the tick effect below for
  // how neglect itself is detected. Kept as its own multiplier (not folded into `multiplier`
  // itself) so it only touches Kleos, never resource production.
  // A resentful god's altar falls silent — it's excluded from the Kleos sum entirely
  // rather than scaled by some percentage, so the loss reads as a line gone from the rate
  // instead of a number to decode. The penalty is local: the other twelve gods did nothing.
  const kleosMultiplier = multiplier;
  const silentIds = React.useMemo(() => new Set(Object.keys(neglectedGods)), [neglectedGods]);
  const allBuilt = built.length === GODS.length;
  const templeCount = GODS.filter((g) => built.includes(g.id) && ((godStats[g.id] || {}).level || 0) >= PANTHEON_MIN_STAGE).length;
  const pantheonReady = templeCount === GODS.length;
  useEffect(() => {
    const t = setInterval(() => {
      // The game does not progress while the tab/app is backgrounded — no catch-up, no
      // offline accumulation. Ticks are simply skipped until it's visible again.
      if (document.hidden) return;

      const now0 = Date.now();
      const pausedIds = new Set(
        built.filter((id) => festivalPauseUntil.current[id] && now0 < festivalPauseUntil.current[id])
      );
      // Kleos-only exclusion set: festival-paused altars plus resentful ones, which fall
      // silent entirely. Kept separate from pausedIds because the resource loop treats
      // pausedIds as a full stop, and resentment only withholds a fifth of the tribute.
      const noKleosIds = new Set([...pausedIds, ...Object.keys(neglectedGods)]);

      if (hasOffered) {
        setKleos((k) => k + kleosRate(built, godStats, kleosMultiplier, noKleosIds));
      }
      setResources((r) => {
        const next = { ...r };
        built.forEach((id) => {
          if (pausedIds.has(id)) return; // this altar's production is paused for a festival
          const g = GODS_BY_ID[id];
          // A resentful god holds back part of its own tribute — kept mild (−20%) because
          // this is the very resource upgrades are paid in, and a harsh cut here would make
          // the punishment prolong its own cure.
          const withheld = neglectedGods[id] ? (1 - TUNING.neglect.resourcePenalty) : 1;
          next[id] = (next[id] || 0) + godRate(g, godStats[id], multiplier) * withheld;
        });
        return next;
      });

      // Oracle's periodic blessing — each consulted altar gets its own randomized timer.
      // Fires roughly every 3-5 minutes, giving either Kleos or that altar's own resource.
      built.forEach((id) => {
        const stats = godStats[id];
        if (!stats || (stats.oracle || 0) < 1) return;
        // A resentful god withdraws its visions. Otherwise the Oracle would quietly heal
        // the neglect it was meant to be punished for, and losing that income while
        // resentful is itself part of the penalty.
        if (neglectedGods[id]) return;
        const now = Date.now();
        const o = TUNING.oracle;
        if (!oracleTimers.current[id]) {
          oracleTimers.current[id] = now + o.intervalMinMs + Math.random() * (o.intervalMaxMs - o.intervalMinMs);
          return;
        }
        if (now >= oracleTimers.current[id]) {
          oracleTimers.current[id] = now + o.intervalMinMs + Math.random() * (o.intervalMaxMs - o.intervalMinMs);
          const g = GODS_BY_ID[id];
          const roll = Math.random();
          if (roll < 0.35) {
            const reward = Math.max(1, Math.ceil(altarKleosRate(stats) * multiplier * o.rewardSeconds));
            fireNotification(
              ``, PALETTE.oracle.hex,
              `A favorable omen.\n+${formatNum(reward)} Kleos`,
              { type: "kleos", amount: reward }, true
            );
          } else if (roll < 0.70) {
            const reward = Math.ceil(godRate(g, stats, multiplier) * o.rewardSeconds);
            fireNotification(
              ``, PALETTE.oracle.hex,
              `A fortunate season.\n+${formatNum(reward)} ${g.resourceName}`,
              { type: "resource", godId: id, amount: reward }, true
            );
          } else if (roll < 0.85) {
            const reward = 2 + Math.floor(Math.random() * 3);
            fireNotification(
              ``, PALETTE.oracle.hex,
              `A path opens.\n+${reward} Hormē`,
              { type: "horme", amount: reward }, true
            );
          } else {
            fireNotification(
              ``, PALETTE.oracle.hex,
              `The vapors rise — and settle again, saying nothing.`,
              null, true
            );
          }
        }
      });

      // A matured altar (full staff, full clergy, Oracle consulted, Level 10) sustains
      // itself — worshippers now come on their own, slowly, without being recruited.
      setGodStats((s) => {
        let changed = false;
        const next = { ...s };
        built.forEach((id) => {
          const stats = s[id];
          if (stats && (stats.achievementsReached || []).includes("matured")) {
            changed = true;
            next[id] = { ...stats, worshippers: (stats.worshippers || 0) + TUNING.maturedAutoWorshipperRate };
          }
        });
        return changed ? next : s;
      });

      // Silver Age buildings — available from the Silver Age onward, but rebuilt each age
      if (ageIndex >= 1) {
        if (agoraLevel > 0) {
          const totalWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
          setSilverCoins((sc) => sc + silverCoinRate(totalWorshippers, agoraLevel, multiplier));
        }
        if (farmLevel > 0 && built.includes("demeter")) {
          const now2 = Date.now();
          if (!harvestWindowNext.current) {
            harvestWindowNext.current = now2 + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
          } else if (harvestWindowUntil.current === 0 && now2 >= harvestWindowNext.current) {
            harvestWindowUntil.current = now2 + TUNING.farm.harvestOpenMs;
          } else if (harvestWindowUntil.current > 0 && now2 > harvestWindowUntil.current) {
            harvestWindowUntil.current = 0;
            harvestWindowNext.current = now2 + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
          }
          const boosted = now2 < harvestBoostUntil.current;
          const totalWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
          const produced = farmRate(totalWorshippers, farmLevel, multiplier, boosted);
          setResources((r) => ({ ...r, demeter: (r.demeter || 0) + produced }));
        }
      }
    }, 1000);
    return () => clearInterval(t);
  }, [built, multiplier, godStats, hasOffered, ageIndex, agoraLevel, farmLevel, neglectedGods]);

  // Any banner timers still pending when the view goes away would fire against unmounted
  // state, so they're cleared on teardown.
  useEffect(() => () => {
    Object.values(bannerTimers.current).forEach((ts) => ts.forEach(clearTimeout));
    bannerTimers.current = {};
  }, []);

  const scheduleNotifDismiss = useCallback((durationMs) => {
    if (notifTimeout.current) clearTimeout(notifTimeout.current);
    notifTimeout.current = setTimeout(() => {
      setNotification((n) => (n ? { ...n, fading: true } : n));
      notifTimeout.current = setTimeout(() => setNotification(null), 700);
    }, durationMs);
  }, []);

  const BANNER_MAX = 3;
  const BANNER_LIFE_MS = 6500;

  // Banners no longer overwrite one another: a new one takes the top slot and pushes the
  // previous ones down, dimming as they go. Each keeps its own lifetime from the moment it
  // appeared, so they expire one at a time rather than all at once.
  const pushBanner = useCallback((text, color, chronicleLink) => {
    const id = ++bannerSeq.current;
    setBanners((prev) => {
      const next = [{ id, text, color: color || "#E8DCC8", chronicleLink: !!chronicleLink, fading: false }, ...prev];
      // Anything pushed past the third slot is dropped immediately — and its pending
      // timers with it, so they can't fire against an entry that no longer exists.
      next.slice(BANNER_MAX).forEach((b) => {
        if (bannerTimers.current[b.id]) {
          bannerTimers.current[b.id].forEach(clearTimeout);
          delete bannerTimers.current[b.id];
        }
      });
      return next.slice(0, BANNER_MAX);
    });
    const fadeAt = setTimeout(() => {
      setBanners((prev) => prev.map((b) => (b.id === id ? { ...b, fading: true } : b)));
      const gone = setTimeout(() => {
        setBanners((prev) => prev.filter((b) => b.id !== id));
        delete bannerTimers.current[id];
      }, 700);
      bannerTimers.current[id] = [...(bannerTimers.current[id] || []), gone];
    }, BANNER_LIFE_MS);
    bannerTimers.current[id] = [fadeAt];
  }, []);

  const fireNotification = useCallback((text, color, revealText, pendingReward, vision, chronicleLink) => {
    if (!vision) { pushBanner(text, color, chronicleLink); return; }
    setNotification((prev) => {
      // Don't let a second Oracle vision interrupt one already on screen — that's what
      // made it look like the popup was suddenly jumping to a new corner. Just skip this
      // one; the altar's own timer will try again next cycle.
      if (vision && prev && prev.corner) return prev;
      const corner = vision
        ? {
            v: Math.random() < 0.5 ? "top" : "bottom",
            h: Math.random() < 0.5 ? "left" : "right",
            jx: Math.round(Math.random() * 24),
            jy: Math.round(Math.random() * 24),
          }
        : null;
      return { text, color: color || "#E8DCC8", revealText: revealText || null, pendingReward: pendingReward || null, corner, fading: false, chronicleLink: !!chronicleLink };
    });
    scheduleNotifDismiss(pendingReward ? 9500 : 6500);
  }, [scheduleNotifDismiss, pushBanner]);

  const revealNotification = useCallback(() => {
    setNotification((n) => {
      if (!n || !n.revealText) return n;
      let ringColor = "#B79FD6"; // dim violet — the "nothing" outcome
      let floatText = "nothing";
      if (n.pendingReward) {
        const pr = n.pendingReward;
        if (pr.type === "kleos") {
          setKleos((k) => k + pr.amount);
          ringColor = "#6FA8C9"; floatText = `+${formatNum(pr.amount)} Kleos`;
        } else if (pr.type === "horme") {
          setHorme((h) => h + pr.amount);
          ringColor = PALETTE.horme.hex; floatText = `+${formatNum(pr.amount)} Hormē`;
        } else {
          setResources((r) => ({ ...r, [pr.godId]: (r[pr.godId] || 0) + pr.amount }));
          ringColor = "#D4A876"; floatText = `+${formatNum(pr.amount)} ${GODS_BY_ID[pr.godId].resourceName}`;
        }
      }
      return { text: "", color: n.color, revealText: null, pendingReward: null, corner: n.corner, fading: false, chronicleLink: false, ringColor, ringKey: Date.now(), floatText, claimed: true };
    });
    // Just long enough for the ring and the rising number to finish, then it's gone.
    scheduleNotifDismiss(950);
  }, [scheduleNotifDismiss]);

  function hasEnoughHorme(god) {
    const idx = GODS.findIndex((x) => x.id === god.id);
    return horme >= hormeThreshold(idx);
  }

  function canAffordGod(god) {
    if (kleos < god.kleosCost) return false;
    if (!hasEnoughHorme(god)) return false;
    const reqs = buildRequirements(god);
    for (const r of reqs) {
      if ((resources[r.id] || 0) < r.amount) return false;
    }
    return true;
  }

  function buildAltar(god) {
    if (built.includes(god.id)) return;
    if (!canAffordGod(god)) return;
    if (built.length === 0) {
      setShowFlowHint(true);
      if (hintTimeout.current) clearTimeout(hintTimeout.current);
      hintTimeout.current = setTimeout(() => setShowFlowHint(false), 10000);
    }
    setKleos((k) => k - god.kleosCost);
    const reqs = buildRequirements(god);
    if (reqs.length > 0) {
      setResources((r) => {
        const next = { ...r };
        reqs.forEach((req) => {
          next[req.id] = (next[req.id] || 0) - req.amount;
        });
        return next;
      });
    }
    setBuilt((b) => [...b, god.id]);
    setResources((r) => ({ ...r, [god.id]: r[god.id] || 0 }));
    setGodStats((s) => ({ ...s, [god.id]: { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 } }));
    setChronicle((c) => [...c, { id: god.id, chapter: null, text: god.story, title: `${god.name}'s altar was raised.` }]);
    fireNotification(`${god.name}'s altar rises — ${god.resourceName} now flows`, "#D4A876", null, null, false, true);
  }

  function offer() {
    setKleos((k) => k + (1 + offeringBonus) * multiplier);
    if (!hasOffered) {
      setHasOffered(true);
    }
    const id = popIdRef.current++;
    const x = Math.random() * 60 - 30;
    setOfferPops((p) => [...p, { id, x }]);
    setTimeout(() => {
      setOfferPops((p) => p.filter((pop) => pop.id !== id));
    }, 850);

    setOfferFlash(true);
    if (flashTimeout.current) clearTimeout(flashTimeout.current);
    flashTimeout.current = setTimeout(() => setOfferFlash(false), 280);
  }

  function recruitPriest(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (zakorosSlots(stats.worshippers) === 0) return;
    if ((stats.priests || 0) >= zakorosSlots(stats.worshippers)) return;
    const cost = priestCost(stats.priests || 0);
    if (kleos < cost) return;
    setKleos((k) => k - cost);
    const nextStats = { ...stats, priests: (stats.priests || 0) + 1 };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification);
    appeaseGod(god.id);
  }

  function recruitHiereus(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level < HIEREUS_MIN_LEVEL) return;
    if ((stats.hiereus || 0) >= hiereusSlots(stats.level)) return;
    const cost = hiereusCost(stats.hiereus || 0);
    if (kleos < cost) return;
    setKleos((k) => k - cost);
    const nextStats = { ...stats, hiereus: (stats.hiereus || 0) + 1 };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification);
    appeaseGod(god.id);
  }

  function recruitOracleAltar(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level < 10 || (stats.oracle || 0) >= 1) return;
    const cost = oracleAltarCost(god);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    setHorme((h) => h + TUNING.horme.perOffering);
    const nextStats = { ...stats, oracle: 1 };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification);
    appeaseGod(god.id);
  }

  function upgradeAgora() {
    const cost = agoraUpgradeCost(agoraLevel);
    if (kleos < cost) return;
    setKleos((k) => k - cost);
    setAgoraLevel((l) => l + 1);
  }

  function upgradeFarm() {
    const cost = farmUpgradeCost(farmLevel);
    const totalWorshippers = built.reduce((sum, id) => sum + ((godStats[id] && godStats[id].worshippers) || 0), 0);
    if (kleos < cost || totalWorshippers < farmFollowerReq(farmLevel)) return;
    setKleos((k) => k - cost);
    setFarmLevel((l) => l + 1);
  }

  function harvestNow() {
    const now = Date.now();
    if (harvestWindowUntil.current === 0 || now > harvestWindowUntil.current) return; // window not open
    harvestBoostUntil.current = now + TUNING.farm.harvestBoostMs;
    harvestWindowUntil.current = 0;
    harvestWindowNext.current = now + TUNING.farm.harvestWindowMinMs + Math.random() * (TUNING.farm.harvestWindowMaxMs - TUNING.farm.harvestWindowMinMs);
    fireNotification(`The harvest is good. Farm output +${Math.round(TUNING.farm.harvestBoostMult * 100)}% for a while.`, "#8FAE7A");
  }

  function exchangeSilver(amount) {
    const amt = Math.min(amount, Math.floor(silverCoins));
    if (amt <= 0) return;
    setSilverCoins((sc) => sc - amt);
    setKleos((k) => k + amt * SILVER_TO_KLEOS_RATE);
  }

  function exchangeSilverForResource(amount, godId) {
    const god = GODS_BY_ID[godId];
    if (!god) return;
    const amt = Math.min(amount, Math.floor(silverCoins));
    const units = Math.floor((amt * TUNING.silverToResourceFactor) / god.resourceRate);
    if (units <= 0) return;
    setSilverCoins((sc) => sc - amt);
    setResources((r) => ({ ...r, [godId]: (r[godId] || 0) + units }));
  }

  function recruitWorshipper(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    const cost = worshipperCostFor(stats);
    if (kleos < cost) return;
    const needsGrain = ageIndex >= 1 && built.includes("demeter"); // Silver Age onward, and only once Demeter exists (avoids a bootstrap deadlock)
    const gCost = needsGrain ? grainCostFor(stats) : 0;
    if (needsGrain && (resources.demeter || 0) < gCost) return;
    setKleos((k) => k - cost);
    if (needsGrain) {
      setResources((r) => ({ ...r, demeter: (r.demeter || 0) - gCost }));
    }
    const newCount = stats.worshippers + 1;
    const milestone = MILESTONES.find((m) => m.count === newCount);
    if (milestone) {
      const reward = Math.ceil(god.resourceRate * TUNING.offering.rewardPerRate);
      const tier = MILESTONES.indexOf(milestone) + 1;
      setResources((r) => ({ ...r, [god.id]: (r[god.id] || 0) + reward }));
      setHorme((h) => h + tier);
      setGodStats((s) => ({
        ...s,
        [god.id]: {
          ...stats,
          worshippers: newCount,
          milestonesReached: [...(stats.milestonesReached || []), milestone.count],
          milestoneBonus: (stats.milestoneBonus || 0) + milestone.bonus,
        },
      }));
      const title = milestone.title || god.cultTitle;
      const text = milestone.text ? milestone.text(god.name) : god.cultText(god.name);
      const chronicleTitle =
        milestone.count === 10 ? `${god.name}'s altar drew its first followers.`
        : milestone.count === 25 ? `${god.name}'s cult began to form.`
        : `${god.name}'s followers became ${god.cultTitle}.`;
      setChronicle((c) => [...c, { id: `${god.id}-milestone-${milestone.count}`, chapter: null, text, title: chronicleTitle }]);
      fireNotification(`${title}: ${god.name}\n+${formatNum(reward)} ${god.resourceName}, +${tier} Hormē`, "#6FA8C9", null, null, false, true);
    } else {
      setGodStats((s) => ({ ...s, [god.id]: { ...stats, worshippers: newCount } }));
    }
    appeaseGod(god.id);
  }

  // Neglect is checked only when you raise an altar — never on a timer. The trigger isn't
  // "this altar is low", it's "you lifted another one and left this one standing". So
  // sitting still never produces a reproach, and keeping the pantheon roughly level never
  // produces one either.
  //
  // Threshold is the harsher of avg/2 and avg−3: avg/2 does the work early, while avg−3
  // takes over late, when every altar clusters near the level 10 ceiling and half the
  // average would let a level 5 altar sit unnoticed among tens.
  //
  // A god must have stood above the threshold at least once (`tendedGods`) before it can
  // resent falling below it — you can't be reproached for an altar you haven't reached yet.
  function checkForNeglect(statsOverride) {
    const stats = statsOverride || godStats;
    const N = TUNING.neglect;
    if (built.length < N.minAltars) return;
    const avgLevel = built.reduce((sum, id) => sum + (stats[id]?.level || 0), 0) / built.length;
    if (avgLevel < N.minAvgLevel) return;
    const threshold = Math.max(avgLevel * N.lagFactor, avgLevel - N.lagFlat);

    built.forEach((id) => {
      const level = stats[id]?.level || 0;
      if (level >= threshold) {
        // At or above the line: eligible from now on, and never resentful right now.
        if (!tendedGods[id]) setTendedGods((t) => ({ ...t, [id]: true }));
        return;
      }
      if (!tendedGods[id] || neglectedGods[id]) return; // not eligible, or already resentful
      const g = GODS_BY_ID[id];
      setNeglectedGods((n) => ({ ...n, [id]: true }));
      // Said once per fall, never repeated — the red altar row carries the state from here,
      // so you're interrupted once and can see where you stand for as long as it lasts.
      const firstTime = !wrathChronicled[id];
      if (firstTime) {
        setWrathChronicled((w) => ({ ...w, [id]: true }));
        setChronicle((c) => [...c, {
          id: `${id}-neglected-${Date.now()}`, chapter: null,
          title: `${g.name} grew resentful, neglected while others rose.`,
          text: `${g.name}'s altar falls further behind the rest each day — barely tended, while other altars rise around it. The god notices. Every offering made elsewhere is, in some small way, an offering not made here.`,
        }]);
      }
      fireNotification(`${g.name} grows resentful — neglected.`, "#C98A7A", null, null, false, firstTime);
    });
  }

  // Any attention paid to the altar settles the god. It doesn't have to be an upgrade —
  // upgrades are paid in the god's own resource, which resentment has already reduced, so
  // requiring one would make the punishment prolong its own cure. A worshipper costs Kleos
  // and is always available.
  function appeaseGod(godId) {
    if (!neglectedGods[godId]) return;
    setNeglectedGods((n) => { const next = { ...n }; delete next[godId]; return next; });
    fireNotification(`${GODS_BY_ID[godId].name} is appeased.`, "#8FAE7A", null, null, false, false);
  }

  function upgradeAltar(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if (stats.level >= 10) return; // Level 10 is the final stage — no further building
    // Crossing into a new stage needs more hands on site than staying within one — Temple
    // wants a second Zakoros, Grand Temple a third. The requirement bites only at the
    // crossing itself (2→3, 5→6, 8→9); levels within a stage still only need the flat 1 above.
    if ((stats.priests || 0) < zakorosNeededForLevel(stats.level)) return;
    const cost = upgradeCost(god, stats.level);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    const newLevel = stats.level + 1;
    const nextStats = { ...stats, level: newLevel };
    setGodStats((s) => ({ ...s, [god.id]: nextStats }));
    const stage = STAGES.find((s) => s.level === newLevel);
    if (stage) {
      const tier = STAGES.indexOf(stage);
      setHorme((h) => h + tier);
      const prevStageName = STAGES[tier - 1].name;
      const crossingTitle = tier === 1
        ? `${god.name}'s altar became a ${stage.name}.`
        : `${god.name}'s ${prevStageName} became a ${stage.name}.`;
      setChronicle((c) => [...c, { id: `${god.id}-stage-${stage.level}`, chapter: null, text: stage.text(god.name), title: crossingTitle }]);
      fireNotification(`${god.name}'s altar becomes a ${stage.name}\n+${tier} Hormē`, PALETTE.stage.hex, null, null, false, true);
    }
    checkAltarAchievements(god, nextStats, setGodStats, setHorme, setChronicle, fireNotification);
    appeaseGod(god.id);
    // Raising this altar is exactly the moment the others can fall behind, so the check
    // runs against the new levels, not the stale ones.
    checkForNeglect({ ...godStats, [god.id]: nextStats });
  }

  function festivalCost(god, held) {
    const f = TUNING.festival;
    return {
      kleos: Math.ceil(f.kleosBase * Math.pow(f.kleosGrowth, held)),
      resource: Math.ceil(f.resourceBase * Math.pow(f.resourceGrowth, held) * god.resourceRate),
    };
  }

  function holdFestival(god) {
    const stats = godStats[god.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 };
    if ((stats.hiereus || 0) < 1) return;
    const now = Date.now();
    if (festivalCooldownUntil.current[god.id] && now < festivalCooldownUntil.current[god.id]) return;
    const held = stats.festivalsHeld || 0;
    const cost = festivalCost(god, held);
    if (kleos < cost.kleos || (resources[god.id] || 0) < cost.resource) return;

    const followers = TUNING.festival.followerMin + Math.floor(Math.random() * (TUNING.festival.followerMax - TUNING.festival.followerMin + 1));
    setKleos((k) => k - cost.kleos);
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost.resource }));
    setGodStats((s) => ({
      ...s,
      [god.id]: { ...s[god.id], festivalsHeld: held + 1, worshippers: (s[god.id].worshippers || 0) + followers },
    }));
    setOfferingBonus((b) => b + TUNING.festival.offeringBoost);
    festivalCooldownUntil.current[god.id] = now + TUNING.festival.cooldownMs;
    festivalPauseUntil.current[god.id] = now + TUNING.festival.pauseMs;
    fireNotification(`A festival at ${god.name}'s altar.\n+${followers} worshippers, +${TUNING.festival.offeringBoost} Offering`, PALETTE.festival.hex);
    appeaseGod(god.id);
  }

  function stealFire() {
    if (ageIndex !== 0 || pantheonLevel < 1 || prometheusFireStolen) return;
    setPrometheusFireStolen(true);
    setChronicle((c) => [
      ...c,
      {
        id: "prometheus-theft",
        chapter: null,
        title: "Prometheus stole fire.",
        text: "The forge at Hephaestus's altar burns a little lower tonight, though no one can say why. Prometheus carries the coal down the mountain inside a fennel stalk, past every god who might have stopped him and didn't quite look up in time. Mortals will call it a gift. Zeus will call it a theft, because it is one.",
      },
      {
        id: "prometheus-punished",
        chapter: null,
        title: "Prometheus was bound to the mountain.",
        text: "Zeus's fury falls twofold — on the mortals who received the fire, and on the one who gave it. Prometheus is bound to a mountain far from this one. The eagle comes at dawn, every dawn, and what it takes is always back by morning. No altar is raised for this. No altar could hold it.",
      },
    ]);
    fireNotification(`Fire is stolen. +${Math.round(TUNING.prometheus.fireBoostPct * 100)}% production, permanently`, "#D4A876", null, null, false, true);
  }

  function donateToPandora(god) {
    if (ageIndex !== 0 || !prometheusFireStolen || pandoraCreated) return;
    if (pandoraDonations[god.id]) return;
    const cost = pandoraCost(god);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    setPandoraDonations((d) => ({ ...d, [god.id]: true }));
  }

  function createPandora() {
    if (ageIndex !== 0 || !prometheusFireStolen || pandoraCreated) return;
    if (!GODS.every((g) => pandoraDonations[g.id])) return;
    setPandoraCreated(true);
    setPandoraOpen(false);
    setPandoraRevealStep(0);
    pandoraTimers.current.forEach(clearTimeout);
    pandoraTimers.current = PANDORA_REVEAL_LINES.map((_, i) =>
      setTimeout(() => setPandoraRevealStep(i), i === 0 ? 0 : 2600 * i)
    );
    pandoraTimers.current.push(
      setTimeout(() => setPandoraRevealStep(null), 2600 * PANDORA_REVEAL_LINES.length + 3200)
    );
    setChronicle((c) => [
      ...c,
      {
        id: "pandora",
        chapter: null,
        title: "A Gift to Mankind",
        text: "Every god gave something — warmth, wisdom, cunning, grace, and things with no kind name. Hephaestus shaped her from clay; the rest is dressing. She was called a gift, and Zeus meant it exactly as unkindly as that sounds. When her pithos opened, every evil the world had been spared came out at once. Only Hope stayed inside, and no one has ever agreed on whether that was mercy.",
      },
    ]);
  }

  function donateToPantheon(god) {
    if (!pantheonReady || pantheonLevel > 0) return;
    if (pantheonDonations[god.id]) return;
    const cost = pantheonCost(god);
    if ((resources[god.id] || 0) < cost) return;
    setResources((r) => ({ ...r, [god.id]: r[god.id] - cost }));
    setPantheonDonations((d) => ({ ...d, [god.id]: true }));
  }

  function raisePantheon() {
    if (!pantheonReady || pantheonLevel > 0) return;
    if (!GODS.every((g) => pantheonDonations[g.id])) return;
    setPantheonLevel(1);
    setChronicle((c) => [
      ...c,
      {
        id: `pantheon-${ageIndex}`,
        chapter: null,
        title: "The Pantheon was raised.",
        text: "Thirteen temples stood already, each insisting on its own importance. What rises now is the first building that belongs to none of them — a hall for all the gods at once, paid for out of every treasury on the mountain. The accounts were settled in a single afternoon and disputed for considerably longer.",
      },
    ]);
    fireNotification("The Pantheon is raised", "#E8C88F", null, null, false, true);
  }

  function ascend() {
    if (!allBuilt || pantheonLevel < 1) return;
    if (ageIndex === 0 && !pandoraCreated) return; // Golden Age has its own ending, on top of Pantheon
    const nextAge = ageIndex + 1;
    const ageLabel = nextAge < AGE_NAMES.length ? AGE_NAMES[nextAge] : `Iron Age, Cycle ${nextAge - AGE_NAMES.length + 2}`;
    setStarlight((s) => s + 1);
    setKleos(0);
    setResources({});
    setBuilt([]);
    setGodStats({});
    setHorme(0);
    // The age ends for everything, not just the altars — Zeus wipes the slate clean.
    // Silver Coins are age-local currency like Kleos, and the Agora and the Farm are
    // mortal works: they fall with everything else. They stay *available* to rebuild
    // from the Silver Age onward (that gating is on ageIndex, not on level).
    setSilverCoins(0);
    setAgoraLevel(0);
    setFarmLevel(0);
    setPantheonLevel(0);
    setPantheonDonations({});
    setNeglectedGods({});
    setTendedGods({});
    // wrathChronicled deliberately survives Ascension — the Chronicle carries across ages,
    // so a god's first resentment shouldn't be written a second time in the next one.
    setOfferingBonus(0);
    setAgeIndex(nextAge);
    setSelectedGodId(null);
    setChronicle((c) => [
      ...c,
      {
        id: `ascend-${nextAge}`,
        chapter: ageLabel,
        title: `The ${ageLabel} began.`,
        text: "The mountain falls quiet. What was built is unbuilt, not by ruin but by the turning of the age itself — the way Hesiod once wrote that mankind passed from gold to silver to bronze, each age dimmer than the last, yet each one still remembered. Olympus will rise again, a little brighter than before.",
      },
    ]);
    fireNotification(`A new age dawns: ${ageLabel}`, "#F0D9A8", null, null, false, true);
    setActiveTab("chronicle");
    setLastSeenChronicleCount((c) => chronicle.length + 1);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const currentAgeName = ageIndex < AGE_NAMES.length ? AGE_NAMES[ageIndex] : `Iron Age, Cycle ${ageIndex - AGE_NAMES.length + 2}`;
  const unlockedResources = GODS.filter((g) => built.includes(g.id));
  const selectedGod = selectedGodId ? GODS_BY_ID[selectedGodId] : null;
  const selectedStats = selectedGod ? (godStats[selectedGod.id] || { level: 0, worshippers: 0, priests: 0, hiereus: 0, oracle: 0, milestonesReached: [], milestoneBonus: 0 }) : null;
  const isSelectedBuilt = selectedGod ? built.includes(selectedGod.id) : false;

  if (showIntro) {
    const isNew = !initialSave;
    const recentEntries = chronicle.slice(-1);
    return (
      <div
        className="w-full flex flex-col items-center justify-start px-6 pt-12 pb-6 overflow-hidden"
        style={{
          height: "100dvh",
          background: "radial-gradient(ellipse at top, #332C18 0%, #221D10 55%, #15120A 100%)",
          fontFamily: "'EB Garamond', serif",
          color: "#EDE6D6",
        }}
      >
        <h1 className="font-display text-4xl tracking-wide mb-1.5 flex-shrink-0" style={{ color: "#D4A876" }}>Olympus Chronicle</h1>
        <p className="font-label text-base opacity-60 mb-8 tracking-wide flex-shrink-0">An idle chronicle of the Greek gods</p>
        <div className="max-w-md w-full text-center mb-8 flex-1 min-h-0 overflow-y-auto">
          <p className="font-label text-xs uppercase tracking-widest opacity-60 mb-3">
            {isNew ? "The story begins" : "When we last left Olympus"}
          </p>
          {/* Newest entry first — same order as the Chronicle tab — then up to two
              older ones beneath it, dimmed and smaller, as quiet context. */}
          {recentEntries.map((entry, i) => (
            <div
              key={entry.id ? `${entry.id}-${i}` : i}
              className={i === 0 ? "" : "mt-4 pt-4"}
              style={i === 0 ? undefined : { borderTop: "1px solid rgba(212,168,118,0.15)", opacity: 0.5 }}
            >
              {entry.title && (
                <p
                  className={`font-display mb-2 ${i === 0 ? "text-lg" : "text-sm mb-1"}`}
                  style={{ color: "#D4A876", textWrap: "balance" }}
                >
                  {entry.title}
                </p>
              )}
              <p
                className={`font-label leading-relaxed ${i === 0 ? "text-base opacity-90" : "text-sm"}`}
                style={{ fontStyle: entry.id === "prologue" ? "italic" : "normal", textWrap: "pretty" }}
              >
                {entry.text}
              </p>
            </div>
          ))}
        </div>
        <button
          onClick={() => setShowIntro(false)}
          className="px-8 py-3 rounded-sm font-display text-base tracking-wide flex-shrink-0"
          style={{ background: "rgba(212,168,118,0.14)", border: "1px solid rgba(212,168,118,0.45)", color: "#D4A876" }}
        >
          {isNew ? "Enter Olympus" : "Return to Olympus"}
        </button>
        <PantheonIcon size={300} height={104} style={{ color: "#D4A876", opacity: 0.12, marginTop: 40, flexShrink: 0 }} />
      </div>
    );
  }

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background: "radial-gradient(ellipse at top, #332C18 0%, #221D10 55%, #15120A 100%)",
        fontFamily: "'EB Garamond', serif",
        color: "#EDE6D6",
      }}
    >
      <style>{`
        .font-display { font-family: 'Cinzel', serif; }
        .font-label { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.06em; font-weight: 600; }

        .notif-anim { animation: softIn 0.45s ease-out forwards; }
        @keyframes softOut { from { opacity: 1; } to { opacity: 0; } }
        .notif-fadeout { animation: softOut 0.7s ease-in forwards; }
        @keyframes cornerIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes simpleFadeIn { from { opacity: 0; } to { opacity: 1; } }
        .notif-fade-simple { animation: simpleFadeIn 0.5s ease-out forwards; }
        .notif-corner-in { animation: cornerIn 0.5s ease-out forwards; }
        @keyframes cornerOut { from { opacity: 1; } to { opacity: 0; } }
        .notif-corner-fadeout { animation: cornerOut 0.9s ease-in forwards; }
        @keyframes confettiBurst {
          0% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(0) scale(1); }
          100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--ang)) translateX(46px) scale(0.4); }
        }
        .confetti-pop { animation: confettiBurst 0.7s ease-out forwards; }
        @keyframes sparkleDrift {
          0%   { opacity: 0; transform: translateY(4px) scale(0.4); }
          25%  { opacity: 1; transform: translateY(0) scale(1); }
          60%  { opacity: 0.7; transform: translateY(-6px) scale(0.85); }
          100% { opacity: 0; transform: translateY(-14px) scale(0.3); }
        }
        .sparkle-drift { animation: sparkleDrift 2.2s ease-in-out infinite; }
        @keyframes harvestReady {
          0%, 100% { opacity: 0.55; filter: drop-shadow(0 0 2px #C9E08A55); }
          50%      { opacity: 1;    filter: drop-shadow(0 0 6px #C9E08Acc); }
        }
        .harvest-ready { animation: harvestReady 1.8s ease-in-out infinite; }
        @keyframes insightRing {
          0% { transform: scale(1); opacity: 0.9; }
          100% { transform: scale(9); opacity: 0; }
        }
        .insight-ring { animation: insightRing 0.8s ease-out forwards; }
        @keyframes visionFloat {
          0% { transform: translate(0, 0); }
          25% { transform: translate(5px, -7px); }
          50% { transform: translate(-4px, 4px); }
          75% { transform: translate(-6px, -3px); }
          100% { transform: translate(0, 0); }
        }

        .vision-pulse { animation: visionPulse 2.4s ease-in-out infinite; transform-origin: center; }
        @keyframes visionBlink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(0.06); } }
        .vision-eye { animation: visionBlink 4.5s ease-in-out infinite; }

        .entry-anim { animation: fadeUp 0.4s ease-out; }
        @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -46px) scale(1); } }
        .float-pop { animation: floatUp 0.85s ease-out forwards; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(212,168,118,0.35); border-radius: 2px; }
        /* Reserves space for exactly 3 lines regardless of actual content length, so the
           Worshippers/Zakoros/Upgrade/Hiereus/Oracle panels never resize as their text
           changes — overflow is clipped rather than pushing the box taller. */
        .clamp-2 {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;

          min-height: 2.9em; /* 2 lines at this rule's own 1.45 line-height, not Tailwind's leading-snug */
        }

                          </p>
                        </div>
                      ))}
                    </div>
                    <p className="font-label text-xs text-center opacity-60 mt-4">
                      <button onClick={resetProgress} className="underline opacity-70 hover:opacity-100" style={{ color: "#C98A7A" }}>
                        Erase History
                      </button>
                    </p>
                  </>
                ) : (
                  <div
                    className="rounded-sm p-4 md:p-5 max-h-[560px] overflow-y-auto"
                    style={{ background: "rgba(151,158,136,0.06)", border: "1px solid rgba(212,168,118,0.28)" }}
                  >
                    {RITES_SECTIONS.map((section, si) => (
                      <div key={section.title} className="mb-5 last:mb-0">
                        <div className="flex items-center gap-3 my-4" style={{ marginTop: si === 0 ? 0 : undefined }}>
                          <div className="flex-1 h-px" style={{ background: "linear-gradient(to right, transparent, #D4A876)" }} />
                          <span className="font-display text-sm tracking-[0.15em] uppercase" style={{ color: "#D4A876" }}>{section.title}</span>
                          <div className="flex-1 h-px" style={{ background: "linear-gradient(to left, transparent, #D4A876)" }} />
                        </div>
                        {section.body.map((para, pi) => (
                          <p key={pi} className="text-base leading-relaxed opacity-90 mb-2 last:mb-0">
                            {renderRitesText(para)}
                          </p>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
            </div>
          </div>

      </div>

      <div className="fixed bottom-0 inset-x-0 z-40 px-4 pt-2" style={{ background: "linear-gradient(to top, #15120A 60%, transparent)", paddingBottom: "calc(0.75rem + env(safe-area-inset-bottom))" }}>
        <div className="max-w-5xl mx-auto relative">
          {offerPops.map((pop) => (
            <span
              key={pop.id}
              className="float-pop absolute left-1/2 -top-3 font-display text-sm pointer-events-none flex items-center gap-1"
              style={{ color: "#8fcfef", transform: `translateX(${pop.x}px)` }}
            >
              +{(1 + offeringBonus).toFixed(1).replace(/\.0$/, "")} <KleosBadge size={13} color="#8fcfef" />
            </span>
          ))}
          {(!hasOffered || (hasOffered && built.length === 0) || showFlowHint) && (
            <p className="font-label text-sm opacity-90 text-center mb-1.5">
              {!hasOffered
                ? "The mountain is silent. One offering lights the first spark."
                : built.length === 0
                ? kleos >= GODS_BY_ID["hestia"].kleosCost
                  ? "The spark is lit. Hestia's altar awaits."
                  : kleos > 0
                  ? "The spark is lit. Maybe a few more offerings."
                  : "The spark is lit. Raise Hestia's altar to let Kleos flow."
                : "Kleos flows on its own now — offerings just nudge it along."}
            </p>
          )}
          <button
            onClick={offer}
            className="w-full py-3 rounded-sm font-label text-sm tracking-wide transition-all active:scale-95 shadow-lg"
            style={{
              background: offerFlash ? "transparent" : "rgba(50,129,179,0.25)",
              border: offerFlash ? "1px solid rgba(50,129,179,0.35)" : "1px solid rgba(50,129,179,0.7)",
              color: "#8fcfef",
              opacity: offerFlash ? 0.6 : 1,
              transitionDuration: offerFlash ? "0ms" : "300ms",
              backdropFilter: "blur(4px)",
            }}
          >
            Make an Offering (+{(1 + offeringBonus).toFixed(1).replace(/\.0$/, "")} Kleos)
          </button>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OlympusChronicle />);

</script>
</body>
</html>
