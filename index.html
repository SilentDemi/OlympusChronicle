                      className="absolute left-1/2 hearth-arrow-pulse"
                      style={{
                        top: 8, transform: `translateX(-50%) rotate(${arrowRotation}deg)`,
                        fontSize: 30, color: "#D4A876", display: "inline-block", pointerEvents: "none",
                      }}
                    >
                      ↑
                    </span>
                    {/* The wind trail — always follows the ACTUAL swipe's own direction
                        and length, never a fixed "ideal" animation (deliberately, so the
                        screen never appears to "correct" the player's own gesture). Now
                        passes directly over the flame rather than in a separate box. */}
                    {judgementHearthGust && (
                      <div
                        key={judgementHearthGust.id}
                        className="absolute left-1/2"
                        style={{
                          bottom: 100,
                          width: 4, height: Math.min(140, Math.sqrt(judgementHearthGust.dx ** 2 + judgementHearthGust.dy ** 2)),
                          background: judgementHearthGust.ok ? "rgba(240,168,64,0.75)" : "rgba(201,194,174,0.4)",
                          borderRadius: 2,
                          transformOrigin: "bottom center",
                          transform: `translateX(-50%) rotate(${Math.atan2(judgementHearthGust.dx, -judgementHearthGust.dy) * (180 / Math.PI)}deg)`,
                          animation: "gustFade 0.45s ease-out forwards",
                          pointerEvents: "none",
                        }}
                      />
                    )}
                  </div>
                </div>
              );
            })()}
          </div>

      </div>

      <div className="fixed bottom-0 inset-x-0 z-40 px-4 pt-2" ref={offerBarRef} style={{ background: "linear-gradient(to top, #15120A 60%, transparent)", paddingBottom: "calc(0.75rem + env(safe-area-inset-bottom))" }}>
        <div className="max-w-5xl mx-auto relative">
          {offerPops.map((pop) => (
            <span
              key={pop.id}
              className={`${pop.silenceText ? "float-pop-slow" : "float-pop"} absolute left-1/2 -top-12 font-display text-base pointer-events-none flex items-center gap-1`}
              style={{ color: pop.silenceText ? "#C98A7A" : "#8fcfef", transform: `translateX(${pop.x}px)`, maxWidth: pop.silenceText ? 300 : "none", textAlign: "center" }}
            >
              {pop.silenceText ? (
                <span className="italic font-label text-sm px-2.5 py-1 rounded-sm" style={{ background: "rgba(15,12,8,0.88)", border: "1px solid rgba(201,138,122,0.3)", display: "inline-block" }}>{pop.silenceText}</span>
              ) : (
                <>
                  +{(offeringDisplayBase + offeringBonus).toFixed(1).replace(/\.0$/, "")} <KleosBadge size={13} color="#8fcfef" />
                  {pop.pantheonReduced && (
                    <span style={{ color: "#D4A876", marginLeft: 4 }}>-3s <HourglassIcon size={11} style={{ color: "#D4A876", display: "inline-block", verticalAlign: "-1px" }} /></span>
                  )}
                </>
              )}
            </span>
          ))}
          {(!hasOffered || (hasOffered && built.length === 0) || showFlowHint) && (
            <p className="font-label text-sm opacity-90 text-center mb-1.5">
              {!hasOffered
                ? "The mountain is silent. One offering lights the first spark."
                : built.length === 0
                ? kleos >= effectiveKleosCost(GODS_BY_ID["hestia"])
                  ? "The spark is lit. Hestia's altar awaits."
                  : kleos > 0
                  ? "The spark is lit. Maybe a few more offerings."
                  : "The spark is lit. Raise Hestia's altar to let Kleos flow."
                : "Kleos flows on its own now — offerings just nudge it along."}
            </p>
          )}
          <div className="flex items-stretch gap-2">
            {ageIndex === 0 && pantheonLevel > 0 && prometheusFireStolen && !pandoraCreated && giftDone && (() => {
              // Ring fill = total progress across all 13, out of 13×target — a "given" god
              // counts as a full target's worth even if its own pandoraProgress ticked
              // slightly past target before the tick noticed it crossed (tick granularity).
              const totalProgress = GODS.reduce(
                (sum, g) => sum + (pandoraDonations[g.id] ? TUNING.pandora.target : Math.min(pandoraProgress[g.id] || 0, TUNING.pandora.target)),
                0
              );
              const pandoraPct = totalProgress / (GODS.length * TUNING.pandora.target);
              return (
                <div
                  style={{
                    position: "relative", width: 48, height: 48, borderRadius: "50%", flexShrink: 0,
                    background: `conic-gradient(rgba(212,168,118,0.9) ${pandoraPct * 360}deg, rgba(201,194,174,0.18) ${pandoraPct * 360}deg)`,
                    padding: 3,
                  }}
                >
                  <button
                    onClick={() => setActiveTab(activeTab === "pandora" ? "build" : "pandora")}
                    className="relative w-full h-full rounded-full flex items-center justify-center shadow-lg"
                    style={{
                      background: activeTab === "pandora" ? "rgba(212,168,118,0.28)" : "#15120A",
                      border: "1px solid rgba(212,168,118,0.35)",
                    }}
                    title="A Gift to Mankind"
                  >
                    <PithosIcon size={22} style={{ color: "#D4A876" }} />
                  </button>
                </div>
              );
            })()}
            {/* The Hearth — same round-button slot Pandora's uses, but for Silver Age's
                own ending. The two never appear together (different ages), so there's no
                actual conflict reusing the position. Progress ring is now a thin SVG
                stroke circle (was a filled conic-gradient donut, like Pandora's own button
                still uses) — a request specifically for this button to read as a thin
                outline filling around the circumference, not a wedge filling radially. */}
            {ageIndex === 1 && pantheonLevel > 0 && !judgementDone && judgementStep >= 1 && (() => {
              const hearthPct = judgementHearthSwipes / TUNING.hearth.targetSwipes;
              const r = 22, circumference = 2 * Math.PI * r;
              return (
                <div style={{ position: "relative", width: 48, height: 48, flexShrink: 0 }}>
                  <svg width={48} height={48} style={{ position: "absolute", top: 0, left: 0, transform: "rotate(-90deg)" }}>
                    <circle cx={24} cy={24} r={r} fill="none" stroke="rgba(201,194,174,0.18)" strokeWidth={2} />
                    <circle
                      cx={24} cy={24} r={r} fill="none" stroke="rgba(212,168,118,0.9)" strokeWidth={2}
                      strokeDasharray={circumference} strokeDashoffset={circumference * (1 - hearthPct)}
                      strokeLinecap="round"
                      style={{ transition: "stroke-dashoffset 0.15s linear" }}
                    />
                  </svg>
                  <button
                    onClick={() => setActiveTab(activeTab === "hearth" ? "build" : "hearth")}
                    className="absolute rounded-full flex items-center justify-center shadow-lg"
                    style={{
                      top: 4, left: 4, width: 40, height: 40,
                      background: activeTab === "hearth" ? "rgba(212,168,118,0.28)" : "#15120A",
                      border: "1px solid rgba(212,168,118,0.35)",
                    }}
                    title="They failed the gods."
                  >
                    <HestiaIcon size={22} style={{ color: "#D4A876" }} />
                  </button>
                </div>
              );
            })()}
            <button
              onClick={offer}
              className="flex-1 py-3 rounded-sm font-label text-sm tracking-wide transition-all active:scale-95 shadow-lg"
              style={{
                background: offerFlash ? "transparent" : "rgba(50,129,179,0.25)",
                border: offerFlash ? "1px solid rgba(50,129,179,0.35)" : "1px solid rgba(50,129,179,0.7)",
                color: "#8fcfef",
                opacity: offerFlash ? 0.6 : 1,
                transitionDuration: offerFlash ? "0ms" : "300ms",
                backdropFilter: "blur(4px)",
              }}
            >
              Make an Offering (+{(offeringDisplayBase + offeringBonus).toFixed(1).replace(/\.0$/, "")} Kleos
              {Date.now() < pantheonWaitUntil.current && (
                <HourglassIcon size={12} style={{ color: "#8fcfef", marginLeft: 4, display: "inline-block", verticalAlign: "-1px" }} />
              )}
              )
            </button>
            {allBuilt && (() => {
              const nextPantheonGodId = built.find((id) => !pantheonDonations[id]);
              const tributeReady = pantheonLevel === 0 && nextPantheonGodId
                && Date.now() >= pantheonWaitUntil.current
                && (resources[nextPantheonGodId] || 0) >= pantheonCost(Object.keys(pantheonDonations).length);
              return (
                <button
                  onClick={() => setActiveTab(activeTab === "pantheon" ? "build" : "pantheon")}
                  className="relative flex-shrink-0 rounded-full flex items-center justify-center shadow-lg"
                  style={{
                    width: 48, height: 48,
                    background: activeTab === "pantheon" ? "rgba(212,168,118,0.28)" : "rgba(212,168,118,0.14)",
                    border: "1px solid rgba(212,168,118,0.55)",
                  }}
                  title="The Pantheon"
                >
                  <PantheonIcon size={30} height={10.5} style={{ color: "#D4A876" }} />
                  {tributeReady && (
                    <span
                      style={{
                        position: "absolute", top: 3, right: 3,
                        width: 8, height: 8, borderRadius: "50%",
                        background: "#8fcfef",
                        boxShadow: "0 0 5px 1px rgba(143,207,239,0.8)",
                      }}
                    />
                  )}
                </button>
              );
            })()}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<OlympusChronicle />);

</script>
</body>
</html>
